        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          description: |
            Billing is not configured on the server, the session store cannot be read, or the
            database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  summary: Billing not configured
                  value:
                    success: false
                    statusCode: 503
                    message: Billing is not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
