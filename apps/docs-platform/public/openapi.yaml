        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: "null"
    ApiKeyScope:
      type: string
      description: |
        API key scopes are a fixed set — requesting any other value fails with `400`. Each scope maps
        to the `requireApiKeyScopes(...)` gate on the corresponding routes. Scope checks apply only to
        API-key callers; session callers are not scope-gated.
      enum:
        - user:read
        - user:write
        - resume:read
        - resume:write
        - roadmap:read
        - changelog:read
        - github:read
        - ai:write
    ApiKeyListItem:
      type: object
      description: |
        The trimmed shape returned by `GET /api-keys`. The secret is **not** included in any form —
        not even masked. Use `keyPrefix` to identify a key in a list.
      required:
        - id
        - name
        - keyPrefix
        - isActive
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
          description: First 8 characters of the key (`vw_` plus 5 hex characters).
          example: vw_a1b2c
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsed:
          type:
            - string
            - "null"
          format: date-time
          description: Written at most once every 5 minutes per key, so it lags real usage slightly.
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the key stops working. With `revokedAt`, this tells an expired key from a revoked one.
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the key was revoked, by the user or by a rotation, or `null`.
    ApiKeySecret:
      type: object
      description: |
        Returned only by `POST /api-keys` and `POST /api-keys/{id}/rotate`. `key` is the full secret
        and is shown exactly once — it is stored only as an HMAC-SHA256 hash and cannot be retrieved
        again.
      required:
        - id
        - key
        - keyPrefix
        - keySuffix
        - name
        - userId
        - isActive
        - rateLimit
        - scopes
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        key:
          type: string
          description: The full secret — `vw_` followed by 64 hex characters. Shown once, never again.
          example: vw_3f2a1c9e8b7d6f5a4c3b2a1908f7e6d5c4b3a29180706f5e4d3c2b1a09f8e7d6
        keyPrefix:
          type: string
          description: First 8 characters of `key`.
        keySuffix:
          type: string
          description: Last 8 characters of `key`.
        name:
          type: string
        userId:
          type: string
        isActive:
          type: boolean
        rateLimit:
          type: integer
          description: Requests allowed per 15-minute window for this key.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          description: Always set. Defaults to 365 days from creation when not supplied.
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastUsed:
          type:
            - string
            - "null"
          format: date-time
        rotatedFromId:
          type: string
          description: Only present on a rotate response — the id of the key this one replaced.
    ApiKeyListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          allOf:
            - type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ApiKeyListItem"
            - $ref: "#/components/schemas/OffsetPaginationMeta"
    ApiKeyCreateResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApiKeySecret"
    ApiKeyDetail:
      type: object
      description: |
        The full metadata record for a single key, returned by `GET /api-keys/{id}`. Identical to
        `ApiKeySecret` minus `key` — the secret itself is unrecoverable after creation.
      required:
        - id
        - keyPrefix
        - keySuffix
        - name
        - userId
        - isActive
        - rateLimit
        - scopes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        keyPrefix:
          type: string
          description: First 8 characters of the key.
        keySuffix:
          type: string
          description: Last 8 characters of the key. Not enough to reconstruct the secret.
        name:
          type: string
        userId:
          type: string
        isActive:
          type: boolean
        rateLimit:
          type: integer
          description: Requests allowed per 15-minute window for this key.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastUsed:
          type:
            - string
            - "null"
          format: date-time
          description: Written at most once every 5 minutes per key, so it lags real usage slightly.
    ApiKeyDetailResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApiKeyDetail"
    Document:
      type: object
      required:
        - id
        - userId
        - type
        - title
        - slug
        - tags
        - content
        - templateId
        - schemaVersion
        - revision
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - RESUME
            - COVER_LETTER
            - PORTFOLIO
            - LINK_IN_BIO
        title:
          type: string
        slug:
          type: string
          description: Unique per user. Also used as the portfolio subdomain slug for PORTFOLIO documents.
        tags:
          type: array
          items:
            type: string
        content:
          type: object
          additionalProperties: true
          description: Document-type-specific JSON payload (resume schema, portfolio schema, etc).
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
        templateId:
          type: string
          default: modern
        schemaVersion:
          type: integer
        revision:
          type: integer
          description: Incremented on every update. Required (and checked) on PATCH for optimistic concurrency control.
        visibility:
          type: string
          enum:
            - PRIVATE
            - UNLISTED
            - PUBLIC
        lastSyncedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Set by soft delete. Documents with a non-null deletedAt are excluded from list/get.
        portfolioSubdomain:
          type:
            - string
            - "null"
          description: A PORTFOLIO draft's chosen subdomain; `null` on every other type.
        moderatedPrivateAt:
          type:
            - string
            - "null"
          format: date-time
          description: |
            When a moderator made the document private. While set, the owner cannot share it or make
            it anything but `PRIVATE`.
    DocumentListResponse:
      type: object
      description: |
        One page of the list, `limit` documents (20 by default). Follow `nextCursor` for the rest.
      required:
        - success
        - message
        - data
        - serverTime
        - deleted
        - nextCursor
        - total
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          maxItems: 50
          description: This page's documents, at most `limit`.
          items:
            $ref: "#/components/schemas/DocumentSummary"
        serverTime:
          type: string
          format: date-time
          description: |
            The server's clock when the walk started, the same on every page of one walk. Send it as
            the next `updatedSince` once the last page has been read.
        deleted:
          type: array
          description: |
            Documents deleted at or after `updatedSince` (empty without it). Paged like `data`.
          items:
            type: object
            required:
              - id
              - deletedAt
            properties:
              id:
                type: string
              deletedAt:
                type: string
                format: date-time
        nextCursor:
          type:
            - string
            - "null"
          description: Send as `cursor` for the next page; `null` on the last page.
        total:
          type: integer
          description: The user's live documents of the requested type, whatever `updatedSince` says.
    DocumentListErrorResponse:
      type: object
      description: |
        A `400` from the document list: `details` is the failing fields for a validation error, or
        `{ code: "INVALID_DOCUMENT_CURSOR" }` for a bad cursor.
      required:
        - success
        - message
        - statusCode
      properties:
        success:
          type: boolean
        message:
          type: string
        statusCode:
          type: integer
        details:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
            - type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - INVALID_DOCUMENT_CURSOR
    DocumentSummary:
      type: object
      description: |
        A document as the list endpoint returns it. Carries no `userId`, `schemaVersion` or
        `deletedAt`, and carries `content` only when the request sets `includeContent=true`.
      required:
        - id
        - type
        - title
        - slug
        - tags
        - templateId
        - revision
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - RESUME
            - COVER_LETTER
            - PORTFOLIO
            - LINK_IN_BIO
        title:
          type: string
        slug:
          type: string
        tags:
          type: array
          items:
            type: string
        content:
          type: object
          additionalProperties: true
          description: Present only when `includeContent=true`.
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
        templateId:
          type: string
        revision:
          type: integer
        visibility:
          type: string
          enum:
            - PRIVATE
            - UNLISTED
            - PUBLIC
        lastSyncedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Document"
    DocumentUpdateResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/DocumentUpdateResult"
    DocumentUpdateResult:
      type: object
      description: |
        The updated document without `content` and `metadata`: an update sends the whole body, so it
        is not echoed back. `GET /documents/{id}` returns them.
      required:
        - id
        - userId
        - type
        - title
        - slug
        - tags
        - templateId
        - schemaVersion
        - revision
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - RESUME
            - COVER_LETTER
            - PORTFOLIO
            - LINK_IN_BIO
        title:
          type: string
        slug:
          type: string
        tags:
          type: array
          items:
            type: string
        templateId:
          type: string
        schemaVersion:
          type: integer
        revision:
          type: integer
          description: The new revision. Send it with the next update.
        visibility:
          type: string
          enum:
            - PRIVATE
            - UNLISTED
            - PUBLIC
        lastSyncedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
        portfolioSubdomain:
          type:
            - string
            - "null"
          description: A PORTFOLIO draft's chosen subdomain; `null` on every other type.
        moderatedPrivateAt:
          type:
            - string
            - "null"
          format: date-time
          description: When a moderator made the document private, or `null`.
    DocumentCreateRequest:
      type: object
      required:
        - type
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: |
            Optional client-generated id: 1 to 64 letters, digits, `-` or `_`. If the caller already
            has a live document with this id, it is returned as-is (idempotent create). An id another
            account uses is `409` "Document ID already in use"; one of the caller's documents in the
            trash is `409` "Document was deleted".
        type:
          type: string
          enum:
            - RESUME
            - COVER_LETTER
            - PORTFOLIO
            - LINK_IN_BIO
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          description: Normalised to a URL slug before it is stored.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
        content:
          type: object
          additionalProperties: {}
          description: If omitted for RESUME/COVER_LETTER, content is auto-seeded from the user's MasterProfile when one exists.
        metadata:
          type: object
          additionalProperties: {}
        templateId:
          type: string
          minLength: 1
          maxLength: 64
        visibility:
          type: string
          enum:
            - PRIVATE
            - UNLISTED
            - PUBLIC
    DocumentUpdateRequest:
      type: object
      required:
        - revision
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          description: Normalised to a URL slug before it is stored.
        updateShareSlug:
          type: boolean
          description: When true and an active share link exists, its slug is updated to track the new document slug.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
        content:
          type: object
          additionalProperties: {}
        metadata:
          type: object
          additionalProperties: {}
        templateId:
          type: string
          minLength: 1
          maxLength: 64
        visibility:
          type: string
          enum:
            - PRIVATE
            - UNLISTED
            - PUBLIC
        revision:
          type: integer
          minimum: 1
          description: Must match the document's current revision. Mismatch returns 409.
    AtsCategory:
      type: string
      enum:
        - parse
        - contact
        - structure
        - content
        - format
        - writing
        - integrity
      description: |
        The rule category. Integrity checks (hidden text, instructions aimed at an AI screener, a
        copied posting, keyword stuffing) deduct their impact from the score in points rather than
        weighing in its denominator.
    AtsRuleResult:
      type: object
      required:
        - id
        - category
        - severity
        - passed
        - evidence
        - scoreImpact
        - fix
      properties:
        id:
          type: string
          example: ats-v2.writing.tense
        category:
          $ref: "#/components/schemas/AtsCategory"
        severity:
          type: string
          enum:
            - info
            - warning
            - error
        passed:
          type: boolean
        evidence:
          type: string
          description: What was found, quoted where it can be.
        scoreImpact:
          type: number
          description: The weight the rule cost here (for an integrity rule, the points deducted). 0 when passed.
        fix:
          type: string
    AtsKeywordGroups:
      type: object
      required:
        - hard
        - soft
      description: Posting terms by kind, each group at most 12. Soft skills weigh less in `jobMatchScore`.
      properties:
        hard:
          type: array
          maxItems: 12
          items:
            type: string
        soft:
          type: array
          maxItems: 12
          items:
            type: string
    AtsAdvice:
      type: object
      required:
        - id
        - kind
        - message
      description: |
        Something worth knowing that is not scored: the file (name, size, password, tracked
        changes), details that can invite age bias where the region asks, and notes about a named
        applicant tracking system. Never part of the score, the categories, the failed checks or the
        fixes.
      properties:
        id:
          type: string
          example: file.name
        kind:
          type: string
          enum:
            - file
            - age
            - ats
        message:
          type: string
        evidence:
          type: string
          description: What was found, quoted. Absent when there is nothing to quote.
        fix:
          type: string
        source:
          type: string
          description: For an `ats` note, the vendor's public page that documents it.
    AtsReport:
      description: |
        Deterministic, rule-based ATS report. Computed entirely server-side without calling any AI
        model. Shape depends on the caller's auth state: anonymous requests to `/ats/check` get
        `AtsRestrictedReport` (scores, verdict and counts); any signed-in caller (free or paid) gets
        `AtsFullReport`. `/ats/analyze` requires a signed-in caller and always returns
        `AtsFullReport`.
      oneOf:
        - $ref: "#/components/schemas/AtsFullReport"
        - $ref: "#/components/schemas/AtsRestrictedReport"
    AtsFullReport:
      type: object
      description: Full deterministic report — every rule's evidence, all matched/missing keywords, all prioritized fixes. Requires a signed-in caller.
      required:
        - version
        - restricted
        - verdict
        - readinessScore
        - jobMatchScore
        - matchedKeywords
        - missingKeywords
        - matchedKeywordGroups
        - missingKeywordGroups
        - parsingWarnings
        - strengths
        - failedChecks
        - prioritizedFixes
        - rules
        - categories
        - checksPassed
        - checksTotal
        - wordCount
        - parsed
        - locale
        - engine
        - requirements
        - advice
      properties:
        version:
          type: string
          description: The scoring policy's declared version.
          example: ats-v2
        restricted:
          type: boolean
          enum:
            - false
        verdict:
          type: string
          enum:
            - strong
            - needs-work
            - weak
        readinessScore:
          type: integer
        jobMatchScore:
          type:
            - integer
            - "null"
          description: Null without a job description.
        matchedKeywords:
          type: array
          maxItems: 12
          description: Posting terms the resume has, hard skills first, then soft.
          items:
            type: string
        missingKeywords:
          type: array
          maxItems: 12
          description: Posting terms the resume lacks, hard skills first, then soft.
          items:
            type: string
        matchedKeywordGroups:
          $ref: "#/components/schemas/AtsKeywordGroups"
        missingKeywordGroups:
          $ref: "#/components/schemas/AtsKeywordGroups"
        keywordCounts:
          type: object
          description: How many posting terms the resume has and lacks, past the 12 the lists show.
          required:
            - matched
            - missing
          properties:
            matched:
              type: integer
            missing:
              type: integer
        parsingWarnings:
          type: array
          description: |
            Every failed check that stops an ATS reading the document, then a note when the resume
            was cut at 50,000 characters, when the job posting was cut at 20,000 characters, and
            when the posting lists more than the 25 requirements that are judged.
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        failedChecks:
          type: array
          items:
            $ref: "#/components/schemas/AtsRuleResult"
        prioritizedFixes:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AtsRuleResult"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/AtsCategoryScore"
        checksPassed:
          type: integer
          description: Number of deterministic rules the resume passed.
        checksTotal:
          type: integer
          description: Total number of deterministic rules evaluated.
        wordCount:
          type: integer
          description: Words counted in the extracted resume text.
        parsed:
          $ref: "#/components/schemas/AtsParsedResume"
        locale:
          type: object
          required:
            - languages
            - region
            - unsupported
          description: |
            What the resume (and posting) were read as: the language packs used beyond the base
            vocabulary, and the region applied (from a +country-code phone number, else the
            language's usual country). Regions set phone and date conventions and weigh
            country-specific checks such as a stated date of birth or a photo.
          properties:
            languages:
              type: array
              items:
                type: string
                example: de
            region:
              type:
                - string
                - "null"
              example: DE
            unsupported:
              type:
                - string
                - "null"
              description: |
                The language the resume is written in when no pack reads it: an ISO 639 code
                (`it`), a script (`Cyrillic`), or `und`. A parsing warning says so. Null otherwise.
        engine:
          type: object
          required:
            - version
            - policy
          description: |
            What produced the report. The same input, reference date, engine version and policy
            fingerprint always give the same report.
          properties:
            version:
              type: string
              example: 0.21.0
            policy:
              type: string
              description: The policy's declared version and a hash of its content as applied, locale packs included.
              example: ats-v2+1a2b3c4d
        requirements:
          type: array
          maxItems: 25
          description: The job posting's requirements, each judged against the resume. Empty without a job description.
          items:
            $ref: "#/components/schemas/AtsRequirement"
        advice:
          type: array
          description: Unscored advice. See `AtsAdvice`.
          items:
            $ref: "#/components/schemas/AtsAdvice"
    AtsRequirement:
      type: object
      required:
        - text
        - importance
        - kind
        - status
        - terms
        - evidence
      description: |
        One requirement of the posting, as a per-qualification screener grades it. `unverifiable`
        means the resume cannot settle it — the right to work, a clearance — unless it states it.
      properties:
        text:
          type: string
          description: The requirement as the posting wrote it.
        importance:
          type: string
          enum:
            - required
            - preferred
        kind:
          type: string
          enum:
            - skills
            - experience
            - education
            - authorization
            - clearance
            - language
            - seniority
          description: "`seniority` is the level named in the job title, such as Senior. It comes first when there is one."
        status:
          type: string
          enum:
            - met
            - partial
            - missing
            - unverifiable
        terms:
          type: array
          description: What the requirement names, and whether the resume has each. Skills and languages.
          items:
            type: object
            required:
              - term
              - found
            properties:
              term:
                type: string
              found:
                type: boolean
        evidence:
          type: array
          maxItems: 2
          description: Resume lines that show it, quoted. Work history first, a skills list last.
          items:
            type: string
        detail:
          type: string
          description: For years, degrees, language levels and clearances, what was compared.
          example: 6 years in the work history, 5 asked
    AtsCategoryScore:
      type: object
      required:
        - category
        - score
        - passed
        - total
        - lost
        - possible
      description: |
        Per-area rollup of the deterministic rules, saying which part of the resume is losing points
        without revealing which rule fired or what it weighs. Signed-in callers only — the rollup
        carries most of the diagnostic value, so it is not part of the anonymous shape.
      properties:
        category:
          $ref: "#/components/schemas/AtsCategory"
        score:
          type: integer
          description: Percentage of this category's own weight the resume kept (0-100).
        passed:
          type: integer
          description: Rules in this category that passed.
        total:
          type: integer
          description: Rules evaluated in this category.
        lost:
          type: number
          description: Points this category actually cost.
        possible:
          type: number
          description: Worst-case points this category could have cost.
    AtsRestrictedReport:
      type: object
      required:
        - version
        - restricted
        - readinessScore
        - jobMatchScore
        - verdict
        - topFix
        - primaryWarning
        - checksPassed
        - checksTotal
        - matchedKeywordCount
        - missingKeywordCount
        - parsedRoleCount
        - remainingFixCount
        - advice
      description: |
        Returned instead of AtsFullReport when /ats/check is called anonymously. A diagnosis without
        the prescription: scores, a verdict, the single most serious problem and the single
        highest-impact fix stated in full, plus honest counts of everything withheld. No per-area
        rollup, no rule evidence, no keyword lists, and no recovered work history — the server never
        sends them, so there is nothing for a client to un-hide.
      properties:
        version:
          type: string
          example: ats-v2
        restricted:
          type: boolean
          enum:
            - true
        readinessScore:
          type: integer
        jobMatchScore:
          type:
            - integer
            - "null"
        verdict:
          type: string
          enum:
            - strong
            - needs-work
            - weak
        topFix:
          type:
            - string
            - "null"
          description: The single highest-impact fix, in full. The rest of the list requires a signed-in caller.
        primaryWarning:
          type:
            - string
            - "null"
          description: |
            The most serious parsing or formatting failure, phrased as the risk it creates. Structural
            failures outrank heavier content ones here because a candidate cannot self-diagnose them:
            a missing keyword is visible by reading the posting, a column layout that scrambles your
            job titles on extraction is not.
        checksPassed:
          type: integer
        checksTotal:
          type: integer
        matchedKeywordCount:
          type: integer
          description: How many job-description terms the resume covers. The terms themselves require a signed-in caller.
        missingKeywordCount:
          type: integer
          description: How many job-description terms the resume is missing. The terms themselves require a signed-in caller.
        parsedRoleCount:
          type: integer
          description: How many work-history rows were recovered. The rows themselves require a signed-in caller.
        remainingFixCount:
          type: integer
          description: Prioritised fixes beyond the one shown.
        advice:
          type: array
          description: Each piece of advice as its id, kind and message. The evidence, fix and source stay in the full report.
          items:
            type: object
            required:
              - id
              - kind
              - message
            properties:
              id:
                type: string
              kind:
                type: string
                enum:
                  - file
                  - age
                  - ats
              message:
                type: string
    AtsAiInsights:
      type:
        - object
        - "null"
      description: Null when the AI step was skipped (e.g. `/check`, which never calls AI).
      properties:
        explanation:
          type: string
        missingEvidence:
          type: array
          items:
            type: string
        keywordOpportunities:
          type: array
          items:
            type: string
        recommendedImprovements:
          type: array
          items:
            type: string
        priorityOrder:
          type: array
          items:
            type: string
    AtsQuotaSummary:
      type: object
      properties:
        tier:
          type: string
          enum:
            - anonymous
            - free
            - paused
            - subscriber
          description: "subscriber: spendable AI credits from any source, or a subscription or pass in effect even with an empty wallet (a paying customer is never free). paused: a paused subscription and no credits; the free limits apply. free: any other signed-in account, including one whose payment failed."
        limit:
          type: integer
          description: 1 for anonymous callers per 48h window, 2 for free and paused logged-in users per 24h window, 300 for subscribers per billing period.
        used:
          type: integer
        remaining:
          type: integer
        resetsAt:
          type: string
          format: date-time
        canConvertResume:
          type: boolean
          description: |
            True when the caller's credit balance (from any source) covers a resume conversion
            (`/ats/convert-resume`). False when `pricing` is null.
        canRepair:
          type: boolean
          description: |
            True when this deployment offers the AI parse repair (`repairParse` on `/ats/analyze`)
            and the caller's credit balance covers it. Offer repair only when this is true.
        pricing:
          type:
            - object
            - "null"
          description: |
            Credit prices of the ATS AI actions. Null when the server could not load its ATS AI
            settings; conversion and repair are then off.
          properties:
            analysisCredits:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer
            jobUrlAnalysisCredits:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer
            resumeConversionCredits:
              type: integer
            parseRepairCredits:
              type:
                - integer
                - "null"
              description: |
                Credits charged by the optional AI parse repair (`repairParse` on `/ats/analyze`),
                on top of the analysis. `null` when this deployment does not offer repair.
        extract:
          type: object
          description: Separate budget for resume file uploads (POST /ats/extract) — does not share the scan quota above.
          properties:
            limit:
              type: integer
            used:
              type: integer
            remaining:
              type: integer
    AtsQuotaResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/AtsQuotaSummary"
    AtsParsedResume:
      type: object
      required:
        - name
        - email
        - phone
        - links
        - roles
        - education
        - skills
        - certifications
        - spokenLanguages
        - monthsOfExperience
        - highestIsced
        - provenance
      description: |
        The fields an applicant tracking system recovers from the document — the "what the ATS sees"
        view. Produced by the same deterministic pass as the scores, so it never costs a second scan.
        A blank employer or a missing date range is a column a recruiter's filter cannot match on,
        which is why the rows are returned verbatim rather than only summarised.
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        links:
          type: array
          items:
            type: string
        roles:
          type: array
          description: One row per job, in the shape an ATS stores it.
          items:
            type: object
            required:
              - title
              - employer
              - start
              - end
              - current
            properties:
              title:
                type: string
              employer:
                type: string
              current:
                type: boolean
              start:
                $ref: "#/components/schemas/AtsParsedDate"
              end:
                $ref: "#/components/schemas/AtsParsedDate"
        education:
          type: array
          items:
            type: object
            required:
              - school
              - credential
              - isced
              - end
            properties:
              school:
                type: string
              credential:
                type: string
              isced:
                type:
                  - integer
                  - "null"
                enum:
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
                  - 8
                  - null
                description: The ISCED 2011 level of the credential — 3 upper secondary (Abitur, Class XII), 6 bachelor's or equivalent, 7 master's or equivalent (a German Diplom), 8 doctoral.
              end:
                $ref: "#/components/schemas/AtsParsedDate"
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          description: Certifications and licences, from their own section or a "Certifications:" line.
          items:
            type: object
            required:
              - name
              - issuer
              - date
              - expires
            properties:
              name:
                type: string
              issuer:
                type: string
              date:
                $ref: "#/components/schemas/AtsParsedDate"
              expires:
                $ref: "#/components/schemas/AtsParsedDate"
        spokenLanguages:
          type: array
          description: Languages spoken, each once. Programming languages stay in `skills`.
          items:
            type: object
            required:
              - language
              - level
              - cefr
            properties:
              language:
                type: string
                description: As written, such as `Deutsch`.
              level:
                type: string
                description: The level as written, such as `native`. Empty when none was given.
              cefr:
                type:
                  - string
                  - "null"
                enum:
                  - A1
                  - A2
                  - B1
                  - B2
                  - C1
                  - C2
                  - null
                description: The CEFR level, or null when no known level word was given.
        monthsOfExperience:
          type:
            - integer
            - "null"
          description: Calendar months covered by at least one role, so overlapping jobs are counted once.
        highestIsced:
          type:
            - integer
            - "null"
          enum:
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
            - null
          description: The highest ISCED 2011 level among the education entries.
        provenance:
          type: object
          description: |
            Where each group of fields came from. `parser` was read from the text by the deterministic
            parser — what an ATS would see. `structured` was taken from the typed fields of an
            `AtsResumeDocument` or a JSON Resume. `ai` was recovered by the optional parse repair and
            grounded against the text. `none` means nothing was recovered.
          required:
            - name
            - email
            - phone
            - roles
            - education
            - skills
            - certifications
            - spokenLanguages
          properties:
            name:
              $ref: "#/components/schemas/AtsProvenance"
            email:
              $ref: "#/components/schemas/AtsProvenance"
            phone:
              $ref: "#/components/schemas/AtsProvenance"
            roles:
              $ref: "#/components/schemas/AtsProvenance"
            education:
              $ref: "#/components/schemas/AtsProvenance"
            skills:
              $ref: "#/components/schemas/AtsProvenance"
            certifications:
              $ref: "#/components/schemas/AtsProvenance"
            spokenLanguages:
              $ref: "#/components/schemas/AtsProvenance"
    AtsParsedField:
      type: string
      enum:
        - name
        - email
        - phone
        - roles
        - education
        - skills
        - certifications
        - spokenLanguages
    AtsProvenance:
      type: string
      enum:
        - parser
        - structured
        - ai
        - none
    AtsResumeInput:
      description: |
        The resume, in any of three shapes:

        - **Text** — extracted from a file or pasted. Parsed deterministically.
        - **`AtsResumeDocument`** — structured data, identified by `format: "ats-resume@1"`. The ATS
          record is read from its fields; the content checks run on its rendered text. An invalid
          document is rejected with 400 before any quota is consumed.
        - **JSON Resume** (jsonresume.org) — recognised by shape and read the same way as a document.
          One that exceeds the document limits is scored as flattened text instead.

        Any other object is flattened to text, keys on their own lines.
      oneOf:
        - type: string
          minLength: 1
          maxLength: 50000
          description: Trimmed first; it must not be empty after trimming.
        - $ref: "#/components/schemas/AtsResumeDocument"
        - type: object
          additionalProperties: true
    AtsResumeDocument:
      type: object
      required:
        - format
        - basics
        - sections
      description: |
        A resume as structured data. Dates are `YYYY-MM` or `YYYY`. Sections are in page order;
        leave out hidden ones. `title` is the heading as printed, in the resume's own language.
      properties:
        format:
          type: string
          enum:
            - ats-resume@1
        basics:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              maxLength: 200
            headline:
              type: string
              maxLength: 500
            email:
              type: string
              maxLength: 320
            phone:
              type: string
              maxLength: 64
            location:
              type: string
              maxLength: 300
            links:
              type: array
              maxItems: 50
              items:
                type: string
                maxLength: 2048
        sections:
          type: array
          maxItems: 40
          items:
            type: object
            required:
              - kind
              - title
            description: |
              `summary` carries `text`; every other kind carries `items` (at most 200):
              `experience` — { title, employer, location?, start?, end?, current?, summary?, highlights? };
              `education` — { school, credential?, field?, start?, end?, current?, summary? };
              `projects` — { name, role?, url?, summary?, highlights?, skills? };
              `skills` — { name?, keywords };
              `other` — { heading?, lines? }, for certifications, awards, languages and the like.
              Sections in `other` never count toward years of experience.
            properties:
              kind:
                type: string
                enum:
                  - summary
                  - experience
                  - education
                  - projects
                  - skills
                  - other
              title:
                type: string
                maxLength: 200
              text:
                type: string
                maxLength: 10000
              items:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: true
    AtsParsedDate:
      type:
        - object
        - "null"
      properties:
        year:
          type: integer
        month:
          type:
            - integer
            - "null"
          description: Null when the resume gave only a year.
    AtsLayoutSignals:
      type: object
      required:
        - columnRatio
        - tableCount
        - pageCount
      description: |
        Page geometry measured while parsing an uploaded document, for the format checks that text
        alone cannot answer. Returned by `POST /ats/extract` and accepted back by `/ats/check` and
        `/ats/analyze`. When it is omitted, the rules that depend on it are left out of the report
        entirely — neither passed nor failed — and out of the score's denominator.

        A count above its bound is held at the bound rather than rejected: 500 for `tableCount` and
        `imageCount`, 200 for `pageCount` and `imageOnlyPages`, 100,000 for `hiddenTextChars`,
        `trackedChanges` and `comments`.
      properties:
        columnRatio:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
          description: Share of content lines split across a horizontal gutter — the signature of a two-column layout, sidebar, or floating text box, all of which extract in a scrambled reading order. Null when the document had too few content lines for the measurement to carry signal.
        tableCount:
          type: integer
          minimum: 0
          description: Number of ruled table grids found by tracing the page's vector drawing operators.
        pageCount:
          type: integer
          minimum: 0
        imageCount:
          type: integer
          minimum: 0
          description: Images printed at least 50pt a side and smaller than half the page — most likely a photo. Absent when not measured, which leaves the photo check out of the report.
        hiddenTextChars:
          type: integer
          minimum: 0
          description: |
            Characters an ATS reads but a reader cannot see — in the background's colour or close to
            it, under 2pt, off the page, invisible, transparent, or covered by an image. The OCR text
            layer of a scan is not counted. Feeds the integrity check `ats-v2.integrity.hiddenText`.
        hiddenText:
          type: string
          maxLength: 5000
          description: All of that hidden text, whitespace collapsed, cut to 5,000 characters.
        hiddenTextRead:
          type: string
          maxLength: 5000
          description: The part of `hiddenText` that the document's text also holds, which is what an ATS reads.
        imageOnlyPages:
          type: integer
          minimum: 0
          description: Pages that are an image with no text layer — a scan, or a page saved as a picture.
        metadataText:
          type: string
          maxLength: 2000
          description: The file's title, subject, keywords and author. Never scored as resume text; read only for instructions aimed at an AI screener.
        encrypted:
          type: boolean
          description: A PDF that opened without a password but is encrypted. Read by the advice only, never the score.
        trackedChanges:
          type: integer
          minimum: 0
          description: Tracked changes still in a Word document. Read by the advice only, never the score.
        comments:
          type: integer
          minimum: 0
          description: Comments still in a Word document. Read by the advice only, never the score.
    AtsExtractResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            text:
              type: string
              description: Plain text extracted from the uploaded PDF, DOCX, HTML, TXT, Markdown, or JSON resume file (max ~50,000 characters).
            layout:
              $ref: "#/components/schemas/AtsLayoutSignals"
            quota:
              $ref: "#/components/schemas/AtsQuotaSummary"
    AtsFileInfo:
      type: object
      description: The uploaded file's name and size, sent back by the client for the file advice. Never scored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        bytes:
          type: integer
          minimum: 0
          maximum: 104857600
    AtsCheckRequest:
      type: object
      required:
        - resume
      properties:
        resume:
          $ref: "#/components/schemas/AtsResumeInput"
        jobDescription:
          type: string
          maxLength: 20000
          description: Optional plain-text job description to compute a jobMatchScore against. Surrounding spaces are trimmed.
        layout:
          $ref: "#/components/schemas/AtsLayoutSignals"
        file:
          $ref: "#/components/schemas/AtsFileInfo"
    AtsCheckResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            report:
              $ref: "#/components/schemas/AtsReport"
            ai:
              type: "null"
            creditsSpent:
              type: integer
              enum:
                - 0
            quota:
              $ref: "#/components/schemas/AtsQuotaSummary"
    AtsAnalyzeRequest:
      type: object
      required:
        - resume
        - requestId
      properties:
        resume:
          $ref: "#/components/schemas/AtsResumeInput"
        jobDescription:
          type: string
          maxLength: 20000
        jobUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Required when fetchJobUrl is true. Fetched server-side through an SSRF-hardened HTTPS-only fetcher (blocks localhost/private/link-local IPs, pins the resolved IP for the whole request, caps redirects to 3 and response size to 2MB; the page may go 8s without sending data and must finish within 15s).
        fetchJobUrl:
          type: boolean
          default: false
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          description: Client-generated idempotency key for the underlying AI credit reservation.
        layout:
          $ref: "#/components/schemas/AtsLayoutSignals"
        file:
          $ref: "#/components/schemas/AtsFileInfo"
          description: Accepted for parity with `/ats/check`, but not read by this endpoint.
        repairParse:
          type: boolean
          default: false
          description: |
            Opt in to the AI parse-repair pass. It runs only when this is true **and** the
            deterministic parse came back thin (`repair.available` in the response), and it spends
            credits separately from the analysis. Every value the model returns must occur in the
            resume text; values that do not are dropped and counted in `repair.rejectedValues`.
            Spends AI credits from any source (a plan, a pass or a credit pack).
    AtsAnalyzeResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          description: |
            AI insights are drawn from the same shared ATS scan-quota bucket consumed by `/ats/check` —
            there is only one ATS quota, not separate "scan" and "AI" allowances.
          properties:
            report:
              $ref: "#/components/schemas/AtsReport"
            ai:
              $ref: "#/components/schemas/AtsAiInsights"
            aiStatus:
              type: string
              enum:
                - ok
                - unavailable
              description: |
                `unavailable` means no model could be routed for this request — a server-side
                configuration problem, not a bad request. The deterministic report is still returned,
                `ai` is null, no credits are charged, and the scan quota unit is refunded, so
                `quota` reflects the balance after the refund.
            creditsSpent:
              type: integer
            repair:
              $ref: "#/components/schemas/AtsRepairSummary"
            quota:
              $ref: "#/components/schemas/AtsQuotaSummary"
            replayed:
              type: boolean
              description: |
                Present and `true` only when this is the stored answer to an earlier request with the
                same `requestId` and input. Nothing is charged again, and `quota` is the current one.
    AtsRepairSummary:
      type: object
      required:
        - available
        - applied
        - fields
        - rejectedValues
        - creditsSpent
        - unusable
      description: |
        Outcome of the optional AI parse-repair pass. Present on every analyze response, whether or
        not repair was requested, so a client can offer it when it would help.
      properties:
        available:
          type: boolean
          description: The deterministic parse was thin enough that a repair pass would likely help.
        applied:
          type: boolean
          description: Repair ran and filled at least one field.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AtsParsedField"
          description: |
            Fields in `report.parsed` supplied by the model rather than the deterministic parser.
            Repair only ever fills fields the parser left empty; it never overwrites one.
        rejectedValues:
          type: integer
          description: Values the model returned that do not occur in the resume and were dropped.
        creditsSpent:
          type: integer
          description: Credits spent on repair, in addition to the analysis `creditsSpent`.
        unusable:
          type: boolean
          description: Repair ran but the model's answer could not be used. Nothing was filled and nothing was charged for it.
    AtsConvertResumeRequest:
      type: object
      required:
        - resume
        - requestId
      properties:
        resume:
          type: string
          minLength: 1
          maxLength: 50000
          description: Raw resume text to convert into structured JSON Resume fields.
        requestId:
          type: string
          minLength: 8
          maxLength: 128
    AtsConvertedResume:
      type: object
      description: AI-extracted resume fields. Every field defaults to an empty string/array when not explicitly present in the source text — nothing is invented.
      properties:
        basics:
          type: object
          properties:
            fullName:
              type: string
            role:
              type: string
            headline:
              type: string
            email:
              type: string
            phone:
              type: string
            location:
              type: string
        links:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              url:
                type: string
        summary:
          type: string
        experience:
          type: array
          items:
            type: object
            additionalProperties: true
        education:
          type: array
          items:
            type: object
            additionalProperties: true
        projects:
          type: array
          items:
            type: object
            additionalProperties: true
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
    AtsConvertResumeResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            resume:
              $ref: "#/components/schemas/AtsConvertedResume"
            creditsSpent:
              type: integer
              description: |
                Credits spent on the conversion. They come from any source (a plan, a pass or a credit
                pack), independently of the shared ATS scan quota. A replay reports the conversion's
                price here although nothing is charged again.
            replayed:
              type: boolean
              description: |
                Present and `true` only when this is the stored answer to an earlier request with the
                same `requestId` and resume text.
    AiActionKey:
      type: string
      enum:
        - rewrite_short_text
        - rewrite_section
        - generate_section
        - generate_portfolio_copy
        - generate_cover_letter
        - tailor_resume_to_job
        - generate_document
    AiActionCost:
      type: object
      properties:
        costs:
          type: object
          properties:
            standard:
              type: integer
            expert:
              type: integer
    AiActionsResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          description: |
            Map of AI action key to its credit cost per mode, containing an entry for every action in
            `AiActionKey`. The values below are illustrative only — real costs come from server-side
            configuration, so read them from this endpoint rather than hardcoding them.
          additionalProperties:
            $ref: "#/components/schemas/AiActionCost"
          example:
            rewrite_short_text:
              costs:
                standard: 1
                expert: 3
            generate_cover_letter:
              costs:
                standard: 4
                expert: 10
    AiGenerateRequest:
      type: object
      required:
        - action
        - input
        - requestId
      properties:
        action:
          $ref: "#/components/schemas/AiActionKey"
        mode:
          type: string
          enum:
            - standard
            - expert
          default: standard
          description: Expert mode uses a stronger model at a higher credit cost.
        input:
          type: object
          description: |
            Required, though every field inside it is optional and defaults to an empty string. At
            least one of `text`, `context`, or `jobDescription` must be non-empty or the request fails
            with `400`. Each action also has its own limits for `text` and `context`, set in the
            server's AI policy and not published: over one, the request fails with `400` "Text
            exceeds the N character limit." (or "Context exceeds…"), naming the limit. A
            `jobDescription` over its action's limit is cut to that length, not refused.
          properties:
            text:
              type: string
              maxLength: 50000
              default: ""
            context:
              type: string
              maxLength: 50000
              default: ""
            jobDescription:
              type: string
              maxLength: 20000
              default: ""
              description: Silently truncated to the action's own job-description limit rather than rejected.
            instructions:
              type: string
              maxLength: 500
              default: ""
        requestId:
          type: string
          minLength: 8
          maxLength: 200
          description: Client-generated idempotency key. Credits are reserved against this id before generation and only committed on success — a failed or errored generation releases the reservation instead of spending credits.
        documentId:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional document to associate the credit transaction with.
    AiGenerateResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            content:
              type: string
            usage:
              type:
                - object
                - "null"
              properties:
                promptTokens:
                  type: integer
                completionTokens:
                  type: integer
                totalTokens:
                  type: integer
            credits:
              type: object
              properties:
                spent:
                  type: integer
                balance:
                  type: integer
                  description: AI credit wallet balance after this generation.
            replayed:
              type: boolean
              description: |
                Present and `true` only when this is the stored answer to an earlier request with the
                same `requestId` and input. Nothing is charged again.
    PortfolioPublicSummary:
      type: object
      properties:
        subdomain:
          type: string
        updatedAt:
          type: string
          format: date-time
    PortfolioPublicListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPublicSummary"
    PortfolioPublication:
      type: object
      description: |
        A published portfolio as the public site reads it. The billing state behind it (live, in
        grace) is not shown.
      required:
        - id
        - subdomain
        - templateId
        - snapshot
        - updatedAt
        - isPaid
        - isPremiumTemplate
        - isPremium
      properties:
        id:
          type: string
        subdomain:
          type: string
        templateId:
          type: string
          enum:
            - signal
            - atelier
            - nimbus
            - cipher
        snapshot:
          $ref: "#/components/schemas/PortfolioDraftContent"
          description: |
            The published content as a visitor may see it: visible sections only, `pages` only while
            `isPaid` (otherwise empty), and `identity.email` blank unless a visible Contact section
            shows it.
        updatedAt:
          type: string
          format: date-time
        isPaid:
          type: boolean
          description: |
            The owner's paid portfolio access (Creator Pro, the Job Hunter Bundle, a pass) is in
            effect, or its short grace period after a lapse is still running. It decides the badge
            and the extra pages on any template. Every site, free or paid, is served on its own
            subdomain. An AI Credits plan alone does not count.
        isPremiumTemplate:
          type: boolean
          description: The template is a premium one (`nimbus` or `cipher`). About the template only.
        isPremium:
          type: boolean
          deprecated: true
          description: "`isPaid` and `isPremiumTemplate` both true. Kept for renderers that have not moved to the two fields."
    PortfolioPublicResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/PortfolioPublication"
    PortfolioPublicationRecord:
      type: object
      description: |
        The stored publication row as the owner sees it. This is a different shape from the public read
        endpoint: it exposes the owner-only bookkeeping columns and has no `isPremium`.
      required:
        - id
        - userId
        - documentId
        - subdomain
        - templateId
        - snapshot
        - status
        - publishedRevision
        - publishedAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        documentId:
          type: string
        subdomain:
          type: string
        templateId:
          type: string
          enum:
            - signal
            - atelier
            - nimbus
            - cipher
        snapshot:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - LIVE
            - GRACE
            - SUSPENDED
        publishedRevision:
          type: integer
          description: The draft `revision` that was published.
        suspensionReason:
          type:
            - string
            - "null"
          description: |
            Why the portfolio is suspended: `user_unpublished`, `grace_expired`, a billing status
            (`ACTIVE`, `PAST_DUE`, `CANCELED` or `INACTIVE`) recorded by the billing job, or
            `moderation:<reason>` for a moderator's takedown.
        reasonBeforeModeration:
          type:
            - string
            - "null"
          description: The owner's or billing's own suspension reason that a moderator's takedown covers, restored when it is lifted; `null` when the site was online as the takedown went on.
        firstPublishedAt:
          type: string
          format: date-time
          description: When the portfolio first went online. A republish moves `publishedAt`, not this.
        suspendedAt:
          type:
            - string
            - "null"
          format: date-time
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PortfolioPublishResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/PortfolioPublicationRecord"
            - type: object
              required:
                - publicUrl
              properties:
                publicUrl:
                  type: string
                  description: |
                    `https://{subdomain}.veriworkly.com` in production, or
                    `http://{subdomain}.localhost:3004` in development. Added by the publish endpoint
                    only — it is not a stored column.
                  example: https://janedoe.veriworkly.com
    PortfolioUnpublishResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/PortfolioPublicationRecord"
          description: |
            The updated publication record with `status: SUSPENDED`. Never null: a caller who never
            published gets `404`. No `publicUrl` is included.
    PortfolioDraft:
      type: object
      description: |
        A trimmed projection of the caller's PORTFOLIO-type Document — not a full `Document`. Only the
        fields below are selected.
      required:
        - id
        - slug
        - templateId
        - content
        - revision
        - updatedAt
      properties:
        id:
          type: string
        slug:
          type: string
          description: |
            The subdomain the draft was last saved under. It is not the document's own slug: a rename or
            another document's slug never changes or blocks it. A PORTFOLIO document never saved as a
            draft shows its document slug.
        templateId:
          type: string
          description: |
            `signal`, `atelier`, `nimbus` or `cipher` once the draft has been saved through
            `PUT /portfolios/draft`. A PORTFOLIO document created through `/documents` and never saved
            as a draft keeps the template it was created with (`modern` by default).
        content:
          type: object
          additionalProperties: true
          description: The saved portfolio content snapshot.
        revision:
          type: integer
          description: Send this back as `revision` when saving or publishing.
        updatedAt:
          type: string
          format: date-time
    PortfolioDraftResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/PortfolioDraft"
    PortfolioPreview:
      type: object
      description: Same projection as `PortfolioDraft` minus `slug`.
      required:
        - id
        - templateId
        - content
        - revision
        - updatedAt
      properties:
        id:
          type: string
        templateId:
          type: string
          description: |
            `signal`, `atelier`, `nimbus` or `cipher` once the draft has been saved through
            `PUT /portfolios/draft`. A PORTFOLIO document created through `/documents` and never saved
            as a draft keeps the template it was created with (`modern` by default).
        content:
          type: object
          additionalProperties: true
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time
    PortfolioPreviewResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/PortfolioPreview"
    PortfolioMe:
      type: object
      properties:
        draft:
          description: Null when the caller has never saved a portfolio draft.
          oneOf:
            - $ref: "#/components/schemas/PortfolioDraft"
            - type: "null"
        publication:
          type:
            - object
            - "null"
          properties:
            subdomain:
              type: string
            status:
              type: string
              enum:
                - LIVE
                - GRACE
                - SUSPENDED
            offlineReason:
              type:
                - string
                - "null"
              enum:
                - moderation
                - owner
                - billing
                - null
              description: |
                Why the site is offline, `null` while it is `LIVE` or `GRACE`. `moderation`: a
                moderator took it down (a suspended site with no recorded reason reads the same, since
