      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            github:
              $ref: "#/components/schemas/ProfileImportQuota"
            linkedin:
              $ref: "#/components/schemas/ProfileImportQuota"
