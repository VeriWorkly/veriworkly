        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "502":
          description: The billing provider did not return a checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
