        reserved:
          type: integer
          description: Credits currently held by in-flight AI generations that have not yet committed or been released.
        available:
          type: integer
          description: Credits that can be spent now.
        lifetimeCredited:
          type: integer
        lifetimeDebited:
          type: integer
        nextExpiryAt:
          type:
            - string
            - "null"
          format: date-time
        nextExpiryCredits:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CreditWalletResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CreditWallet"
    CreditHistoryEntry:
      type: object
      required:
        - id
        - type
        - amount
        - balanceAfter
        - action
        - documentId
        - reason
        - metadata
        - createdAt
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - GRANT
            - DEBIT
            - REFUND
            - ADJUSTMENT
            - EXPIRATION
        amount:
          type: integer
          description: Signed change to the balance. Negative for a debit or an expiry.
        balanceAfter:
          type: integer
        action:
          type:
            - string
            - "null"
          description: The AI action the credits were spent on, when there was one.
        documentId:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CreditHistoryResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CreditHistoryEntry"
    CheckoutRequest:
      type: object
      required:
        - interval
      properties:
        productKey:
          type: string
          enum:
            - ai_credits
            - portfolio_pro
            - bundle
          default: portfolio_pro
          description: Validated against a fixed product/interval whitelist before being handed off to the Dodo Payments checkout API.
        interval:
          type: string
          enum:
            - one_day
            - seven_day
            - monthly
            - annual
        redirectUrl:
          type: string
          description: Relative path (must start with a single `/`) to return to after checkout.
          pattern: ^\/(?!\/)[^\\\s]*$
    CheckoutResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
              description: Dodo Payments hosted checkout URL to redirect the user to.
            reused:
              type: boolean
              description: True when an open checkout session for the same choice was handed back instead of a new one.
    CancelCheckoutResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            success:
              type: boolean
            cleared:
              type: array
              description: The products (`productKey`) and credit packs (`packKey`) whose open sessions were cleared.
              items:
                type: string
            stillProcessing:
              type: array
              description: Present when a credit pack's payment is still processing. Those sessions are kept (and still block account deletion) until the payment lands; they never stop the rest from being cleared.
              items:
                type: string
              example:
                - 500 extra credits
    BillingPortalResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
              description: Dodo Payments customer portal URL.
    CreditPackCheckoutRequest:
      type: object
      required:
        - packKey
      properties:
        packKey:
          type: string
          enum:
            - credit_pack_250
            - credit_pack_500
            - credit_pack_1200
        redirectUrl:
          type: string
          description: Relative path (must start with a single `/`) to return to after checkout.
          pattern: ^\/(?!\/)[^\\\s]*$
    CreditPackCheckoutResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
              description: Dodo Payments hosted checkout URL for the one-time credit pack purchase.
    CodedErrorResponse:
      type: object
      description: |
        An error whose `details` says why in machine form. `details.code` is stable; clients branch on
        it, not on the message. The other `details` fields depend on the code.
      required:
        - success
        - message
        - statusCode
        - details
      properties:
        success:
          type: boolean
        message:
          type: string
        statusCode:
          type: integer
        details:
          type: object
          required:
            - code
          additionalProperties: true
          properties:
            code:
              type: string
    PlanChangePreviewRequest:
      type: object
      description: An `idempotencyKey` field is accepted here too, and ignored; a preview changes nothing.
      required:
        - productKey
        - interval
      properties:
        productKey:
          type: string
          enum:
            - ai_credits
            - portfolio_pro
            - bundle
          description: The plan to price. Only an upgrade to `bundle` is accepted today.
        interval:
          type: string
          enum:
            - monthly
            - annual
          description: Must match the current subscription's billing period.
    PlanChangeRequest:
      type: object
      required:
        - productKey
        - interval
      properties:
        productKey:
          type: string
          enum:
            - ai_credits
            - portfolio_pro
            - bundle
          description: The plan to move to. Only an upgrade to `bundle` is accepted today.
        interval:
          type: string
          enum:
            - monthly
            - annual
          description: Must match the current subscription's billing period.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Body alternative to the `Idempotency-Key` header; the header wins when both are sent.
    PlanChangePreviewResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            productKey:
              type: string
              enum:
                - ai_credits
                - portfolio_pro
                - bundle
            interval:
              type: string
              enum:
                - monthly
                - annual
            dueNow:
              type: integer
              description: The total charged now for the rest of the current period (the provider's prorated quote), in the currency's minor unit.
            currency:
              type: string
              example: USD
            nextAmount:
              type: integer
              description: The new plan's recurring amount before tax, in the minor unit.
            nextBillingDate:
              type: string
              format: date-time
    PlanChangeResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: string
              enum:
                - pending
              description: The provider charges the difference; the plan moves once that payment succeeds and its webhook arrives. `GET /billing/me` shows the new plan then.
            productKey:
              type: string
              enum:
                - ai_credits
                - portfolio_pro
                - bundle
            interval:
              type: string
              enum:
                - monthly
                - annual
            paymentId:
              type:
                - string
                - "null"
            confirmed:
              type: boolean
              description: False when the provider's answer never arrived (the response is then `202`); the change may still apply.
            replayed:
              type: boolean
              description: Always present. `true` when this is the stored answer for an idempotency key already used, `false` on a fresh call.
    UsageEventRequest:
      type: object
      required:
        - event
      properties:
        event:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Normalized to lower case with spaces as `_`. Public callers may send only `resume_created`,
            `resume_deleted`, `resume_exported`, `cover_letter_exported`, `auth_otp_sent`,
            `dashboard_opened`, `roadmap_viewed`, `share_link_created`, `share_link_updated` and
            `share_link_revoked`. Internal callers (`x-internal-key`) may send any other name too:
            one that is not a known event is stored as `custom_<name>` (a name that already starts with
            `custom_` is kept as is).
        value:
          type: integer
          maximum: 1000
          description: Internal callers only; a public call always counts as 1.
          exclusiveMinimum: 0
    UsageEventResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            accepted:
              type: boolean
    DeleteAccountRequest:
      type: object
      properties:
        confirmAffiliateForfeit:
          type: boolean
          description: Send `true` after the user saw the `409 AFFILIATE_BALANCE_FORFEIT` amount and still wants the account deleted. The query parameter `confirmAffiliateForfeit=true` works the same way.
        confirmedAffiliateForfeitCents:
          type: integer
          minimum: 0
          description: The amount the user was shown, from `details.amountCents`. If the unpaid balance has grown past it, the request is refused again with the new amount.
    ShareLink:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        documentId:
          type: string
        slug:
          type: string
        token:
          type: string
          description: Same value as `slug` — the public path segment for this link.
        username:
          type: string
        documentSlug:
          type: string
        publicPath:
          type: string
          description: |
            Convenience path built from the owner's username and the link slug. Only returned by
            `POST /shares`, not by the list endpoint.
          example: /janedoe/my-resume
        hasPassword:
          type: boolean
          description: The scrypt password hash itself is never returned in any API response.
        allowDownload:
          type: boolean
          default: true
          description: |
            Whether the studio shows a Download button on the public page. A display preference, not a
            security control: the studio hides the Download button, and viewers can still save the page.
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        viewCount:
          type: integer
        lastViewedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShareLinkCreateRequest:
      type: object
      required:
        - documentId
        - snapshot
      properties:
        documentId:
          type: string
          minLength: 1
        snapshot:
          type: object
          additionalProperties: {}
          description: Static content snapshot captured at share time.
        password:
          type: string
          description: When provided, the link is scrypt-hashed and requires this password to view.
          minLength: 1
        expiresAt:
          description: 7, 14, 30 or 90 days from now (within a day), or the link's current expiry to keep it. Omitted or null (without noExpiry), a new link lasts 7 days and an existing one keeps its expiry; null does not mean never. Send noExpiry true for a link that never expires.
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        noExpiry:
          type: boolean
          description: true for a link that never expires. Not allowed together with expiresAt.
        updateSlug:
          type: boolean
          description: Regenerate the public slug instead of reusing the existing one (if a link already exists for this document).
        removePassword:
          type: boolean
        allowDownload:
          type: boolean
          default: true
          description: |
            Whether the studio shows a Download button on the public page. A display preference, not a
            security control: the studio hides the Download button, and viewers can still save the page.
            A new link defaults to true; replacing an existing link without this field keeps its value.
    ShareLinkResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ShareLink"
    ShareLinkListResponse:
      type: object
