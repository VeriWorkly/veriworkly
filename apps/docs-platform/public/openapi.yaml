  /api/v1/ai/generate:
    post:
      tags:
        - AI
      operationId: generateAiContent
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Generate AI Content
      description: |
        Runs an AI generation action (rewriting a section, generating a cover letter, tailoring a
        resume to a job description, etc). Requires the `ai:write` scope when called with an API key.

        Credits are handled with a two-phase reserve → commit/release flow: the cost for the chosen
        action + mode is reserved from the caller's AI credit wallet before the AI provider is called,
        then committed only after a successful response. If the AI call fails or errors out, the
        reservation is released instead of committed — a failed generation never burns credits.

        Expert mode uses a stronger, more expensive model than Standard mode for the same action.

        The body is validated before the caller is: a first-party request with no session and an
        invalid body gets `400`, not `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
            example:
              action: generate_cover_letter
              mode: standard
              input:
                text: ""
                context: 5 years of experience building React applications.
                jobDescription: We are looking for a Senior Frontend Engineer...
                instructions: Keep it under 300 words.
              requestId: ai-gen-8f3ac1e2b9
      responses:
        "200":
          description: Content generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGenerateResponse"
              example:
                success: true
                message: Success
                data:
                  content: Dear Hiring Manager, ...
                  usage:
                    promptTokens: 420
                    completionTokens: 280
                    totalTokens: 700
                  credits:
                    spent: 4
                    balance: 46
        "400":
          description: Validation error, or text/context exceeds the action's character limit. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Validation error, or text/context exceeds the action's character limit
                  value:
                    success: false
                    statusCode: 400
                    message: Provide text, context, or a job description for this AI action.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          description: Not enough AI credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 402
                message: Not enough AI credits. Credits come with a credit pack, a pass, AI Credits or the Job Hunter Bundle.
        "403":
          description: API key is missing the ai:write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: This API key does not have permission for this action.
        "409":
          description: |
            The `requestId` was already used (for another action or input, or it already completed
            or failed), it is still processing, or the credit balance changed while the credits were
            being held (retry the action).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noLongerReusable:
                  summary: The id cannot be reused
                  value:
                    success: false
                    statusCode: 409
                    message: This AI request id can no longer be reused.
                otherOperation:
                  summary: Id used for another action or input
                  value:
                    success: false
                    statusCode: 409
                    message: AI request id was already used for another operation.
                processing:
                  summary: The same request is still running
                  value:
                    success: false
                    statusCode: 409
                    message: This AI request is processing.
                completed:
                  summary: The request already completed
                  value:
                    success: false
                    statusCode: 409
                    message: This AI request already completed.
                balanceChanged:
                  summary: The balance moved while credits were held
                  value:
                    success: false
                    statusCode: 409
