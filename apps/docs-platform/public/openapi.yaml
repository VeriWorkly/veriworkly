  /api/v1/billing/subscription/change-plan/preview:
    post:
      tags:
        - Billing
      operationId: previewPlanChange
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Preview Plan Upgrade
      description: |
        Prices an upgrade of the live subscription without changing anything: what is charged now
        for the rest of the period, and what the new plan renews at. The body accepts any plan and
        any recurring interval, but only an upgrade to the `bundle` in the same billing period is
        carried out (the one `UPGRADE_AVAILABLE` from `POST /billing/checkout` offers). Any other
        change, a downgrade included, is refused with `409` and a `details.code`; to move to a
        smaller plan, cancel in the billing portal and subscribe again when the plan ends. Session-authenticated only; blocked for non-admins in
        production during the current rollout phase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangePreviewRequest"
            example:
              productKey: bundle
              interval: monthly
      responses:
        "200":
          description: The provider's quote for the upgrade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangePreviewResponse"
        "400":
          $ref: "#/components/responses/BodyValidationError"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "403":
          description: Payments disabled in production for non-admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
              example:
                success: false
                statusCode: 403
                message: Payments are disabled in production during this phase. Only administrators can perform payments.
                details:
                  code: PAYMENTS_DISABLED
        "409":
          description: |
            This plan cannot be changed this way. `details.code` is one of: `NO_SUBSCRIPTION`,
            `PLAN_CHANGE_UNAVAILABLE` (contact support), `PAYMENT_OUTSTANDING`,
            `SUBSCRIPTION_PAUSED`, `ALREADY_SUBSCRIBED`, `PLAN_CHANGE_NOT_UPGRADE` (only an upgrade
            to the bundle), `PLAN_CHANGE_INTERVAL` (the upgrade keeps the current billing period) or
            `SUBSCRIPTION_ENDING` (resume the subscription first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
              example:
                success: false
                statusCode: 409
                message: Your AI Credits plan is billed monthly. The upgrade keeps that billing period.
                details:
                  code: PLAN_CHANGE_INTERVAL
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "502":
          description: The billing provider could not price the upgrade; nothing was changed. `details.code` is `PROVIDER_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "503":
          description: The selected billing product is not configured. Also sent when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/billing/subscription/change-plan:
    post:
      tags:
        - Billing
      operationId: changePlan
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Upgrade Plan
      description: |
        Upgrades the live subscription to the `bundle` in place. As with the preview, the body
        accepts any plan and recurring interval, and any change other than that upgrade is refused
        with `409` and a `details.code`. The provider charges the prorated
        difference, and the plan, its features and its credits move once that payment succeeds and
        its webhook arrives; until then the answer is `status: "pending"`.

        An idempotency key is required, in the `Idempotency-Key` header or as `idempotencyKey` in
        the body (the header wins). Retrying with the same key never asks the provider twice: it
        returns the stored answer with `replayed: true`. Session-authenticated only; blocked for
        non-admins in production during the current rollout phase.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Required unless `idempotencyKey` is in the body; the header wins when both are sent. Only
            the first 128 characters are used: a longer value is cut, not refused.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeRequest"
            example:
              productKey: bundle
              interval: monthly
      responses:
        "200":
          description: "The provider accepted the change (`confirmed: true`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeResponse"
              example:
                success: true
                message: Success
                data:
                  status: pending
                  productKey: bundle
                  interval: monthly
                  paymentId: pay_123
                  confirmed: true
                  replayed: false
        "202":
          description: "The provider's answer never arrived (`confirmed: false`). The change may still apply; it is held as pending, and a retry with the same key replays this answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeResponse"
        "400":
          description: The body is invalid, or no idempotency key was sent (`details.code` `IDEMPOTENCY_KEY_REQUIRED`). A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                keyRequired:
                  summary: No idempotency key
                  value:
                    success: false
                    statusCode: 400
                    message: An idempotency key is required to change plans.
                    details:
                      code: IDEMPOTENCY_KEY_REQUIRED
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "403":
          description: Payments disabled in production for non-admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
              example:
                success: false
                statusCode: 403
                message: Payments are disabled in production during this phase. Only administrators can perform payments.
                details:
                  code: PAYMENTS_DISABLED
        "409":
          description: |
            The change was refused. `details.code` is one of the preview's codes, or
            `PLAN_CHANGE_PENDING` (a change for this subscription is already waiting for its
            payment) or `IDEMPOTENCY_KEY_REUSED` (this key was used for a different plan change).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
              example:
                success: false
                statusCode: 409
                message: A plan change for this subscription is already in progress. It completes once the payment is confirmed.
                details:
                  code: PLAN_CHANGE_PENDING
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "502":
          description: The billing provider refused the change; nothing was changed and the same key may try again. `details.code` is `PROVIDER_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "503":
          description: The selected billing product is not configured. Also sent when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/shares:
    post:
      tags:
        - Shares
      operationId: createShareLink
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Create Share Link
      description: |
        Creates (or replaces, if one already exists for this document) a public share link for a
        document. Optionally password-protected — passwords are scrypt-hashed and never returned in
        any response.

        A link expires 7, 14, 30 or 90 days after it is made, or never. Send `noExpiry: true` for
        never, or an `expiresAt` 7, 14, 30 or 90 days from now (within a day, for clock skew). With
        neither (an `expiresAt` of `null` counts as neither, not as never), a new link lasts **7 days**
        and replacing an existing link keeps its expiry. Any
        other date, or `noExpiry` together with a date, is `400`.

        The caller **must have claimed a username first**, since it forms the public URL
        (`/{username}/{slug}`); without one the request fails with `400`. Requires the
        `resume:write` scope when called with an API key.

        The snapshot may be at most 1,000,000 bytes once serialized (`413` otherwise); the whole
        body may be at most 4 MB. It is not echoed in the response, nor in the owner's list of
        links.

        `allowDownload` (default `true`) says whether the public page shows a Download button.
        Replacing an existing link without it keeps the stored value. It is a display preference,
        not a security control: the studio hides the Download button, and viewers can still save
        the page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareLinkCreateRequest"
            example:
              documentId: doc_123
              snapshot: {}
              noExpiry: true
      responses:
        "201":
          description: Share link created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "400":
          description: Validation error, the caller has not claimed a username yet, or the document is not a résumé or cover letter. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noUsername:
                  summary: Username not set
                  value:
                    success: false
                    statusCode: 400
                    message: Username required before sharing
                notShareable:
                  summary: Document type cannot be shared
                  value:
                    success: false
                    statusCode: 400
                    message: Only résumés and cover letters can be shared by link.
                validation:
                  summary: Validation error
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: documentId
                        message: String must contain at least 1 character(s)
                badExpiry:
                  summary: An expiry that is not one of the allowed periods
                  value:
                    success: false
                    statusCode: 400
                    message: "A share link expires 7, 14, 30 or 90 days from now, or never (noExpiry: true)."
                expiryConflict:
                  summary: noExpiry together with expiresAt
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: expiresAt
                        message: Send either noExpiry or expiresAt, not both.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            A moderator made this document private ("This document was made private by a
            moderator."), or made another of the account's résumés or cover letters private (a
            trashed one too, until retention purges it). No link is created or refreshed on the
            account until a moderator lifts it. A portfolio takedown does not pause sharing. An API
            key without `resume:write` also gets `403`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Another of the account's documents was made private
                  value:
                    success: false
                    statusCode: 403
                    message: A moderator made one of your résumés or cover letters private, so new share links are paused until a moderator lifts it.
                thisDocument:
                  summary: This document was made private
                  value:
                    success: false
                    statusCode: 403
                    message: This document was made private by a moderator.
                scope:
                  summary: API key missing the required scope
                  value:
                    success: false
                    statusCode: 403
                    message: This API key does not have permission for this action.
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Document not found
        "413":
          description: |
            A body over 4 MB is refused by the parser with "Request body too large". A smaller body
            whose snapshot is over 1,000,000 bytes once serialized gets its own message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                snapshotTooLarge:
                  summary: Snapshot over 1,000,000 bytes
                  value:
                    success: false
                    statusCode: 413
                    message: The shared document is too large. Shorten it and share again.
                bodyTooLarge:
                  summary: Body over the route's parser limit
                  value:
                    success: false
                    statusCode: 413
                    message: Request body too large
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/shares/documents/shared-ids:
    get:
      tags:
        - Shares
      operationId: listSharedDocumentIds
      security:
        - ApiKeyAuth: []
        - LocalSession: []
