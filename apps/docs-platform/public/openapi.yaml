                suspended it. The moderator's note itself is not returned.
            publishedRevision:
              type: integer
            publishedAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        billing:
          type: object
          additionalProperties: true
          description: Same shape as the Billing "/billing/me" response.
    PortfolioMeResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/PortfolioMe"
    PortfolioAssetReference:
