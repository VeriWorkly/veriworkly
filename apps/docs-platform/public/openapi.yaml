      responses:
        "200":
          description: Shared document ids fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDocumentIdsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/shares/documents/{documentId}:
    get:
      tags:
        - Shares
      operationId: listShareLinksForDocument
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: List Share Links For Document
      description: Returns the (at most one) share link for a document, offset-paginated for shape consistency with other list endpoints.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: |
            Links per page. Read leniently: a value above 50 is lowered to 50, and a value that is
            not a positive integer is ignored (the default applies). Neither is refused.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Rows to skip. A value that is not a non-negative integer is ignored.
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: 1-based page index, an alternative to `offset`. Read leniently like `limit`.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
          description: Alternative spelling of `limit`. Takes precedence over `limit` when both are sent.
      responses:
        "200":
          description: Share links fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkListResponse"
        "400":
          description: "`offset` (or `page`) reaches past row 1,000,000."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 400
                message: Validation failed
                details:
                  - path: offset
                    message: Must not reach past row 1000000
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/shares/documents/{documentId}/links/{shareLinkId}:
    delete:
      tags:
        - Shares
      operationId: revokeShareLink
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Revoke Share Link
      description: |
        Deletes the share link, immediately breaking its public URL. `data` is `null` on success.
        Requires the `resume:write` scope when called with an API key. An account that has not
        claimed a username gets `400` "Username required before sharing" before the link is looked
        up.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: shareLinkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Share link revoked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                success: true
                message: Share link revoked successfully
                data: null
        "400":
          description: The account has not claimed a username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 400
                message: Username required before sharing
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "404":
          description: Share link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Share link not found
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/shares/public/{username}/{slug}:
    get:
      tags:
        - Shares
      operationId: getPublicShareLink
      summary: Get Public Share Link
      description: |
        Returns the shared document's title and snapshot, unless the link is password-protected. Then
        the message is "Password required", `data` is only `{ passwordRequired: true, expiresAt }`
        (no titles, which can name the person or the job), and the caller must call
        `POST /shares/public/{username}/{slug}/verify` with the password.

        `allowDownload` says whether to show a Download button. It is a display preference, not a
        security control: the studio hides the Download button, and viewers can still save the page.

        No user session is required, but the request is still gated: it must carry an API key, or
        originate from a whitelisted first-party origin. A bare request from an unrecognised origin
        is rejected with `401`.
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared document fetched successfully (or password required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShareResponse"
        "401":
          $ref: "#/components/responses/PublicUnauthorizedError"
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Link not found
        "410":
          description: Link expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 410
                message: Link expired
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailableError"
  /api/v1/shares/public/{username}/{slug}/verify:
    post:
      tags:
        - Shares
      operationId: verifyPublicShareLinkPassword
      summary: Verify Public Share Link Password
      description: |
        Verifies a password-protected share link's password using a timing-safe comparison against
        the stored scrypt hash, and returns the full snapshot on success.

        No user session is required, but the request must carry an API key or originate from a
        whitelisted first-party origin, same as the read endpoint.

        **Rate limited to 5 password attempts per link per 5 minutes per client network**, and to 20
        requests per 5 minutes per IP across all links, to make these links impractical to
        brute-force. A correct password resets the per-link count. A link without a password is
        returned directly.
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySharePasswordRequest"
      responses:
        "200":
          description: Shared document unlocked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShareResponse"
        "400":
          $ref: "#/components/responses/BodyValidationError"
        "401":
          $ref: "#/components/responses/PublicUnauthorizedError"
        "403":
          description: Wrong password. A `403`, not a `401`, so a signed-in viewer is not treated as signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: Invalid password
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Link not found
        "410":
          description: Link expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 410
                message: Link expired
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: |
            Too many password attempts for this link (5 per 5 minutes), or too many verify requests
            from this IP (20 per 5 minutes, "Too many requests. Please try again later."), or, with
            an API key, the per-key limit. `Retry-After` says when to try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Too many password attempts for this link
                  value:
                    success: false
                    statusCode: 429
                    message: Too many password attempts. Please try again later.
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "503":
          description: |
            The server cannot count attempts right now, so it refuses to check the password: the
            per-link counter answers with `Retry-After` 30, and the per-IP limiter, which fails closed
            on this route, answers with `Retry-After` 5. Also sent as "Service temporarily
            unavailable" when the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: The per-link attempt counter is unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Password verification is temporarily unavailable
                limiterUnavailable:
                  summary: The per-IP limiter is unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Rate limiting is temporarily unavailable. Please retry shortly.
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/affiliates/click:
    post:
      tags:
        - Affiliates
      operationId: trackAffiliateClick
      summary: Track Affiliate Click
      description: |
        Public, unauthenticated endpoint. Records a click against an affiliate's referral code. The
        answer is the same `200 { tracked: true }` whether or not the code exists or is active, so
        codes cannot be enumerated; only clicks on an active code are recorded, once per address per
        window. The code is matched case-insensitively.
        Entire affiliate program is gated behind a feature flag (`config.growth.affiliateProgramEnabled`)
        that defaults off in production until explicitly enabled — every route in this group,
        including this one, returns `503` while the flag is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliateClickRequest"
            example:
              code: jane-doe1
      responses:
        "200":
          description: Click tracked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateClickResponse"
        "400":
          $ref: "#/components/responses/BodyValidationError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/affiliates/leaderboard:
    get:
      tags:
        - Affiliates
      operationId: getAffiliateLeaderboard
      summary: Get Affiliate Leaderboard
      description: |
        Public, unauthenticated endpoint. Top 50 affiliates ranked by commission earnings, for the
        current calendar month or all-time. Each entry shows only a short display name ("First L.")
        and the tier, never an id, username or image.
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              - monthly
              - all_time
            default: monthly
          description: |
            `all_time` for all-time; any other value, or none, means `monthly`. Never refused.
      responses:
        "200":
          description: Leaderboard fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateLeaderboardResponse"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/affiliates/me:
    get:
      tags:
        - Affiliates
      operationId: getMyAffiliateDashboard
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get My Affiliate Dashboard
      description: Returns the caller's affiliate status, tier, wallet, clicks, referrals, commissions, and withdrawal history. Session-authenticated only.
      responses:
        "200":
          description: Dashboard fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateDashboardResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: The account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: User not found.
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/affiliates/enroll:
    post:
      tags:
        - Affiliates
      operationId: enrollAsAffiliate
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Enroll As Affiliate
      description: Enrolls the caller in the affiliate program, generating a unique referral code. Idempotent — calling this again while already enrolled just returns the current dashboard. Session-authenticated only.
      responses:
        "200":
          description: Enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateDashboardResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "403":
          description: The caller's affiliate account is suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: Affiliate account is suspended
        "404":
          description: The account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: User not found.
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          description: |
            The affiliate program is switched off (`details.code` `PROGRAM_DISABLED`), no unique
            affiliate code could be made (retry), the session store cannot be read, or the database
            cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                programDisabled:
                  summary: Affiliate program switched off
                  value:
                    success: false
                    statusCode: 503
                    message: The affiliate program is not available yet. Check back soon.
                    details:
                      code: PROGRAM_DISABLED
                codeCollision:
                  summary: No unique code could be made
                  value:
                    success: false
                    statusCode: 503
                    message: Could not create a unique affiliate code.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/affiliates/referral:
    post:
      tags:
        - Affiliates
      operationId: applyAffiliateReferral
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Apply Affiliate Referral Code
      description: |
        Attaches another affiliate's referral code to the caller's account and answers
        `{ applied: true }`. Self-referrals are rejected, and each account may only apply one
        referral code, ever, within its first days after signing up and before any purchase.
        Session-authenticated only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliateReferralRequest"
      responses:
        "200":
          description: Referral applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateReferralResponse"
        "400":
          description: Validation error, or attempted self-referral. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Validation error, or attempted self-referral
                  value:
                    success: false
                    statusCode: 400
                    message: Self-referrals are not allowed.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: |
            The code does not belong to an active affiliate (an unknown code and an inactive
            affiliate's code answer the same), or the account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                codeNotFound:
                  summary: Unknown or inactive code
                  value:
                    success: false
                    statusCode: 404
                    message: Affiliate code not found.
                userNotFound:
                  summary: Account not found
                  value:
                    success: false
                    statusCode: 404
                    message: User not found.
        "409":
          description: |
            This account already has a referral, signed up too long ago ("Referral codes can only be
            applied within N days of signing up."), or has already bought something ("Referral
            codes cannot be applied after a purchase.").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/affiliates/withdrawals:
    post:
      tags:
        - Affiliates
      operationId: requestAffiliateWithdrawal
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Request Affiliate Withdrawal
      description: |
        Requests a payout of available affiliate commission balance (minimum $25 / 2,500 cents).
        Money owed back from a reversed commission is netted first, so the most that can be
        requested is `withdrawableCents` on the dashboard.
        Payouts are reviewed and marked paid manually by an admin out-of-band (bank transfer, PayPal,
        etc) — Dodo Payments only exposes a read-only settlements API, not an outbound transfer API,
        so this cannot be automated end-to-end yet. Session-authenticated only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliateWithdrawalRequest"
            example:
              amountCents: 5000
      responses:
        "200":
          description: Withdrawal requested successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateWithdrawalResponse"
        "400":
          description: The amount is more than `withdrawableCents`, or fails validation. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: The amount is more than `withdrawableCents`, or fails validation
                  value:
                    success: false
                    statusCode: 400
                    message: Available balance is too low.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "403":
          description: The affiliate account is not active (`details.code` `AFFILIATE_NOT_ACTIVE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: This affiliate account is not active, so its balance cannot be paid out.
                details:
                  code: AFFILIATE_NOT_ACTIVE
                  affiliateStatus: SUSPENDED
        "409":
          description: A withdrawal request is already requested or approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 409
                message: A withdrawal is already in progress
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/ambassador/me:
    get:
      tags:
        - Ambassador
      operationId: getAmbassadorStatus
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get Ambassador Status
      description: |
        Returns the caller's current ambassador application status. This is intentionally a small
        surface today — application intake and status are the only things live. There is no
        points/rewards/redemption API yet; that system has not been built.

        Gated behind a feature flag (`config.growth.ambassadorProgramEnabled`) that defaults off in
        production until explicitly enabled — every route in this group returns `503` while the flag
        is off. Session-authenticated only.
      responses:
        "200":
          description: Status fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorStatusResponse"
              example:
                success: true
                message: Success
                data:
                  name: Jane Doe
                  email: jane@example.com
                  role: USER
                  ambassadorStatus: NONE
                  collegeName: null
                  graduationYear: null
                  application: null
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/ambassador/apply:
    post:
      tags:
        - Ambassador
      operationId: applyForAmbassador
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Apply For Campus Ambassador Program
      description: |
        Submits (or resubmits, once previously rejected) a campus ambassador application. Answers
        `409` for a user who already has one pending review, or whose account role is
        `AMBASSADOR`. Only the role is checked, so an account with another role (an admin, say)
        whose application was approved can apply again. `graduationYear` is validated as a real 4-digit year on both the
        client and the server. Session-authenticated only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmbassadorApplicationRequest"
            example:
              collegeName: State University
              graduationYear: "2027"
              whyJoin: I want to help students discover VeriWorkly and build better resumes.
              superpower: I can explain anything in under a minute.
              funFact: I've organized three hackathons on campus.
      responses:
        "200":
          description: Application submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorApplicationResponse"
              example:
                success: true
                message: Success
                data:
                  success: true
                  ambassadorStatus: PENDING
                  collegeName: State University
                  graduationYear: "2027"
        "400":
          description: The body fails validation, or is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  summary: A field failed validation
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: graduationYear
                        message: Enter a real 4-digit graduation year
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: The account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: User not found.
        "409":
          description: Already an ambassador, or an application is already pending review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyAmbassador:
                  summary: Already an ambassador
                  value:
                    success: false
                    statusCode: 409
                    message: You are already a campus ambassador.
                alreadyPending:
                  summary: Application already pending
                  value:
                    success: false
                    statusCode: 409
                    message: Your ambassador application is already pending review.
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/FeatureDisabledError"
  /api/v1/stats/events:
    post:
      tags:
        - Stats
      operationId: recordUsageEvent
      security:
        - ApiKeyAuth: []
      summary: Record Usage Event
      description: |
        Counts one product usage event (for example `resume_exported`) toward VeriWorkly's daily
        usage metrics. Any developer API key may call it, whatever its scopes; the studio calls it
        from the browser.

        Public callers may send only the allow-listed event names listed under `event`, and every
        call counts as 1. Events the server records itself, such as `auth_login_success`, cannot be
        reported. Trusted servers send `x-internal-key` instead of an API key, which also allows any
        other name, stored as `custom_<name>` (at most 50 distinct custom names per UTC day), and a
        `value` up to 1000.
      parameters:
        - name: x-internal-key
          in: header
          required: false
          description: Server-to-server secret (`STATS_INTERNAL_KEY`). Never sent from a browser.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEventRequest"
            example:
              event: resume_exported
      responses:
        "202":
          description: The event was counted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventResponse"
              example:
                success: true
                message: Metric accepted
                data:
                  accepted: true
        "400":
          description: The body is invalid, or the event name is not allow-listed for public callers. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: The body is invalid, or the event name is not allow-listed for public callers
                  value:
                    success: false
                    statusCode: 400
                    message: Event 'my_event' is not allowlisted for public access.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/PublicUnauthorizedError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: Rate limited, or an internal caller sent a new custom name past the daily cap. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "503":
          $ref: "#/components/responses/DatabaseUnavailableError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Your personal API key — `vw_` followed by 64 hex characters. The same key is also accepted
        as `Authorization: Bearer vw_...`.
    LocalSession:
      type: apiKey
      in: cookie
      name: veriworkly-auth.session_token
      description: Internal session cookie for local development.
    ProdSession:
      type: apiKey
      in: cookie
      name: __Secure-veriworkly-auth.session_token
      description: Internal session cookie for production.
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - statusCode
      properties:
        success:
          type: boolean
        message:
          type: string
        statusCode:
          type: integer
        details:
          description: |
            Left out when there is nothing to add. A validation failure (`400` "Validation failed")
            sends an array of `{ path, message }`, one entry per rejected field. Other errors send an
            object instead, such as `{ code }`, `{ currentUpdatedAt }` or the caller's quota. Each
            operation's error responses say which.
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
            - type: object
              additionalProperties: true
    UnauthorizedResponse:
      type: object
      description: |
        The body of a `401`. It has the same envelope as every other error, so `statusCode` is always
        present. When the gate in front of a key-or-session route refuses the request, it names the
        reason in `details.code`. An invalid API key and a missing session on a signed-in-only route
        send no `details`.
      required:
        - success
        - message
        - statusCode
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 401
        details:
          type: object
          properties:
            code:
              type: string
              enum:
                - API_KEY_REQUIRED
                - AUTH_REQUIRED
              description: |
                `API_KEY_REQUIRED`: no API key and no whitelisted first-party `Origin` or `Referer`.
                `AUTH_REQUIRED`: a session cookie with no `Origin` or `Referer` that is not a valid
                session.
    AtsQuotaErrorResponse:
      type: object
      description: The body of a `429` from the ATS quota, where `details` is the caller's current quota. A `429` from the rate limiters has no `details`.
      required:
        - success
        - message
        - statusCode
      properties:
        success:
          type: boolean
        message:
          type: string
        statusCode:
          type: integer
        details:
          $ref: "#/components/schemas/AtsQuotaSummary"
    OffsetPaginationMeta:
      type: object
      description: |
        Offset-pagination metadata returned alongside `items` by every paginated list endpoint.
        Requests may use either `page`/`pageSize` or `limit`/`offset`; the response always echoes both
        views of the same window.
      required:
        - total
        - limit
        - offset
        - page
        - pageSize
        - totalPages
        - hasMore
        - pagination
      properties:
        total:
          type: integer
          description: Total number of matching records, ignoring the current window.
        limit:
          type: integer
        offset:
          type: integer
        page:
          type: integer
          description: 1-based page index for the current window.
        pageSize:
          type: integer
          description: Always equal to `limit`.
        totalPages:
          type: integer
          description: At least 1, even when `total` is 0.
        hasMore:
          type: boolean
        pagination:
          type: object
          required:
            - mode
            - nextOffset
            - nextCursor
          properties:
            mode:
              type: string
              const: offset
              enum:
                - offset
            nextOffset:
              type:
                - integer
                - "null"
              description: Null when `hasMore` is false.
            nextCursor:
              type:
                - string
                - "null"
              description: Always null — these endpoints are offset-paginated, never cursor-paginated.
    HealthLivenessData:
      type: object
      description: |
        Liveness payload. `GET /api/v1/health` deliberately touches no external dependency, so uptime
        checks do not wake database compute — it reports only that the Node.js process is responding.
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          const: ok
          example: ok
        timestamp:
          type: string
          format: date-time
    HealthLivenessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/HealthLivenessData"
    HealthReadyData:
      type: object
      description: Readiness payload. Only `GET /api/v1/health/ready` verifies PostgreSQL and Redis connectivity.
      required:
        - status
        - database
        - redis
        - timestamp
      properties:
        status:
          type: string
          const: ok
          example: ok
        database:
          type: string
          const: connected
          example: connected
        redis:
          type: string
          const: connected
          example: connected
        timestamp:
          type: string
          format: date-time
    HealthReadyResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/HealthReadyData"
