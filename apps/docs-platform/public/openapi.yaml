        `details` otherwise. Surrounding spaces in text fields are trimmed.
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        templateId:
          type: string
          enum:
            - signal
            - atelier
            - nimbus
            - cipher
          description: "`nimbus` and `cipher` are premium: publishing them needs Creator Pro, the Job Hunter Bundle or a pass."
        identity:
          type: object
          required:
            - name
            - headline
            - bio
            - location
            - email
            - availability
            - avatar
          properties:
            name:
              type: string
              maxLength: 120
              description: Required to be non-empty on publish.
            headline:
              type: string
              maxLength: 240
              description: Required to be non-empty on publish.
            bio:
              type: string
              maxLength: 1600
              description: Required to be non-empty on publish.
            location:
              type: string
              maxLength: 120
            email:
              type: string
              maxLength: 254
              description: A valid email address. A draft may leave it empty; publishing needs one.
            availability:
              type: string
              maxLength: 160
            avatar:
              oneOf:
                - $ref: "#/components/schemas/PortfolioAssetReference"
                - type: "null"
        seo:
          type: object
          required:
            - title
            - description
            - socialImage
          properties:
            title:
              type: string
              maxLength: 120
            description:
              type: string
              maxLength: 300
            socialImage:
              oneOf:
                - $ref: "#/components/schemas/PortfolioAssetReference"
                - type: "null"
        socialLinks:
          type: array
          maxItems: 12
          items:
            type: object
            required:
              - id
              - label
              - url
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              label:
                type: string
                maxLength: 80
                description: Required to be non-empty on publish.
              url:
                type: string
                maxLength: 2048
                description: An `http://` or `https://` URL. A draft may leave it empty; publishing needs one.
        sections:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/PortfolioSection"
        pages:
          type: array
          maxItems: 10
          description: Extra pages. The public site shows them only while the owner has paid portfolio access (`isPaid` on the public read).
          items:
            type: object
            required:
              - id
              - slug
              - title
              - sections
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              slug:
                type: string
                minLength: 1
                maxLength: 63
              title:
                type: string
                maxLength: 120
                description: Required to be non-empty on publish.
              sections:
                type: array
                maxItems: 24
                items:
                  $ref: "#/components/schemas/PortfolioSection"
        removeWatermark:
          type: boolean
    PortfolioSaveDraftRequest:
      type: object
      required:
        - subdomain
        - snapshot
      properties:
        documentId:
          type: string
          description: Omit to create (or continue) the user's single PORTFOLIO document.
          minLength: 1
        subdomain:
          type: string
          maxLength: 63
          minLength: 1
        revision:
          type: integer
          description: Required once a draft already exists, for optimistic concurrency (409 on mismatch).
          minimum: 1
        snapshot:
          $ref: "#/components/schemas/PortfolioDraftContent"
    PortfolioPublishRequest:
      type: object
      required:
        - documentId
        - subdomain
        - revision
      properties:
        documentId:
          type: string
          minLength: 1
        subdomain:
          type: string
          maxLength: 63
          minLength: 1
        revision:
          type: integer
          description: Must match the draft's current revision (save the latest draft first).
          minimum: 1
    PortfolioAnalytics:
      type: object
      required:
        - locked
        - totalViews
        - daily
        - referrers
      properties:
        locked:
          type: boolean
          description: |
            True when the caller has no visitor-analytics access (it comes with Creator Pro, the Job
            Hunter Bundle or a pass). The numbers are then all zero and the lists empty, whether or
            not a portfolio is published.
        totalViews:
          type: integer
          description: All-time views, including views still buffered and not yet flushed.
        daily:
          type: array
          description: The 30 most recent days that had views, newest first. Days with no views are left out.
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              count:
                type: integer
        referrers:
          type: array
          description: The all-time top 10 referrer hosts, from flushed views only.
          items:
            type: object
            properties:
              host:
                type: string
              count:
                type: integer
    PortfolioAnalyticsResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/PortfolioAnalytics"
    PortfolioSubdomainAvailabilityResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            subdomain:
              type: string
            available:
              type: boolean
    PortfolioAssetUploadRequest:
      type: object
      required:
        - kind
        - mimeType
        - sizeBytes
      properties:
        kind:
          type: string
          enum:
            - AVATAR
            - PROJECT_COVER
            - SOCIAL_IMAGE
        mimeType:
          type: string
          description: |
            `image/jpeg`, `image/png` or `image/webp`. Checked by the service rather than the
            request schema, so any other value answers `400` "Upload a JPG, PNG, or WebP image.".
          example: image/png
          minLength: 1
        sizeBytes:
          type: integer
          description: |
            Greater than 0 and at most 5,242,880 (5 MB). A larger size answers `400` "Image must be
            5 MB or smaller.".
          exclusiveMinimum: 0
    PortfolioAssetUploadResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            assetId:
              type: string
            uploadUrl:
              type: string
              description: Presigned Cloudflare R2 PUT URL. Upload the file directly to this URL with a matching Content-Type/Content-Length.
            expiresInSeconds:
              type: integer
              enum:
                - 600
    PortfolioAssetCompleteRequest:
      type: object
      required:
        - assetId
      properties:
        assetId:
          type: string
          minLength: 1
        checksum:
          type: string
          description: Optional ETag to verify against the uploaded object.
          maxLength: 256
    PortfolioAssetCompleteResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
            url:
              type: string
              description: |
                Public CDN URL. Only returned after a server-side HEAD request against R2 confirms the
                uploaded object's size, content type, and (optionally) checksum match what was declared
                when the upload URL was requested.
    BillingSummary:
      type: object
      required:
        - plan
        - productKey
        - activeProductKeys
        - status
        - interval
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - graceEndsAt
        - canPublish
        - accessEndsAt
        - publicationStatus
        - entitlements
        - access
        - credits
        - catalog
        - creditEconomics
        - addOns
      properties:
        plan:
          type: string
          enum:
            - FREE
            - AI_CREDITS
            - PORTFOLIO_PRO
            - BUNDLE
          description: The plan whose features are in effect, from subscription or pass access. A credit pack unlocks no plan features, so a customer whose only purchase is a pack is FREE here although they paid; use `access` to tell a paying customer from a free one.
        productKey:
          type:
            - string
            - "null"
          enum:
            - ai_credits
            - portfolio_pro
            - bundle
            - null
        activeProductKeys:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - INACTIVE
            - ACTIVE
            - PAST_DUE
            - CANCELED
          description: |
            Status of the subscription in effect today. `INACTIVE` when none is (no plan, or one that
            has ended); `PAST_DUE` while a failed renewal's grace runs, or while the subscription is
            paused. There are no trials.
        interval:
          type:
            - string
            - "null"
          enum:
            - ONE_DAY
            - SEVEN_DAY
            - MONTHLY
            - ANNUAL
            - null
          description: |
            The stored billing interval, upper case. Request bodies (checkout, plan change) use the
            lower-case spelling (`monthly`, `annual`, ...).
        currentPeriodEnd:
          type:
            - string
            - "null"
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        graceEndsAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the grace period after a failed renewal ends. Null when none is running.
        canPublish:
          type: boolean
          description: Portfolio-publish entitlement is a separate system from the AI credit wallet below.
        accessEndsAt:
          type:
            - string
            - "null"
          format: date-time
          description: The latest period end of an active Creator Pro or Job Hunter Bundle subscription.
        publicationStatus:
          type: string
          enum:
            - LIVE
            - GRACE
            - SUSPENDED
          description: "`LIVE` while publishing is included, `GRACE` while a grace period runs, `SUSPENDED` otherwise."
        entitlements:
          type: array
          items:
            type: string
        access:
          type: object
          description: |
            Who the customer is, separately from the plan. A payer is never shown as free: a customer
            whose renewal failed, or who paused, keeps the tier of the subscription they pay for.
          required:
            - tier
            - isPaid
            - isPaying
            - paymentIssue
            - passEndsAt
            - portfolioAccessEndsAt
            - aiCreditsEndsAt
            - creditBalance
          properties:
            tier:
              type: string
              enum:
                - bundle
                - portfolio_pro
                - ai_credits
                - pass
                - credits
                - free
              description: "`credits` is a customer whose only purchase is credits (a pack, or a plan allowance that is still unspent)."
            isPaid:
              type: boolean
              description: A subscription, a pass or an admin grant of one is in effect. A credit pack never makes an account paid.
            isPaying:
              type: boolean
              description: The customer paid for something now in effect (a subscription, a pass, or paid credits), or has a subscription in dunning.
            paymentIssue:
              type: boolean
              description: A subscription renewal failed and is being retried. False for a pause.
            passEndsAt:
              type:
                - string
                - "null"
              format: date-time
            portfolioAccessEndsAt:
              type:
                - string
                - "null"
              format: date-time
            aiCreditsEndsAt:
              type:
                - string
                - "null"
              format: date-time
            creditBalance:
              type: integer
              description: Spendable credits, the same as `credits.available`.
        credits:
          $ref: "#/components/schemas/CreditWallet"
        catalog:
          type: array
          description: The public product catalog, one entry per subscription product.
          items:
            type: object
            required:
              - key
              - name
              - entitlements
              - prices
              - configuredIntervals
              - currency
            properties:
              key:
                type: string
                enum:
                  - ai_credits
                  - portfolio_pro
                  - bundle
              name:
                type: string
              entitlements:
                type: array
                items:
                  type: string
              prices:
                type: object
                description: Price in cents per interval (`one_day`, `seven_day`, `monthly`, `annual`) the product is sold in.
                additionalProperties:
                  type: integer
              creditAllowance:
                type: object
                description: AI credits granted per interval, for products that include them.
                additionalProperties:
                  type: integer
              creditNotes:
                type: object
                description: How the allowance is delivered, per interval, in words a pricing page can show.
                additionalProperties:
                  type: string
              recommended:
                type: boolean
              configuredIntervals:
                type: array
                description: The intervals that have a provider product configured on this server, so can be bought now.
                items:
                  type: string
                  enum:
                    - one_day
                    - seven_day
                    - monthly
                    - annual
              currency:
                type: string
                enum:
                  - USD
        creditEconomics:
          type: object
          additionalProperties: true
        addOns:
          type: array
          description: What can be bought on top of portfolio access. Empty without it.
          items:
            type: object
            properties:
              key:
                type: string
              name:
                type: string
    BillingSummaryResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/BillingSummary"
    BillingHistoryEvent:
      type: object
      required:
