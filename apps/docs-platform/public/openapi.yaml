  /api/v1/github/issues:
    get:
      tags:
        - GitHub
      operationId: getGitHubIssues
      summary: Get GitHub Issues
      security:
        - ApiKeyAuth: []
      description: |
        Fetch paginated GitHub issues and pull requests with optional filters, from the last synced
        snapshot rather than live from GitHub. Ordered by most recently updated. Returns an empty
        page when no sync has run yet.

        Requires the `github:read` scope when called with an API key.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - todo
              - in-progress
              - done
          description: |
            Derived at sync time — closed items and items labelled `done` map to `done`; items
            labelled `in-progress`, `in progress`, or `active` map to `in-progress`; everything else
            is `todo`.
          required: false
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - issue
              - pull-request
              - all
          description: "`all` is equivalent to omitting the filter."
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Items per page. Values above 50 are rejected with `400`.
          required: false
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
            maximum: 1000000
          required: false
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
          description: |
            1-based page index, the first page when left out. An alternative to `offset`: sending both answers `400` "Send either page or offset, not both".
          required: false
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Alternative spelling of `limit`. Takes precedence over `limit` when both are sent.
          required: false
        - in: query
          name: createdFrom
          schema:
            anyOf:
              - type: string
                format: date
              - type: string
                format: date-time
          description: |
            Items created at or after this time. A date (`2026-08-01`) means the start of that UTC
            day; a date-time is used as given.
          required: false
        - in: query
          name: createdTo
          schema:
            anyOf:
              - type: string
                format: date
              - type: string
                format: date-time
          description: |
            Items created at or before this time, inclusive. A bare date covers that whole UTC day, so
            `createdTo=2026-08-10` includes everything up to `2026-08-11T00:00:00Z`.
          required: false
        - in: query
          name: updatedFrom
          schema:
            anyOf:
              - type: string
                format: date
              - type: string
                format: date-time
          description: Items updated at or after this time. Same date rules as `createdFrom`.
          required: false
        - in: query
          name: updatedTo
          schema:
            anyOf:
              - type: string
                format: date
              - type: string
                format: date-time
          description: Items updated at or before this time, inclusive. Same date rules as `createdTo`.
          required: false
      responses:
        "200":
          description: GitHub issues fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubIssuesResponse"
              example:
                success: true
                message: GitHub issues fetched successfully
                data:
                  items:
                    - id: gh-123456
                      number: 42
                      title: Add new feature
                      status: in-progress
                      kind: issue
                      url: https://github.com/owner/repo/issues/42
                      labels:
                        - enhancement
                      createdAt: 2026-04-20T10:00:00.000Z
                      updatedAt: 2026-04-25T10:00:00.000Z
                  total: 1
                  limit: 20
                  offset: 0
                  page: 1
                  pageSize: 20
                  totalPages: 1
                  syncedAt: 2026-04-25T12:00:00.000Z
                  hasMore: false
                  pagination:
                    mode: offset
                    nextOffset: null
                    nextCursor: null
        "400":
          description: |
            Validation error: a parameter is out of range or not a date, `page` and `offset` were
            both sent, or the query has a parameter this endpoint does not know (unknown parameters
            are refused, not ignored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 400
                message: Validation failed
                details:
                  - path: offset
                    message: Send either page or offset, not both
        "401":
          $ref: "#/components/responses/PublicUnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailableError"
  /api/v1/auth/email-otp/send-verification-otp:
    post:
      tags:
        - Authentication
      operationId: sendOTP
      summary: Send OTP
      description: |
        Emails a one-time password to the given address.

        Authentication is handled by **Better Auth**, mounted at `/api/v1/auth`. Its endpoints return
        Better Auth's own payloads — they are **not** wrapped in the `{ success, message, data }`
        envelope the rest of this API uses.

        Rate limited to 10 requests per minute per IP, and to 5 codes per hour per email address
        (`+tag` and Gmail dot variants of one inbox share that budget). The per-address limit
        applies to `type: sign-in` and is checked before any mail is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - type
              properties:
                email:
                  type: string
                  format: email
                type:
                  type: string
                  enum:
                    - sign-in
                    - email-verification
                    - forget-password
                  description: |
                    Required. Use `sign-in` for the login flow — that is what the VeriWorkly
                    dashboard sends. For a password-reset code use Better Auth's
                    `/email-otp/request-password-reset`; the older `/forget-password/email-otp`
                    path is switched off.
            example:
              email: user@example.com
              type: sign-in
      responses:
        "200":
          description: |
            OTP sent. Returns `{ "success": true }` whether or not the address maps to an existing
            account, so this endpoint cannot be used to enumerate registered emails.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        "400":
          description: |
            Missing or malformed body, an invalid email address, or `type: change-email`, which this
            endpoint rejects. Returned in Better Auth's error shape, not `ErrorResponse`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: INVALID_EMAIL
                message: Invalid email
        "403":
          description: The request's `Origin` is not in the server's trusted origins.
        "429":
          description: |
            Too many OTP requests: 10 per minute per IP, or 5 per hour for this email address ("Too
            many codes requested for this email. Please try again later."). Better Auth answers with
            `{ "message": "..." }` and, for the per-IP limit, an `X-Retry-After` header. Outside
            development the server's own limiter (20 requests per minute per IP for each
            `/api/v1/auth/*` endpoint) can answer first, with `ErrorResponse` and a `Retry-After`
            header. When the server cannot count requests it answers `503` instead of sending an
            uncounted code.
        "503":
          description: |
            The server cannot count code requests right now (its rate-limit store is unreachable), so
            it sends no code. Better Auth answers with `{ "message": "Sign-in codes are temporarily
            unavailable. Please try again shortly." }`.
  /api/v1/auth/sign-in/email-otp:
    post:
      tags:
        - Authentication
      operationId: verifyOTP
      summary: Sign In With Email OTP
      description: |
        Exchanges a valid OTP for a session. On success the session cookie is set via `Set-Cookie`
        and the session token plus the user record are returned.

        A user is created automatically on first sign-in. Codes expire after 5 minutes and allow 3
        attempts by default. This endpoint returns Better Auth's payload, not the
        `{ success, message, data }` envelope.

        Rate limited to 20 requests per minute per IP. Guessing one code is bounded by the attempt
        limit instead. Codes are 6 digits. The code lifetime and attempt count are the server's
        `AUTH_OTP_TTL_SECONDS` (300) and `AUTH_OTP_ALLOWED_ATTEMPTS` (3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  description: The 6-digit code from the email.
                name:
                  type: string
                  description: Used only when the account is created on this first sign-in.
                image:
                  type: string
                  description: Used only when the account is created on this first sign-in.
            example:
              email: user@example.com
              otp: "123456"
      responses:
        "200":
          description: OTP verified. Sets the session cookie and returns the session token and user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                properties:
                  token:
                    type: string
                    description: Session token for the authenticated session.
                  user:
                    type: object
                    additionalProperties: true
        "400":
          description: |
            The body is invalid, the code is wrong (`INVALID_OTP`), or it has expired
            (`OTP_EXPIRED`). Returned in Better Auth's error shape, `{ code, message }`.
        "403":
          description: |
            The attempt limit was reached (`TOO_MANY_ATTEMPTS`). The code is discarded, so request a
            new one.
        "429":
          description: Too many requests. The limit is 20 per minute per IP, and Better Auth sends an `X-Retry-After` header.
  /api/v1/auth/get-session:
    get:
      tags:
        - Authentication
      operationId: getSession
      summary: Get Current Session
      security:
        - LocalSession: []
        - ProdSession: []
        - {}
      description: |
        Returns the active session and its user, based on the request's session cookie. Returns
        `null` rather than an error when no valid session cookie is present.

        This endpoint returns Better Auth's payload, not the `{ success, message, data }` envelope.
      responses:
        "200":
          description: The active `{ session, user }` pair, or `null` when the caller has no valid session.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      session:
                        type: object
                        additionalProperties: true
                      user:
                        type: object
                        additionalProperties: true
                  - type: "null"
  /api/v1/auth/sign-out:
    post:
      tags:
        - Authentication
      operationId: signOut
      summary: Sign Out
      security:
        - LocalSession: []
        - ProdSession: []
        - {}
      description: |
        Revokes the current session and clears the session cookie. Also flushes the server-side
        session cache for that cookie. It succeeds even when no session cookie is sent.

        A request that carries a cookie must also send an `Origin` or `Referer` header from a trusted
        origin, or it is rejected with `403`.

        This endpoint returns Better Auth's payload, not the `{ success, message, data }` envelope.
      responses:
        "200":
          description: Signed out. Clears the session cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        "403":
          description: A cookie was sent without an `Origin` or `Referer` from a trusted origin.
  /api/v1/api-keys:
    get:
      tags:
        - API Keys
      operationId: getAllApiKeys
      summary: List API Keys
      description: |
        Lists the caller's API keys, newest first.

        **No form of the secret is returned here — not even a masked one.** Each entry carries only
        `keyPrefix`, the first 8 characters of the key, which is enough to tell keys apart in a list.
        If you lose a secret, rotate the key.

        Session-authenticated only — an API key cannot be used to manage API keys.
      security:
        - LocalSession: []
        - ProdSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: |
            Keys per page. Read leniently: a value above 50 is lowered to 50, and a value that is not
            a positive integer is ignored (the default applies). Neither is refused.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: |
            Rows to skip. A value that is not a non-negative integer is ignored. An offset past row
            1,000,000 is refused with `400`.
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: |
            1-based page index, the first page when left out. An alternative to `offset`. When both
            are sent, `offset` decides the window and the response echoes the `page` that was sent.
            A value that is not a positive integer is ignored.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
          description: |
            Alternative spelling of `limit`, with the same lenient reading. Takes precedence over
            `limit` when both are sent.
      responses:
        "200":
          description: A list of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
              example:
                success: true
                message: API keys fetched successfully
                data:
                  items:
                    - id: cmnu7awv4000063lk18zpon2m
                      name: My Documentation Key
                      keyPrefix: vw_a1b2c
                      isActive: true
                      createdAt: 2026-04-11T10:37:35.584Z
                      lastUsed: 2026-04-25T19:35:44.409Z
                      expiresAt: 2027-04-11T10:37:35.584Z
                      revokedAt: null
                  total: 1
                  limit: 20
                  offset: 0
                  page: 1
                  pageSize: 20
                  totalPages: 1
                  hasMore: false
                  pagination:
                    mode: offset
                    nextOffset: null
                    nextCursor: null
        "400":
          description: The requested window reaches past row 1,000,000.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 400
                message: Validation failed
                details:
                  - path: offset
                    message: Must not reach past row 1000000
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
    post:
      tags:
        - API Keys
      operationId: createApiKey
      summary: Create API Key
      description: |
        Generates a new API key. **The full secret is returned exactly once, in this response.** It
        is stored only as an HMAC-SHA256 hash and can never be retrieved again — save it immediately.

        Session-authenticated only — an API key cannot be used to mint API keys.
      security:
        - LocalSession: []
        - ProdSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: A descriptive name for the API key. Surrounding spaces are trimmed.
                  example: My Documentation Key
                scopes:
                  type: array
                  description: |
                    Scopes granted to the new key. Defaults to `["user:read"]` (the server's
                    `API_KEY_DEFAULT_SCOPES`) when omitted, empty, or an empty string. A comma-separated string such as
                    `"user:read,resume:read"` is also accepted. Any value outside the listed set is
                    rejected with `400`.
                  items:
                    $ref: "#/components/schemas/ApiKeyScope"
                rateLimit:
                  type: integer
                  minimum: 1
                  description: |
                    Requests allowed per 15-minute window. Defaults to 20 (the server's
                    `API_KEY_DEFAULT_RATE_LIMIT`). The ceiling is `API_KEY_MAX_RATE_LIMIT`, 600 by
                    default: a larger value is lowered to the ceiling, not rejected. A numeric string
                    such as `"50"` is accepted. A value that is not a positive integer is rejected
                    with `400`.
                  example: 20
                expiresAt:
                  description: |
                    When the key stops working: an ISO 8601 timestamp with a zone (`Z` or an offset
                    such as `+05:30`), in the future. A timestamp without a zone, or one in the past,
                    is rejected with `400`. Defaults to 365 days from creation when omitted or empty.
                    Keys are never issued without an expiry.
                  anyOf:
                    - type: string
                      const: ""
                    - type: string
                      format: date-time
                    - type: "null"
            example:
              name: My Documentation Key
              scopes:
                - user:read
                - resume:read
      responses:
        "201":
          description: API key created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
              example:
                success: true
                message: API key generated successfully. Please save it as it won't be shown again.
                data:
                  id: cmnu7awv4000063lk18zpon2m
                  key: vw_3f2a1c9e8b7d6f5a4c3b2a1908f7e6d5c4b3a29180706f5e4d3c2b1a09f8e7d6
                  keyPrefix: vw_3f2a1
                  keySuffix: 09f8e7d6
                  name: My Documentation Key
                  userId: cmnu7awv4000063lk18zpon2x
                  isActive: true
                  rateLimit: 20
                  scopes:
                    - user:read
                    - resume:read
                  expiresAt: 2027-04-11T10:37:35.584Z
                  revokedAt: null
                  createdAt: 2026-04-11T10:37:35.584Z
                  updatedAt: 2026-04-11T10:37:35.584Z
                  lastUsed: null
        "400":
          description: Missing name, an unsupported scope, or a malformed `rateLimit`/`expiresAt`. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingName:
                  summary: Name omitted
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: name
                        message: Required
                pastExpiry:
                  summary: Expiry in the past
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: expiresAt
                        message: expiresAt must be in the future
                badScope:
                  summary: Unsupported scope
                  value:
                    success: false
                    statusCode: 400
                    message: "Unsupported API key scope(s): billing:read"
                badRateLimit:
                  summary: Rate limit not a positive integer
                  value:
                    success: false
                    statusCode: 400
                    message: rateLimit must be a positive integer
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "409":
          description: The caller already has 10 active, unexpired keys. Revoke or delete one first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 409
                message: You can have at most 10 active API keys. Revoke one you no longer use first.
                details:
                  code: API_KEY_LIMIT
                  limit: 10
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/api-keys/{id}/rotate:
    post:
      tags:
        - API Keys
      operationId: rotateApiKey
      summary: Rotate API Key
      description: |
        Revokes the target key and issues a replacement in one transaction. The old secret stops
        working immediately.

        Every field in the body is optional — send `{}` to rotate the secret while carrying over the
        existing name, scopes, and rate limit. As with creation, the new secret is returned exactly
        once. The response also carries `rotatedFromId`, the id of the key that was replaced.

        Only an active, unexpired key can be rotated. A key that is revoked, already rotated or
        expired answers `409`. An id that is not one of the caller's keys answers `404`.
      security:
        - LocalSession: []
        - ProdSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the API key to rotate.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Replacement name. Carried over from the old key when omitted or null.
                  anyOf:
                    - type: string
                      maxLength: 100
                      minLength: 1
                    - type: "null"
                scopes:
                  type: array
                  description: |
                    Scopes for the replacement key. Carried over from the old key when omitted, empty,
                    or an empty string. A comma-separated string is also accepted.
                  items:
                    $ref: "#/components/schemas/ApiKeyScope"
                rateLimit:
                  type: integer
                  minimum: 1
                  description: |
                    Requests allowed per 15-minute window. Carried over unchanged when omitted. A value
                    you send is lowered to `API_KEY_MAX_RATE_LIMIT` (600 by default) if it is larger,
                    not rejected. A numeric string is accepted.
                expiresAt:
                  description: |
                    New expiry: an ISO 8601 timestamp with a zone, in the future (`400` otherwise).
                    Carried over from the old key when omitted, falling back to 365 days from now if
                    the old key had none.
                  anyOf:
                    - type: string
                      const: ""
                    - type: string
                      format: date-time
                    - type: "null"
            example: {}
      responses:
        "201":
          description: API key rotated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
              example:
                success: true
                message: API key rotated successfully. Please save the new key immediately.
                data:
                  id: cmnu7awv4000063lk18zpon2n
                  key: vw_9e8d7c6b5a4938271605f4e3d2c1b0a99887766554433221100ffeeddccbbaa9
                  keyPrefix: vw_9e8d7
                  keySuffix: ddccbbaa
                  name: My Documentation Key
                  userId: cmnu7awv4000063lk18zpon2x
                  isActive: true
                  rateLimit: 20
                  scopes:
                    - user:read
                    - resume:read
                  expiresAt: 2027-04-11T10:37:35.584Z
                  revokedAt: null
                  createdAt: 2026-04-26T10:00:00.000Z
                  updatedAt: 2026-04-26T10:00:00.000Z
                  lastUsed: null
                  rotatedFromId: cmnu7awv4000063lk18zpon2m
        "400":
          description: An unsupported scope, or a malformed `rateLimit`/`expiresAt`. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: No key with this ID belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: API key not found
        "409":
          description: The key is revoked, was already rotated, or has expired. Create a new key instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                inactive:
                  summary: Revoked or already rotated
                  value:
                    success: false
                    statusCode: 409
                    message: Key is no longer active
                expired:
                  summary: Expired
                  value:
                    success: false
                    statusCode: 409
                    message: Key has expired, create a new one
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/api-keys/{id}/revoke:
    post:
      tags:
        - API Keys
      operationId: revokeApiKey
      summary: Revoke API Key
      description: |
        Immediately disables an API key without deleting its record — `isActive` becomes false and
        `revokedAt` is stamped. The cached authentication record is purged at the same time, so the
        secret stops working right away rather than after the cache expires.

        A revoked key cannot be reactivated; rotate or create a new one instead. Revoking is
        idempotent: revoking a key that is already revoked, or was retired by a rotation, answers
        `200` again and keeps its original `revokedAt`. `data` is `null` on success.
      security:
        - LocalSession: []
        - ProdSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the API key to revoke.
      responses:
        "200":
          description: API key revoked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                success: true
                message: API key revoked successfully
                data: null
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: No key with this ID belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: API key not found
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/api-keys/{id}:
    get:
      tags:
        - API Keys
      operationId: getApiKey
      summary: Get API Key
      description: |
        Returns the full metadata record for one of the caller's keys — name, scopes, rate limit,
        expiry, revocation state, and last-used timestamp.

        **The secret is not returned**, and cannot be: only an HMAC-SHA256 hash of it is stored. If
        you have lost a key's value, rotate it. `keyPrefix` and `keySuffix` are the only fragments
        kept, and neither is enough to reconstruct the key.

        Session-authenticated only — an API key cannot be used to manage API keys.
      security:
        - LocalSession: []
        - ProdSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the API key to fetch.
      responses:
        "200":
          description: API key fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetailResponse"
              example:
                success: true
                message: API key fetched successfully
                data:
                  id: cmnu7bxq2000163lk4d1zqp8n
                  keyPrefix: vw_a1b2c
                  keySuffix: a09f8e7d
                  name: CI pipeline
                  userId: cmnu7awv4000063lk18zpon2m
                  isActive: true
                  rateLimit: 20
                  scopes:
                    - user:read
                    - resume:read
                  expiresAt: 2027-04-11T10:37:35.584Z
                  revokedAt: null
                  createdAt: 2026-04-11T10:37:35.584Z
                  updatedAt: 2026-04-11T10:37:35.584Z
                  lastUsed: 2026-07-29T09:55:00.000Z
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: No key with this ID belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: API key not found
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
    delete:
      tags:
        - API Keys
      operationId: deleteApiKey
      summary: Delete API Key
      description: |
        Permanently removes an API key and its record. Use `POST /api-keys/{id}/revoke` instead if
        you want to keep the audit trail.

        `data` is `null` on success.
      security:
        - LocalSession: []
        - ProdSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the API key to delete.
      responses:
        "200":
          description: API key deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                success: true
                message: API key deleted successfully
                data: null
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: No key with this ID belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: API key not found
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/profiles/master:
    get:
      tags:
        - Profile
      operationId: getMasterProfile
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Get Master Profile
      description: |
        Retrieves the authenticated user's master profile along with an account summary. Requires the
        `resume:read` scope when called with an API key.

        A user who has never saved a master profile gets `404` "Master profile not found". Create
        one with `PUT /profiles/master` (without `expectedUpdatedAt`). Cached for 1 hour and
        invalidated on write.
      responses:
        "200":
          description: Master profile fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterProfileResponse"
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
                    message: Master profile fetched successfully
                    data:
                      profile:
                        id: profile_123
                        userId: user_123
                        content: {}
                        createdAt: 2026-04-01T10:00:00.000Z
                        updatedAt: 2026-04-10T10:00:00.000Z
                      summary:
                        id: user_123
                        name: Admin
                        email: admin@example.com
                        createdAt: 2026-04-01T10:00:00.000Z
                        emailVerified: true
                        autoSyncEnabled: false
                        shareResumeCount: 4
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "404":
          description: The user has never saved a master profile, or the account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noProfile:
                  summary: No master profile saved yet
                  value:
                    success: false
                    statusCode: 404
                    message: Master profile not found
                noUser:
                  summary: Account not found
                  value:
                    success: false
                    statusCode: 404
                    message: User not found
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    put:
      tags:
        - Profile
      operationId: updateMasterProfile
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Update Master Profile
      description: |
        Replaces the authenticated user's master profile. Requires the `resume:write` scope when
        called with an API key.

        **This is a full replacement, not a patch.** `templateId`, `basics`, `links`, `summary` and
        `customization` are required. Any section array you omit is stored as `[]`, so leaving one
        out clears it. Keys not in the schema are dropped, not rejected. Read the profile first,
        modify the object you got back, and send the whole thing.

        Pass the `updatedAt` you last read as `expectedUpdatedAt` for optimistic concurrency; omit it
        only when creating the profile for the first time. The example below is a complete minimal
        payload that validates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
