      type: object
      required:
        - usernameOrUrl
      properties:
        usernameOrUrl:
          type: string
          description: |
            A GitHub username or profile URL. Always required and checked (`400` when it is neither).
            Free users may only import their own OAuth-connected account, so for them the linked
            GitHub login is imported instead of this value; paid users may import any public username.
          minLength: 1
        replaceMaster:
          type: boolean
          default: false
          description: When true, also overwrites the user's master profile with the imported content.
    ImportLinkedinRequest:
      type: object
      required:
        - profileText
      properties:
        profileText:
          type: string
          minLength: 10
          maxLength: 50000
          description: Raw copy-pasted text from a LinkedIn profile export or PDF (parsed by AI, not fetched via any LinkedIn API).
        replaceMaster:
          type: boolean
          default: false
          description: When true, also overwrites the user's master profile with the imported content.
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            The client's id for this import, as on every other AI route. A retry with the same id,
            the same text and the same `replaceMaster` after a lost response returns the document
            already created (`replayed: true`) without charging again; the same id with different
            text or a different `replaceMaster` is `409`.
    ProfileImportResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: |
            The newly created resume Document seeded from the imported data. A LinkedIn import
            replayed by `requestId` returns the stored document with `replayed: true` added.
          allOf:
            - $ref: "#/components/schemas/Document"
            - type: object
              properties:
                replayed:
                  type: boolean
                  description: Present and `true` only on a LinkedIn import replayed by `requestId`.
