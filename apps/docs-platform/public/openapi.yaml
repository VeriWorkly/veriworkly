        type:
          type: string
        processedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        productName:
          type:
            - string
            - "null"
          description: What the event was for, as the customer knows it, such as `7-Day Hunt Pass`.
        amountCents:
          type:
            - integer
            - "null"
        currency:
          type:
            - string
            - "null"
    BillingHistoryResponse:
      type: object
