    MasterProfileContent:
      type: object
      description: |
        The resume-shaped JSON stored in `MasterProfile.content`.

        On `PUT /profiles/master`, `templateId`, `basics`, `links`, `summary` and `customization` are
        required. An omitted array is stored as `[]`, and keys not listed here are dropped rather than
        rejected. Inside an item, every property is required unless its schema marks it optional.
        Every array item carries a client-generated `id`. Each top-level array holds at most 200
        items. A payload larger than 1 MB once serialized is rejected with `413`.
      required:
        - templateId
        - basics
        - links
        - summary
        - customization
      properties:
        schemaVersion:
          type: integer
          minimum: 1
          default: 2
          description: Version of the profile content format. Defaults to the current version when omitted.
        templateId:
          type: string
          minLength: 1
          maxLength: 64
        basics:
          $ref: "#/components/schemas/MasterProfileBasics"
        links:
          type: object
          required:
            - displayMode
            - items
          properties:
            displayMode:
              type: string
              enum:
                - icon
                - url
                - icon-username
            items:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/MasterProfileLink"
        summary:
          type: string
          maxLength: 8000
        experience:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileExperienceItem"
        education:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileEducationItem"
        projects:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileProjectItem"
        skills:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileSkillItem"
        languages:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileLanguageItem"
        interests:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileInterestItem"
        awards:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileAwardItem"
        certificates:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileCertificateItem"
        publications:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfilePublicationItem"
        volunteer:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileVolunteerItem"
        references:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileReferenceItem"
        achievements:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileAchievementItem"
        customSections:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileCustomSection"
        sections:
          type: array
          maxItems: 200
          default: []
          items:
            $ref: "#/components/schemas/MasterProfileSectionItem"
        customization:
          $ref: "#/components/schemas/MasterProfileCustomization"
        updatedAt:
          type: string
          format: date-time
