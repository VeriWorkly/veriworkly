openapi: 3.1.0
info:
  title: VeriWorkly API
  version: 1.0.0
  description: |
    The official API reference for VeriWorkly.

    ### Authentication Methods

    VeriWorkly supports two authentication methods:

    #### 1. API Key Authentication (recommended for scripts and integrations)
    For programmatic access, send your key either way — both are accepted:

    - `X-API-Key: vw_...`
    - `Authorization: Bearer vw_...`

    A key is **required** for any request that does not originate from a whitelisted VeriWorkly
    origin, including requests made from these documentation pages.

    - **Format**: `vw_` followed by 64 hexadecimal characters.
    - **Rate limit**: 20 requests per 15 minutes per key by default, configurable per key at
      creation up to 600 (the server's `API_KEY_MAX_RATE_LIMIT`). Responses carry
      `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`.
    - **Scopes**: keys are scope-gated. A key missing a route's required scope gets `403`. Session
      callers are never scope-gated.

    #### 2. Session Authentication (dashboard only)
    Used internally by the VeriWorkly dashboard and resume builder, via secure HTTP-only cookies
    issued by Better Auth.

    - **Cookies**:
      - Local: `veriworkly-auth.session_token`
      - Production: `__Secure-veriworkly-auth.session_token`
    - **Note**: sessions are only honoured for whitelisted origins. Send `credentials: 'include'`
      (fetch) or `withCredentials: true` (axios). Requests from these documentation pages **must**
      use an API key.
    - **Cookie domain**: when the server sets `AUTH_COOKIE_DOMAIN`, the session cookie is issued
      for that domain so it is shared across its subdomains. Without it the cookie belongs to the
      API host only.

    #### Endpoints that need neither
    These are fully open, with no key, session or first-party origin:

    - `GET /api/v1/health` and `GET /api/v1/health/ready`
    - `POST /api/v1/affiliates/click` and `GET /api/v1/affiliates/leaderboard` (while the
      affiliate program is switched on)
    - the Better Auth routes under `/api/v1/auth/*`
    - `POST /api/v1/contact`

    Everything else, including the endpoints labelled "public" such as public portfolios and
    share links, requires an API key or a whitelisted first-party origin, and returns `401`
    without one.

    #### Cross-origin requests
    A browser request whose `Origin` is not on the server's allowlist is refused with `403`,
    message "Not allowed by CORS" and `details.code` `CORS_REJECTED`, whatever credentials it
    carries. Requests without an `Origin` header (scripts, servers) are not affected.

    ### Response Envelope

    Every endpoint under `/api/v1` except the Better Auth routes at `/api/v1/auth/*` returns
    `{ success, message, data }` on success and `{ success, message, statusCode, details? }` on
    failure. Better Auth endpoints return their own payload shapes. `details` is an array of
    `{ path, message }` on a validation failure and an object (such as `{ code }`) elsewhere.

    A body larger than the route accepts is refused with `413` "Request body too large". Most
    routes accept 100 kb; documents, the master profile, profile imports, share links and the
    portfolio draft accept 4 MB; the AI and ATS text routes accept 256 kb. A body that is not
    valid JSON is refused with `400` "Invalid JSON body".

    ### Sign-in coverage
    Better Auth answers every path under `/api/v1/auth/*`. This reference documents the email
    code sign-in (`/email-otp/send-verification-otp`, `/sign-in/email-otp`),
    `/get-session` and `/sign-out`, which are the supported way to sign in from your own
    client. Better Auth's other routes are also served: social sign-in and account linking (Google, GitHub
    and LinkedIn when configured, through `/sign-in/social`, `/link-social` and `/callback/{provider}`),
    session management (`/list-sessions`, `/revoke-session`, `/revoke-sessions`,
    `/revoke-other-sessions`), and the rest of the email code plugin:
    `/email-otp/check-verification-otp`, `/email-otp/verify-email`,
    `/email-otp/request-password-reset` and `/email-otp/reset-password`. Those follow Better
    Auth's own documentation and are not described here. `/email-otp/request-email-change` and
    `/email-otp/change-email` are served but email change is not enabled, so both answer `400`
    "Change email with OTP is disabled". `/forget-password/email-otp` is switched off. A linked GitHub account cannot be removed (`/unlink-account` answers `403`
    with code `GITHUB_UNLINK_FORBIDDEN`), and an account can link only one GitHub account
    (`GITHUB_ALREADY_LINKED`, sent as an `error` query parameter on the OAuth redirect, or as a
    `403` code elsewhere).

    ### Not Documented Here

    These routes are internal or first-party only. They are left out of this reference on
    purpose and are not part of the supported public API:

    - `POST /api/v1/client-errors`: crash reports from VeriWorkly's own site;
    - `GET /api/v1/health/metrics` and `GET /api/v1/health/jobs`: behind the server's internal
      key;
    - `POST /api/v1/billing/webhooks/dodo`: the billing provider's signed webhook;
    - `POST /api/v1/github/admin/sync` and `GET /api/v1/stats/admin/dashboard`: admin sessions
      only, like everything under `/api/v1/admin/*`.

    ### Contact form
    `POST /api/v1/contact` sends a message to the VeriWorkly team. It is open (no key or
    session) and limited to 5 requests per hour per IP. The JSON body takes `name` (1 to 100
    characters), `email` (up to 254), `subject` (1 to 200), `message` (10 to 5,000) and `_ts`,
    the time the form was loaded in milliseconds since the epoch, which is required. `website`
    is a hidden field that must stay empty. A bad body answers `400` "Validation failed" with
    `details`; success answers `{ name, email, subject, timestamp }` with the message "Message
    sent successfully". A submission sent less than 1.2 seconds after `_ts`, with a `_ts` from
    before 2024 or more than an hour in the future, or with `website` filled, gets the same
    success answer and is dropped. A failure to send the email answers `500` "Internal server
    error. Failed to send message.". The rate limit fails closed: while it cannot be counted,
    the route answers `503` "Rate limiting is temporarily unavailable. Please retry shortly.".
servers:
  - url: https://api.veriworkly.com
    description: Production Server
  - url: http://localhost:8080
    description: Local Development
tags:
  - name: Health
    description: Service health and readiness checks.
  - name: Users
    description: Operations related to authenticated users.
  - name: Roadmap
    description: Operations related to roadmap.
  - name: Changelog
    description: Published release notes, filtering, and contributor statistics.
  - name: GitHub
    description: GitHub issues, pull requests, and repository statistics.
  - name: Authentication
    description: Email code sign-in and sessions, served by Better Auth. Other Better Auth routes are listed under "Sign-in coverage" above.
  - name: API Keys
    description: Operations related to managing personal API keys.
  - name: Profile
    description: The authenticated user's master profile — the single source of truth new documents are seeded from.
  - name: Profile Import
    description: Importing a master profile from GitHub (real OAuth) or LinkedIn (AI-parsed paste).
  - name: Documents
    description: CRUD for resumes, cover letters, portfolios, and link-in-bio documents.
  - name: ATS
    description: Deterministic and AI-assisted ATS resume scanning against a job description.
  - name: AI
    description: AI-powered content generation actions and their credit costs.
  - name: Portfolios
    description: Public portfolio pages, drafts, publishing, and analytics.
  - name: Portfolio Assets
    description: Presigned image uploads for portfolio avatars, project covers, and social images.
  - name: Billing
    description: Subscriptions, AI credit wallet, and Dodo Payments checkout/portal sessions.
  - name: Shares
    description: Public, optionally password-protected share links for documents.
  - name: Affiliates
    description: Affiliate enrollment, referrals, commissions, and withdrawals. Off by default in production behind a feature flag.
  - name: Ambassador
    description: Campus ambassador program application intake. Off by default in production behind a feature flag.
  - name: Stats
    description: Product usage events counted toward VeriWorkly's daily usage metrics.
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: healthCheck
      summary: Liveness Check
      description: |
        Lightweight liveness probe. Confirms the API process is up and responding.

        It deliberately touches **no** external dependency — no database query, no Redis command — so
        that frequent uptime polling does not keep database compute awake. It therefore cannot report
        on PostgreSQL or Redis, and never returns `503`. For dependency health use
        `GET /api/v1/health/ready`.

        It requires no session, no API key and no first-party origin, and it is not rate limited.
        The other fully open endpoints are listed in the introduction.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLivenessResponse"
              example:
                success: true
                message: Server is healthy
                data:
                  status: ok
                  timestamp: 2026-04-26T10:00:00.000Z
  /api/v1/health/ready:
    get:
      tags:
        - Health
      operationId: healthReady
      summary: Readiness Check
      description: |
        Deep readiness probe for deploy gates and manual diagnostics. Runs a `SELECT 1` against
        PostgreSQL and a `PING` against Redis, and returns `503` if either is unreachable.

        Because it wakes database compute on every call, prefer `GET /api/v1/health` for routine
        uptime monitoring. Like the liveness probe, it requires no authentication.
      responses:
        "200":
          description: Database and Redis are both reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
              example:
                success: true
                message: Server is healthy
                data:
                  status: ok
                  database: connected
                  redis: connected
                  timestamp: 2026-04-26T10:00:00.000Z
        "503":
          description: |
            The database or Redis could not be reached. `details` gives the state of each:
            `connected`, `timeout` or `error`. The underlying error is logged server-side only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 503
                message: Service Unavailable
                details:
                  database: connected
                  redis: timeout
  /api/v1/users/me:
    get:
      tags:
        - Users
      operationId: getCurrentUser
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Get Current User
      description: |
        Retrieves account metadata for the currently authenticated user. Requires the `user:read`
        scope when called with an API key.

        This returns identity metadata only — resume, cover letter, and portfolio content is never
        exposed here. Results are cached for 30 minutes and refreshed on write.
      responses:
        "200":
          description: User information fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                message: User information fetched successfully
                data:
                  id: cmnu7awv4000063lk18zpon2m
                  name: VeriWorkly User
                  username: veriworkly-user
                  email: info@veriworkly.com
                  emailVerified: true
                  autoSyncEnabled: false
                  createdAt: 2026-04-11T10:37:35.584Z
                  updatedAt: 2026-04-25T19:35:44.409Z
                  _count:
                    apiKeys: 2
                    shareLinks: 4
                    resumes: 4
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: User not found
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    delete:
      tags:
        - Users
      operationId: deleteCurrentUser
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Delete Current User
      description: |
        Permanently deletes the authenticated user's account with its documents, portfolio, share
        links, API keys and profile, then clears the session cookies. This cannot be undone.

        Billing and payout records are kept, unlinked from the deleted account, for as long as the law
        requires: subscriptions, purchases, entitlement grants, the credit wallet and its
        transactions, affiliate commissions and withdrawals.

        Session only: a request authenticated with an API key is rejected with `403`, whatever its
        scopes. The request is refused with `409` while something could still charge the card or
        while the user holds an unpaid affiliate balance:

        - a subscription the billing provider still reports as active, on hold, past due or paused,
          or one created in the last 24 hours that is not paid yet: cancel it from Billing first. A
          subscription already set to cancel at the end of its period still blocks deletion until
          that period ends;
        - `details.code: "CHECKOUT_IN_PROGRESS"`: a checkout session is open; finish or cancel it
          first;
        - an affiliate withdrawal is requested or approved and not yet paid or rejected;
        - `details.code: "AFFILIATE_BALANCE_FORFEIT"`: deleting forfeits the unpaid commissions in
          `details.amountCents` (`availableCents` plus `pendingCents`, in `currency`). Show the
          amount, then repeat the request with `confirmAffiliateForfeit: true` and
          `confirmedAffiliateForfeitCents` set to the amount shown. If the balance has grown past
          that amount, the request is refused again with the new one.
      parameters:
        - name: confirmAffiliateForfeit
          in: query
          required: false
          description: Same as `confirmAffiliateForfeit` in the body, for clients that cannot send a body with `DELETE`.
          schema:
            type: string
            enum:
              - "true"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
            example:
              confirmAffiliateForfeit: true
              confirmedAffiliateForfeitCents: 4000
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                success: true
                message: Your account and all associated documents, portfolios, and data have been permanently deleted.
                data: null
        "400":
          description: |
            The body is not valid JSON. The confirmation fields are read leniently, so a wrong value
            is treated as "not confirmed" (`409`), not refused here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 400
                message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: The request was authenticated with an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: This action cannot be performed with an API key. Sign in and delete your account from your Studio profile page.
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: User not found
        "409":
          description: |
            A live subscription must be cancelled first (or, when already set to cancel, must reach
            the end of its period), a checkout is open (`details.code: "CHECKOUT_IN_PROGRESS"`), an
            affiliate withdrawal is in progress, or deleting would forfeit an unpaid affiliate
            balance that was not confirmed (`details.code: "AFFILIATE_BALANCE_FORFEIT"`, with
            `amountCents`, `currency`, `availableCents` and `pendingCents`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/CodedErrorResponse"
              examples:
                subscription:
                  summary: A live subscription
                  value:
                    success: false
                    statusCode: 409
                    message: "Cancel your subscription before deleting your account: open Billing and use Manage Subscription. We cannot cancel it for you, and deleting now would leave you being charged for an account that no longer exists. Once the subscription has ended you can delete your account."
                subscriptionEnding:
                  summary: A subscription set to cancel that has not ended yet
                  value:
                    success: false
                    statusCode: 409
                    message: Your subscription is cancelled and ends on 2026-11-30. You can delete your account once it has ended. If you need it deleted sooner, contact support.
                checkoutOpen:
                  summary: A checkout session is open
                  value:
                    success: false
                    statusCode: 409
                    message: A checkout is still open for this account. Finish or cancel it before deleting the account.
                    details:
                      code: CHECKOUT_IN_PROGRESS
                withdrawalInProgress:
                  summary: An affiliate withdrawal is in progress
                  value:
                    success: false
                    statusCode: 409
                    message: You have a withdrawal in progress. Wait for it to be paid or rejected before deleting your account.
                affiliateForfeit:
                  summary: An unpaid affiliate balance
                  value:
                    success: false
                    statusCode: 409
                    message: You have 40.00 USD in unpaid affiliate commissions. Deleting your account forfeits it. Confirm to delete anyway.
                    details:
                      code: AFFILIATE_BALANCE_FORFEIT
                      amountCents: 4000
                      currency: USD
                      availableCents: 2500
                      pendingCents: 1500
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          description: |
            Account deletion is temporarily unavailable: the checkout state could not be read, or the
            sessions could not be revoked before the deletion. The account is untouched; try again
            shortly. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot
            be read, and as "Service temporarily unavailable" when the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                deletionUnavailable:
                  summary: Checkout state unreadable, or sessions not revoked
                  value:
                    success: false
                    statusCode: 503
                    message: Account deletion is temporarily unavailable. Try again shortly.
                authUnavailableCode:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                    details:
                      code: AUTH_UNAVAILABLE
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/users/me/name:
    put:
      tags:
        - Users
      operationId: updateUserName
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Update User Name
      description: |
        Updates the display name of the authenticated user. Requires the `user:write` scope when
        called with an API key.

        The email address is read-only through this API. Leading and trailing whitespace is trimmed
        before validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Name cannot be null or empty when updating.
            example:
              name: VeriWorkly
      responses:
        "200":
          description: User name updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                message: User name updated successfully
                data:
                  id: cmnu7awv4000063lk18zpon2m
                  name: VeriWorkly User New Name
                  username: veriworkly-user
                  email: info@veriworkly.com
                  emailVerified: true
                  autoSyncEnabled: false
                  createdAt: 2026-04-11T10:37:35.584Z
                  updatedAt: 2026-04-26T02:00:00.000Z
                  _count:
                    apiKeys: 2
                    shareLinks: 4
                    resumes: 4
        "400":
          description: Validation error. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyName:
                  summary: Name is empty
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: name
                        message: Name cannot be empty
                nameTooLong:
                  summary: Name too long
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: name
                        message: Name is too long
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/users/me/username:
    put:
      tags:
        - Users
      operationId: setUsername
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Set Username
      description: |
        Claims the authenticated user's username. Requires the `user:write` scope when called with an
        API key.

        The username is the public identifier in share-link URLs (`/share/{username}/{slug}`) and, for
        accounts holding `custom_subdomain`, the published-portfolio subdomain — so a user cannot
        create a share link until one is set.

        **A username can only be set once.** Once the account has one, this endpoint rejects any
        different value with `409 Username is locked and cannot be changed`. Re-sending the value the
        account already holds is a no-op and returns `200`, so the call is safe to retry.

        The submitted value is **normalised before validation**: lowercased, non-`[a-z0-9_-]`
        characters folded to hyphens, leading/trailing hyphens stripped, and truncated to 32
        characters. `Jane.Doe` and `jane-doe` therefore claim the same username. A value with no
        letters, digits, `_` or `-` at all (such as `!!!`) normalises to `user` and claims that name
        rather than being refused. The result must be 3 to 32 characters and must not be a reserved
        word (`admin`, `api`, `app`, `docs`, and similar platform-owned names). Check with
        `GET /users/{username}/availability` before committing.

        A successful claim invalidates the caller's cached session so the new username is visible
        immediately rather than at the end of the session-cache TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  description: Normalised server-side before the validity check runs.
            example:
              username: veriworkly-user
      responses:
        "200":
          description: Username updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                message: Username updated successfully
                data:
                  id: cmnu7awv4000063lk18zpon2m
                  name: VeriWorkly User
                  username: veriworkly-user
                  email: info@veriworkly.com
                  emailVerified: true
                  autoSyncEnabled: false
                  createdAt: 2026-04-11T10:37:35.584Z
                  updatedAt: 2026-04-26T02:00:00.000Z
                  _count:
                    apiKeys: 2
                    shareLinks: 4
                    resumes: 4
        "400":
          description: |
            The username failed validation after normalisation. The detail message is the reason:
            `too_short`, `invalid_characters` or `reserved`. A body that is not valid JSON answers
            "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: The username is reserved
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: username
                        message: reserved
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "409":
          description: The username is taken, or this account already has one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                taken:
                  summary: Claimed by another account
                  value:
                    success: false
                    statusCode: 409
                    message: Username is already taken
                locked:
                  summary: This account already has a username
                  value:
                    success: false
                    statusCode: 409
                    message: Username is locked and cannot be changed
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/users/me/sync:
    put:
      tags:
        - Users
      operationId: updateAutoSync
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Update Auto-Sync Preference
      description: |
        Turns the account-level background document sync on or off. Requires the `user:write` scope
        when called with an API key.

        This is the account-wide switch. It does not override a document's own `keepLocalOnly` flag —
        a document opted out individually stays local even with auto-sync on. Turning auto-sync off
        does not delete anything already synced; it only stops new local edits from being pushed.

        Defaults to `true` on a new account. A successful change invalidates the caller's cached
        session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
            example:
              enabled: true
      responses:
        "200":
          description: Auto sync preference updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                success: true
                message: Auto sync preference updated successfully
                data:
                  id: cmnu7awv4000063lk18zpon2m
                  name: VeriWorkly User
                  username: veriworkly-user
                  email: info@veriworkly.com
                  emailVerified: true
