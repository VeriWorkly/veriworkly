          $ref: "#/components/responses/AutosaveRateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/profiles/import/quota:
    get:
      tags:
        - Profile Import
      operationId: getImportQuota
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Get Profile Import Quota
      description: |
        Returns the caller's current GitHub and LinkedIn import quota status in one call. Requires
        the `resume:read` scope when called with an API key.

        - **GitHub import** is a real GitHub OAuth-backed integration (up to 30 of the account's most
          recently updated repositories, deterministically mapped to skills by repository language —
          no AI is involved). Free users get 1 import/day and may only import their own linked GitHub
          account. Paid users (any plan: AI Credits, Creator Pro or the Job Hunter Bundle, or a pass)
          may import any public GitHub username, but are capped at 50 imports/day, which protects the
          shared GitHub request budget every paid import uses. An account links one GitHub account,
          and a linked GitHub account cannot be removed.
        - **LinkedIn import** is not a LinkedIn API integration — it's an AI parse of raw text the
          user pastes in (copied profile text, or text extracted from an exported PDF). It costs the
          same AI credits as an ATS resume conversion, for every caller. Free users also get only 1
          import every 30 days; paid users have no import limit.

        Both import types share a single `replaceMaster` request flag and always create a brand-new
        RESUME document from the imported data, in addition to optionally overwriting the master
        profile.
      responses:
        "200":
          description: Quota status fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportQuotaResponse"
              example:
                success: true
                message: Quota status fetched successfully
                data:
                  github:
                    isPaid: false
                    unlimited: false
                    remaining: 1
                    limit: 1
                    resetsInSeconds: 0
                    connectedUsername: octocat
                    hasGithubAccount: true
                  linkedin:
                    isPaid: false
                    unlimited: false
                    remaining: 1
                    limit: 1
                    resetsInSeconds: 0
                    connectedUsername: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/profiles/import/github:
    post:
      tags:
        - Profile Import
      operationId: importGithub
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Import Profile From GitHub
      description: |
        Imports a GitHub profile and repositories directly via the GitHub REST API (no AI parsing) and
        creates a new RESUME document from the result. Free users can only import their own linked
        GitHub account: `usernameOrUrl` is still required and must be a valid GitHub username or
        profile URL, but the linked login is imported instead; paid users may import any public
        username, up to 50 imports a day (see `GET /profiles/import/quota`). Requires the
        `resume:write` scope when called with an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGithubRequest"
            example:
              usernameOrUrl: octocat
              replaceMaster: false
      responses:
        "200":
          description: GitHub profile imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportResponse"
              example:
                success: true
                message: GitHub profile imported successfully
                data:
                  id: doc_123
                  userId: user_123
                  type: RESUME
                  title: GitHub Import (octocat)
                  slug: github-import-octocat
                  tags: []
                  content: {}
                  templateId: executive-clarity
                  schemaVersion: 1
                  revision: 1
                  visibility: PRIVATE
                  createdAt: 2026-04-01T10:00:00.000Z
                  updatedAt: 2026-04-01T10:00:00.000Z
        "400":
          description: |
            `usernameOrUrl` is not a GitHub username or profile URL (checked first, for every
            caller), a free user has no connected GitHub account, or the body fails validation. A
            body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Free user has no connected GitHub account
                  value:
                    success: false
                    statusCode: 400
                    message: Please connect your GitHub account in settings to import your profile.
                invalidUsername:
                  summary: Not a GitHub username or profile URL
                  value:
                    success: false
                    statusCode: 400
                    message: Enter a valid GitHub username or profile URL.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          description: A free account already keeps its one active resume (`details.code` is `DOCUMENT_LIMIT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 402
                message: Free accounts can keep 1 active resume at a time. Unlimited documents come with any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass; credit packs add AI credits only.
                details:
                  code: DOCUMENT_LIMIT
                  type: RESUME
        "403":
          description: The API key lacks `resume:write`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: This API key does not have permission for this action.
        "404":
          description: GitHub profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: GitHub profile for "octocat" not found.
        "409":
          description: |
            The linked GitHub token was refused (`details.code: "GITHUB_RECONNECT_REQUIRED"`):
            reconnect GitHub in settings. Never a `401`, which would read as a signed-out session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: Import quota exceeded. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                freeDailyLimit:
                  summary: Free-tier daily limit
                  value:
                    success: false
                    statusCode: 429
                    message: Free accounts can import from GitHub once a day. Unlimited imports come with any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass.
                    details:
                      resetsInSeconds: 54000
                paidSharedCap:
                  summary: Paid hidden shared-token cap
                  value:
                    success: false
                    statusCode: 429
                    message: You've reached the daily limit of 50 GitHub imports. This protects the shared GitHub API budget used by all users. Please try again tomorrow.
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "502":
          description: 'GitHub errored, timed out or could not be reached (`details.code: "GITHUB_UNAVAILABLE"`).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 'GitHub rate limit (`details.code: "GITHUB_RATE_LIMITED"`); try again later. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                authUnavailableCode:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                    details:
                      code: AUTH_UNAVAILABLE
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/profiles/import/linkedin:
    post:
      tags:
        - Profile Import
      operationId: importLinkedin
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Import Profile From LinkedIn
      description: |
        Parses raw copy-pasted LinkedIn profile text (or text extracted from an exported PDF) using AI
        and creates a new RESUME document from the result. This is an AI-parsed paste, not a LinkedIn
        API integration. Requires the `resume:write` and `ai:write` scopes when called with an API
        key.

        Every import spends AI credits, the same as an ATS resume conversion (see `pricing` on
        `GET /ats/quota`). The credits are held before the model runs and charged only once the
        import is saved; a short balance is `402` and nothing runs. Free users also get only 1
        import every 30 days and keep one resume at a time; paid users (any plan or a pass) have no
        import limit.

        It is an AI route like the others: it counts toward the AI rate limit and the two AI
        requests a user may have in flight (`429` beyond that), ends at the AI request deadline
        (`504`, nothing charged), and takes an optional `requestId` that makes a retry free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportLinkedinRequest"
            example:
              profileText: |-
                Jane Doe
                Software Engineer at VeriWorkly
                ...
              replaceMaster: false
      responses:
        "200":
          description: LinkedIn profile imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportResponse"
              example:
                success: true
                message: LinkedIn profile imported successfully
                data:
                  id: doc_124
                  userId: user_123
                  type: RESUME
                  title: LinkedIn Import
                  slug: linkedin-import
                  tags: []
                  content: {}
                  templateId: executive-clarity
                  schemaVersion: 1
                  revision: 1
                  visibility: PRIVATE
                  createdAt: 2026-04-01T10:00:00.000Z
                  updatedAt: 2026-04-01T10:00:00.000Z
        "400":
          description: Validation error. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Validation error
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: profileText
                        message: LinkedIn profile text must be at least 10 characters long
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          description: |
            Not enough AI credits, or a free account already keeps its one resume
            (`details.code` `DOCUMENT_LIMIT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                credits:
                  summary: Not enough AI credits
                  value:
                    success: false
                    statusCode: 402
                    message: Not enough AI credits. Credits come with a credit pack, a pass, AI Credits or the Job Hunter Bundle.
                documentLimit:
                  summary: Free account already keeps one resume
                  value:
                    success: false
                    statusCode: 402
                    message: Free accounts can keep 1 active resume at a time. Unlimited documents come with any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass; credit packs add AI credits only.
                    details:
                      code: DOCUMENT_LIMIT
                      type: RESUME
        "403":
          description: The API key lacks `resume:write` or `ai:write`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: This API key does not have permission for this action.
        "409":
          description: |
            The `requestId` was already used: for another operation, for this import with different
            text or a different `replaceMaster`, or it is still processing. Also sent when the credit
            balance changed while the credits were being held; retry the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                otherOperation:
                  summary: Id used for another operation or input
                  value:
                    success: false
                    statusCode: 409
                    message: AI request id was already used for another operation.
                processing:
                  summary: The same request is still running
                  value:
                    success: false
                    statusCode: 409
                    message: This AI request is processing.
                balanceChanged:
                  summary: The balance moved while credits were held
                  value:
                    success: false
                    statusCode: 409
                    message: Credit balance changed. Retry the action.
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: |
            The free import quota is used up (`details.resetsInSeconds`), the caller already has two
            AI requests in progress (`Retry-After` 10), or a rate limit was hit: the per-IP AI limit
            (20 per minute) or, with an API key, the per-key limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                inFlight:
                  summary: Two AI requests already in progress
                  value:
                    success: false
                    statusCode: 429
                    message: Too many AI requests in progress. Wait for one to finish and try again.
                documented:
                  summary: Import quota exceeded
                  value:
                    success: false
                    statusCode: 429
                    message: Free accounts can import from LinkedIn once a month. Unlimited imports come with any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass.
                    details:
                      resetsInSeconds: 2160000
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "502":
          description: The AI provider failed, or its output could not be turned into a profile. Nothing is charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                failed:
                  summary: AI parsing failed
                  value:
                    success: false
                    statusCode: 502
                    message: Failed to parse profile data using AI. Please try again.
                incomplete:
                  summary: The parsed profile did not validate
                  value:
                    success: false
                    statusCode: 502
                    message: Imported profile data was incomplete. Please try again.
        "503":
          description: |
            The AI gateway credentials or the server's AI policy are not usable, the server is
            restarting (`details.code` `SERVER_RESTARTING`, with `Retry-After`), the session store
            cannot be read (`details.code` `AUTH_UNAVAILABLE`), or the database cannot be reached.
            Nothing is charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                credentials:
                  summary: AI gateway credentials missing
                  value:
                    success: false
                    statusCode: 503
                    message: AI provider credentials are not configured.
                restarting:
                  summary: The server is restarting
                  value:
                    success: false
                    statusCode: 503
                    message: The server is restarting. Try again in a few seconds.
                    details:
                      code: SERVER_RESTARTING
                      retryAfterSeconds: 5
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                    details:
                      code: AUTH_UNAVAILABLE
        "504":
          description: The AI provider did not answer before the request deadline. Nothing is charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 504
                message: The AI request timed out before the provider answered.
  /api/v1/documents:
    get:
      tags:
        - Documents
      operationId: listDocuments
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: List Documents
      description: |
        Lists the authenticated user's documents (resumes, cover letters, portfolios, link-in-bio
        pages), optionally filtered by type. Soft-deleted documents are excluded. Document bodies
        are left out unless `includeContent=true`.

        **Paging.** Every response is one page: `limit` documents, 20 when it is not sent. To read
        the whole list, send each page's `nextCursor` back as `cursor` until it is `null`. `total`
        is the number of live documents of this type. Send the same
        `type`, `updatedSince` and `includeContent` on every page of one walk; a cursor that was
        not issued for them is rejected with `400` and `details.code` `INVALID_DOCUMENT_CURSOR`.

        - The plain list goes newest first, by `updatedAt` then `id`.
        - A sync walk (`updatedSince` set, or `includeContent=true`) goes oldest first, by
          `updatedAt` then `id`. A document edited during the walk comes back again on a later
          page, so none is skipped; keep the copy you saw last.
        - With `updatedSince`, documents deleted since then come back in `deleted`, also paged
          (up to `limit` per page, oldest deletion first) beside the documents. Keep following
          `nextCursor` until it is `null`.
        - Every page of one walk repeats the first page's `serverTime`. Use it as the next
          `updatedSince` only after the last page.

        A request without `limit` used to get one unpaged list of up to 500 documents; it now gets
        the first page of 20, with `nextCursor`.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - RESUME
              - COVER_LETTER
              - PORTFOLIO
              - LINK_IN_BIO
          description: Filter documents by type.
        - name: updatedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return only documents updated after this date-time. It must be in UTC and end in `Z`, for example `2026-01-01T00:00:00Z`; a timezone offset is rejected with `400`.
        - name: includeContent
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
          description: Set to `true` to include each document's `content`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Documents per page, 20 by default, at most 50, or at most 20 with `includeContent=true` (a larger value is rejected with `400`).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 8192
          description: The previous page's `nextCursor`, unchanged. Opaque; do not build or edit it.
      responses:
        "200":
          description: Documents fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
              example:
                success: true
                message: Documents fetched successfully
                data:
                  - id: doc_123
                    type: RESUME
                    title: My Resume
                    slug: my-resume
                    tags: []
                    metadata: {}
                    templateId: modern
                    revision: 1
                    visibility: PRIVATE
                    lastSyncedAt: 2026-04-20T10:00:00.000Z
                    createdAt: 2026-04-01T10:00:00.000Z
                    updatedAt: 2026-04-20T10:00:00.000Z
                serverTime: 2026-04-20T10:05:00.000Z
                deleted: []
                nextCursor: eyJ2IjoxLCJmaWx0ZXIiOnsidHlwZSI6bnVsbH19
                total: 37
        "400":
          description: |
            Bad Request. An invalid parameter (including a `limit` over the cap) is
            `Validation failed` with `details` listing each field as `{ path, message }`. A
            `cursor` that is malformed or was issued for other filters is `Invalid cursor` with
            `details: { code: "INVALID_DOCUMENT_CURSOR" }`; start the walk again without it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListErrorResponse"
              example:
                success: false
                statusCode: 400
                message: Invalid cursor
                details:
                  code: INVALID_DOCUMENT_CURSOR
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    post:
      tags:
        - Documents
      operationId: createDocument
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Create Document
      description: |
        Creates a new document. If no `content` is provided for a RESUME or COVER_LETTER, it is
        auto-seeded from the user's MasterProfile (when one exists). Free-tier users are limited to
        1 active document per type; upgrading removes that limit.

        Idempotent on the client's own `id`: sending an `id` the caller already has live answers
        `200` "Document already exists" with the stored row (not `201`), so a retried sync adopts
        the server's revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreateRequest"
            example:
              type: RESUME
              title: My Resume
      responses:
        "200":
          description: The `id` sent is already one of the caller's live documents; the stored row is returned and nothing is written. The message is "Document already exists".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "201":
          description: Document created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BodyValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          description: Free-tier document limit reached (`details.code` `DOCUMENT_LIMIT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 402
                message: Free accounts can keep 1 active resume at a time. Unlimited documents come with any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass; credit packs add AI credits only.
                details:
                  code: DOCUMENT_LIMIT
                  type: RESUME
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "409":
          description: The `id` belongs to another account or to one of the caller's deleted documents, or the slug is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInUse:
                  summary: Id used by another account
                  value:
                    success: false
                    statusCode: 409
                    message: Document ID already in use
                deleted:
                  summary: Id of a deleted document
                  value:
                    success: false
                    statusCode: 409
                    message: Document was deleted
                    details:
                      id: doc_123
                      deletedAt: 2026-04-20T10:00:00.000Z
                slugInUse:
                  summary: Slug taken
                  value:
                    success: false
                    statusCode: 409
                    message: Document slug is already in use
        "413":
          description: |
            A body over 4 MB is refused by the parser with "Request body too large". A body under that
            whose `content` or `metadata` is over 1,000,000 characters once serialised is refused
            with "Document content payload is too large".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Content or metadata over 1,000,000 characters
                  value:
                    success: false
                    statusCode: 413
                    message: Document content payload is too large
                bodyTooLarge:
                  summary: Body over the route's parser limit
                  value:
                    success: false
                    statusCode: 413
                    message: Request body too large
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/documents/{id}:
    get:
      tags:
        - Documents
      operationId: getDocument
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Get Document
      description: |
        Returns one of the caller's documents with its full content. A document in the trash, or one
        that belongs to another account, answers `404`. Requires the `resume:read` scope when
        called with an API key.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Document not found
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    patch:
      tags:
        - Documents
      operationId: updateDocument
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Update Document
      description: |
        Updates a document using optimistic concurrency control: `revision` must match the
        document's current revision or the request fails with `409`.

        The response is the updated document without `content` and `metadata` (the body you sent
        is not echoed back); keep the returned `revision` for the next update.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdateRequest"
            example:
              title: Updated Resume Title
              revision: 1
      responses:
        "200":
          description: Document updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUpdateResponse"
        "400":
          $ref: "#/components/responses/BodyValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            The API key lacks `resume:write`, or the update sets `visibility` to anything but
            `PRIVATE` on a document a moderator made private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                scope:
                  summary: API key missing the required scope
                  value:
                    success: false
                    statusCode: 403
                    message: This API key does not have permission for this action.
                moderated:
                  summary: Made private by a moderator
                  value:
                    success: false
                    statusCode: 403
                    message: This document was made private by a moderator.
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Document not found
        "409":
          description: Revision mismatch, or slug conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                revisionMismatch:
                  summary: Optimistic concurrency conflict
                  value:
                    success: false
                    statusCode: 409
                    message: "Revision mismatch. Client: 1, Server: 2"
                slugConflict:
                  summary: Slug already in use
                  value:
                    success: false
                    statusCode: 409
                    message: Document slug is already in use
        "413":
          description: |
            A body over 4 MB is refused by the parser with "Request body too large". A body under that
            whose `content` or `metadata` is over 1,000,000 characters once serialised is refused
            with "Document content payload is too large".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Content or metadata over 1,000,000 characters
                  value:
                    success: false
                    statusCode: 413
                    message: Document content payload is too large
                bodyTooLarge:
                  summary: Body over the route's parser limit
                  value:
                    success: false
                    statusCode: 413
                    message: Request body too large
        "429":
          $ref: "#/components/responses/AutosaveRateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    delete:
      tags:
        - Documents
      operationId: deleteDocument
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Delete Document
      description: |
        Soft-deletes a document by setting `deletedAt`. The document is immediately excluded from
        list/get responses. Hard delete and restore exist at the service layer but are not exposed
        through any public route.

        `data` is `null` on success: the deleted document is not echoed back. Deleting a document
        that is already in the trash also answers `200`; only an id the caller does not own, or one
        already purged, answers `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                success: true
                message: Document deleted successfully
                data: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/InsufficientScopeError"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Document not found
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/ats/quota:
    get:
      tags:
        - ATS
      operationId: getAtsQuota
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Get ATS Scan Quota
      description: |
        Returns the caller's current ATS scan quota status. This endpoint works for anonymous
        callers too (quota is keyed by a hashed IP when unauthenticated).

        There is a single shared scan-quota bucket for both the deterministic `/ats/check` scan and
        the AI-powered `/ats/analyze` deep analysis — they are **not** two separate quotas. Limits:

        - Anonymous: 1 scan / 48 hours
        - Free or paused (signed in): 2 scans / 24 hours
        - Subscriber: 300 scans a month. Any account that holds spendable AI credits, whatever their
          source, or holds a paid subscription or pass even with no credits left.

        `canConvertResume` and `canRepair` say whether the caller's credit balance covers those AI
        actions. `pricing` is null when the server could not load its ATS AI settings, and both are
        then false.
      responses:
        "200":
          description: Quota fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsQuotaResponse"
              example:
                success: true
                message: Success
                data:
                  tier: free
                  limit: 2
                  used: 0
                  remaining: 2
                  resetsAt: 2026-04-28T00:00:00.000Z
                  canConvertResume: false
                  canRepair: false
                  pricing:
                    analysisCredits:
                      min: 1
                      max: 6
                    jobUrlAnalysisCredits:
                      min: 2
                      max: 12
                    resumeConversionCredits: 2
                    parseRepairCredits: 2
                  extract:
                    limit: 6
                    used: 0
                    remaining: 6
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/ats/extract:
    post:
      tags:
        - ATS
      operationId: extractAtsResumeText
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Extract Resume Text
      description: |
        Extracts plain text from an uploaded resume file (PDF, DOCX, HTML, TXT, Markdown, or JSON, max 5MB)
        for use as the `resume` field on `/ats/check` or `/ats/analyze`. Does not consume ATS scan
        quota. Uploads are metered by a separate extract budget instead (`quota.extract`), and a
        request over it is rejected with `429`. The multipart body must carry only the `resume`
        file; any other field is rejected with `400`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resume
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        "200":
          description: Text extracted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsExtractResponse"
        "400":
          description: |
            Missing file, unsupported or unreadable file, a file with too little text (a scanned PDF
            has its own message), or a multipart field or file other than `resume` (multer's reason
            follows "Upload refused:").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unreadable:
                  summary: The parser could not read the file
                  value:
                    success: false
                    statusCode: 400
                    message: Resume file could not be read.
                tooLittleText:
                  summary: Under 50 characters of text
                  value:
                    success: false
                    statusCode: 400
                    message: Resume file did not contain enough readable text.
                scannedPdf:
                  summary: A PDF with no text layer
                  value:
                    success: false
                    statusCode: 400
                    message: This PDF appears to be a scanned image or flattened graphic without an embedded text layer. Real ATS parsers cannot read scanned resumes without OCR. Please export your resume as a text-based PDF or Word document.
                extraField:
                  summary: A multipart field other than the file
                  value:
                    success: false
                    statusCode: 400
                    message: "Upload refused: Too many fields."
                missingFile:
                  summary: No file provided
                  value:
                    success: false
                    statusCode: 400
                    message: Provide a resume file.
                unsupportedType:
                  summary: Unsupported file type
                  value:
                    success: false
                    statusCode: 400
                    message: Upload a PDF, DOCX, HTML, TXT, Markdown, or JSON resume.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "408":
          description: Extraction took too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 408
                message: Resume extraction took too long to process.
        "413":
          description: The file is larger than 5MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 413
                message: The file is larger than the 5 MB upload limit.
        "422":
          description: The parser ran out of memory on this file. Simplify or re-export it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 422
                message: This file is too complex to read.
        "429":
          description: ATS upload quota exceeded. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsQuotaErrorResponse"
              examples:
                documented:
                  summary: ATS upload quota exceeded
                  value:
                    success: false
                    statusCode: 429
                    message: ATS upload quota exceeded.
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "503":
          description: |
            Extraction is busy, unavailable, or stopping for a restart; the upload is returned to the
            extract budget. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store
            cannot be read, and as "Service temporarily unavailable" when the database cannot be
            reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Extraction is busy
                  value:
                    success: false
                    statusCode: 503
                    message: Too many resume extractions in progress. Please retry shortly.
                extractionUnavailable:
                  summary: The extraction process failed to start or restart
                  value:
                    success: false
                    statusCode: 503
                    message: Resume extraction is temporarily unavailable.
                shuttingDown:
                  summary: The server is shutting down
                  value:
                    success: false
                    statusCode: 503
                    message: Server is shutting down.
                authUnavailableCode:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                    details:
                      code: AUTH_UNAVAILABLE
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/ats/check:
    post:
      tags:
        - ATS
      operationId: checkAtsResume
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Run Deterministic ATS Scan
      description: |
        Runs the free, rule-based ATS readiness scan — no AI call is made. Works for anonymous
        callers. Consumes one unit from the shared ATS scan quota (see `GET /ats/quota`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtsCheckRequest"
            example:
              resume: |-
                Jane Doe
                Software Engineer
                ...
              jobDescription: We are looking for a Software Engineer with React experience...
      responses:
        "200":
          description: Scan completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsCheckResponse"
        "400":
          description: |-
            The body failed validation, or the resume is an `AtsResumeDocument` that is not valid.
            Neither costs a scan. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  summary: Validation error
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: resume
                        message: Required
                invalidDocument:
                  summary: Invalid structured resume
                  value:
                    success: false
                    statusCode: 400
                    message: "Invalid resume document at basics.name: Required"
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: ATS scan quota exceeded. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsQuotaErrorResponse"
              examples:
                documented:
                  summary: ATS scan quota exceeded
                  value:
                    success: false
                    statusCode: 429
                    message: ATS scan quota exceeded.
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /api/v1/ats/analyze:
    post:
      tags:
        - ATS
      operationId: analyzeAtsResume
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Run AI-Powered ATS Analysis
      description: |
        Runs the deterministic scan plus an AI deep-analysis pass on top of it (explanation, missing
        evidence, keyword opportunities, prioritized fixes). Requires authentication. Consumes one
        unit from the same shared ATS scan quota as `/ats/check` — this is not a second, separate
        quota. Requires the `ai:write` API key scope when called with an API key.

        Optionally fetches a job description from a URL instead of requiring pasted text
        (`fetchJobUrl: true` + `jobUrl`). The fetch is SSRF-hardened: HTTPS-only on the standard port,
        rejects localhost/private/link-local addresses, resolves DNS once and pins that IP for the
        whole request (including redirects), and caps redirects to 3 and the response size to 2MB.
        The page may go 8 seconds without sending data and must finish within 15 seconds; each DNS
        lookup has its own 5-second limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtsAnalyzeRequest"
            example:
              resume: |-
                Jane Doe
                Software Engineer
                ...
              jobDescription: We are looking for a Software Engineer with React experience...
              fetchJobUrl: false
              requestId: ats-analyze-8f3ac1e2b9
      responses:
        "200":
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsAnalyzeResponse"
        "400":
          description: |-
            The body failed validation, `fetchJobUrl` was true without a `jobUrl`, the resume
            document is not valid, or the job page could not be fetched or read. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  summary: Validation error
                  value:
                    success: false
                    statusCode: 400
                    message: Validation failed
                    details:
                      - path: requestId
                        message: Required
                missingJobUrl:
                  summary: fetchJobUrl without jobUrl
                  value:
                    success: false
                    statusCode: 400
                    message: Provide a job URL to analyze online.
                blockedUrl:
                  summary: Job URL resolves to a blocked network
                  value:
                    success: false
                    statusCode: 400
                    message: Job URL resolves to a blocked network.
                jobPage:
                  summary: Job page unusable
                  description: |
                    Other job-page messages: "Job URL must use HTTPS on the standard port.", "Job URL
                    host is not allowed.", "Job URL could not be resolved.", "Job URL could not be
                    resolved in time.", "Job page request timed
                    out.", "Job page redirect limit exceeded.", "Job page exceeds the download limit.",
                    "Job page must be HTML or plain text.", "Job page could not be retrieved.".
                  value:
                    success: false
                    statusCode: 400
                    message: Job page did not contain enough readable text.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          description: The credit balance cannot cover the cheapest analysis this request could cost (plus repair, when it would run).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 402
                message: Not enough AI credits. Credits come with a credit pack, a pass, AI Credits or the Job Hunter Bundle.
        "403":
          description: API key is missing the ai:write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 403
                message: This API key does not have permission for this action.
        "409":
          description: The `requestId` was already used, or is still processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                reused:
                  summary: Used for another operation
                  value:
                    success: false
                    statusCode: 409
                    message: AI request id was already used for another operation.
                processing:
                  summary: Still processing
                  value:
                    success: false
                    statusCode: 409
                    message: This AI request is processing.
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: |-
            The ATS scan quota is used up (`details` is the quota), the caller already has two AI
            requests in progress (`Retry-After` says when to try again), or a rate limit was hit: the
            per-IP AI limit (20 requests per minute) or, with an API key, the per-key limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                quota:
                  summary: Scan quota used up
                  value:
                    success: false
                    statusCode: 429
                    message: ATS scan quota exceeded.
                inFlight:
                  summary: Too many AI requests at once
                  value:
                    success: false
                    statusCode: 429
                    message: Too many AI requests in progress. Wait for one to finish and try again.
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
                apiKeyLimit:
                  summary: Per-key limit
                  value:
                    success: false
                    statusCode: 429
                    message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "502":
          description: The AI gateway failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 502
                message: AI ATS analysis could not be completed.
        "503":
          description: |-
            The server's ATS AI settings are invalid or missing, the AI gateway credentials are not
            configured, or the server is restarting (`details.code` `SERVER_RESTARTING`, with
            `Retry-After`). Nothing is charged. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                policy:
                  summary: Invalid ATS AI settings
                  value:
                    success: false
                    statusCode: 503
                    message: AI ATS policy is invalid.
                restarting:
                  summary: Server restarting
                  value:
                    success: false
                    statusCode: 503
                    message: The server is restarting. Try again in a few seconds.
                    details:
                      code: SERVER_RESTARTING
                      retryAfterSeconds: 5
                authUnavailableCode:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                    details:
                      code: AUTH_UNAVAILABLE
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
        "504":
          description: The AI request ran past its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 504
                message: The AI request timed out before the provider answered.
  /api/v1/ats/convert-resume:
    post:
      tags:
        - ATS
      operationId: convertAtsResume
      security:
        - ApiKeyAuth: []
        - LocalSession: []
        - ProdSession: []
      summary: Convert Resume Text To Structured JSON
      description: |
        Uses AI to convert raw resume text into structured JSON Resume-shaped fields. Spends AI
        credits from any source (a plan, a pass or a credit pack), independently of the shared ATS
        scan quota above. The result becomes a resume, so a free account that already keeps one
        resume is refused with `402` before anything is charged. A retry with the same `requestId`
        and text returns the stored result without charging again. Requires the `ai:write` API key
        scope when called with an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtsConvertResumeRequest"
            example:
              resume: |-
                Jane Doe
                Software Engineer
                ...
              requestId: ats-convert-8f3ac1e2b9
      responses:
        "200":
          description: Resume converted successfully
          content:
