    ProfileImportQuota:
      type: object
      required:
        - isPaid
        - unlimited
        - remaining
        - limit
        - resetsInSeconds
        - connectedUsername
      properties:
        isPaid:
          type: boolean
          description: The caller has any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass. A credit pack does not count.
        unlimited:
          type: boolean
          description: True for a paid caller's LinkedIn quota. `remaining` and `limit` are then null.
        remaining:
          type:
            - integer
            - "null"
        limit:
          type:
            - integer
            - "null"
          description: 1 for a free caller (a day for GitHub, 30 days for LinkedIn), 50 a day for a paid caller's GitHub imports, null when unlimited.
        resetsInSeconds:
          type: integer
        connectedUsername:
          type:
            - string
            - "null"
          description: The GitHub login of the linked account, read from GitHub for a free caller. Null for a paid caller, for LinkedIn, or when GitHub cannot be reached.
        hasGithubAccount:
          type: boolean
          description: GitHub quota only. A GitHub login is linked to the account, whatever GitHub says about its token.
