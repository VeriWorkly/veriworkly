              - todo
              - in-progress
              - done
          required: false
          description: Filter features by status
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - oldest
              - recently-completed
            default: newest
          required: false
          description: |
            Sort order. `recently-completed` orders by completion date (nulls last), then by last
            update.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
