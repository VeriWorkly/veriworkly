        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/portfolios/preview/{documentId}:
    get:
      tags:
        - Portfolios
      operationId: previewPortfolio
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Preview Portfolio Draft
      description: |
        Returns the caller's own portfolio draft for rendering a preview, without publishing it.
        The response is a trimmed projection of the document, not a full `Document` record — it has
        no `slug`. Session-authenticated only.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Draft fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPreviewResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: Portfolio draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Portfolio draft not found.
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/portfolios/publish:
    post:
      tags:
        - Portfolios
      operationId: publishPortfolio
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Publish Portfolio
      description: |
        Publishes the given draft revision to its chosen subdomain, making it publicly reachable.
        Premium templates (`nimbus`, `cipher`) need Creator Pro, the Job Hunter Bundle or a pass;
        `signal` and `atelier` are free. The stored draft is checked against the stricter publish
        rules (see `PortfolioDraftContent`).

        **Current-state caveat:** in production, publishing is gated behind a hardcoded
        `ADMIN_EMAIL` check independent of plan tier (`isAdminUser`) — regular users can save drafts,
        preview, and manage everything except actually flipping a portfolio live. This is a
        temporary rollout restriction, not a permanent product limitation. Only administrators can
        exercise this endpoint end-to-end in production today; outside production (`NODE_ENV` other
        than `production`) it is unrestricted. The restriction is checked before the body, so in
        production a non-admin gets `403` even for an invalid body.

        Checks run in this order: the premium-template `402`, then the stale-revision `409`, then
        the subdomain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioPublishRequest"
      responses:
        "201":
          description: Portfolio published successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPublishResponse"
        "400":
          description: |
            Validation error, incomplete portfolio content, an unusable image reference, or an empty,
            reserved or punycode subdomain. A body that is not valid JSON answers "Invalid JSON body".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidSubdomain:
                  summary: Empty, reserved or punycode subdomain
                  value:
                    success: false
                    statusCode: 400
                    message: Choose a valid portfolio subdomain.
                incompleteContent:
                  summary: Draft does not satisfy the stricter publish schema
                  value:
                    success: false
                    statusCode: 400
                    message: Complete the required portfolio details before publishing.
                badAsset:
                  summary: Referenced image is missing, not owned, or not READY
                  value:
                    success: false
                    statusCode: 400
                    message: Portfolio contains an unavailable or invalid image.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "402":
          description: A premium template (`nimbus`, `cipher`) without Creator Pro, the Job Hunter Bundle or a pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 402
                message: Publishing the premium template "Nimbus" requires Creator Pro, the Job Hunter Bundle or a pass.
        "403":
          description: The production publishing restriction, or a portfolio a moderator took down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                productionGate:
                  summary: Non-admin in production
                  value:
                    success: false
                    statusCode: 403
                    message: Publishing is disabled in production during this phase.
                moderated:
                  summary: Taken down by a moderator
                  value:
                    success: false
                    statusCode: 403
                    message: This portfolio was taken down by a moderator.
        "404":
          description: Portfolio draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale revision, or subdomain already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                stale:
                  summary: Stale revision
                  value:
                    success: false
                    statusCode: 409
                    message: Save the latest draft before publishing.
                subdomainTaken:
                  summary: Subdomain already in use
                  value:
                    success: false
                    statusCode: 409
                    message: That portfolio subdomain is already in use.
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          description: |
            The draft references images but media delivery is not configured on the server
            (`R2_PUBLIC_BASE_URL` unset), the session store cannot be read, or the database cannot
            be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                mediaDelivery:
                  summary: Media delivery not configured
                  value:
                    success: false
                    statusCode: 503
                    message: Portfolio media delivery is not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/portfolios/unpublish:
    post:
      tags:
        - Portfolios
      operationId: unpublishPortfolio
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Unpublish Portfolio
      description: |
        Takes a published portfolio offline — status becomes `SUSPENDED` with reason
        `user_unpublished`, and the underlying document reverts to `PRIVATE` visibility. The document
        itself is not deleted, so the portfolio can be republished later.

        A caller who has never published gets `404`. A portfolio a moderator took down keeps its
        moderation reason; the unpublish is recorded so the site stays offline if the takedown is
        lifted. Session-authenticated only.
      responses:
        "200":
          description: Portfolio unpublished successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioUnpublishResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: The caller has never published a portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Portfolio is not published.
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/portfolios/analytics:
    get:
      tags:
        - Portfolios
      operationId: getPortfolioAnalytics
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get Portfolio Analytics
      description: |
        View counts for the caller's published portfolio. `totalViews` is all-time, including views
        still buffered and not yet flushed. `daily` is the 30 most recent days that had any views,
        newest first; days with no views are left out, so it is not a 30-day calendar. `referrers`
        is the all-time top 10 referrer hosts from flushed views only (views still buffered are not
        in it).

        Visitor analytics comes with Creator Pro, the Job Hunter Bundle or a pass. Without it the
        response has `locked: true` and all-zero data, whether or not a portfolio is published. With
        it and no published portfolio, `locked` is false and the data is all zero.
      responses:
        "200":
          description: Analytics fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAnalyticsResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/portfolio-assets/upload-url:
    post:
      tags:
        - Portfolio Assets
      operationId: createPortfolioAssetUploadUrl
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Create Portfolio Asset Upload URL
      description: |
        Issues a presigned Cloudflare R2 PUT URL (10-minute expiry) for a JPG, PNG, or WebP image up
        to 5MB. Upload the file directly to `uploadUrl` with a matching Content-Type/Content-Length,
        then call `POST /portfolio-assets/complete` to verify and activate it. Session-authenticated
        only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioAssetUploadRequest"
            example:
              kind: AVATAR
              mimeType: image/png
              sizeBytes: 204800
      responses:
        "200":
          description: Upload URL created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAssetUploadResponse"
        "400":
          description: |
            A `kind` outside the list or a `sizeBytes` that is not a positive integer ("Validation
            failed"), a `mimeType` other than JPEG, PNG or WebP, a size over 5 MB, or a body that is
            not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Unsupported image type
                  value:
                    success: false
                    statusCode: 400
                    message: Upload a JPG, PNG, or WebP image.
                tooLarge:
                  summary: Over 5 MB
                  value:
                    success: false
                    statusCode: 400
                    message: Image must be 5 MB or smaller.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          description: The caller started 20 uploads in the last hour, finished or not. The per-IP limit also answers `429` ("Too many requests. Please try again later.").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: The caller started 20 uploads in the last hour, finished or not
                  value:
                    success: false
                    statusCode: 429
                    message: Too many image uploads this hour. Try again later.
                ipLimit:
                  summary: Per-IP limit
                  value:
                    success: false
                    statusCode: 429
                    message: Too many requests. Please try again later.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema:
                type: integer
        "503":
          description: |
            Media uploads are not configured (R2 credentials missing), the session store cannot be
            read, or the database cannot be reached. The asset row is created before the storage
            check, so an upload refused for missing credentials still counts toward the 20 uploads
            an hour and leaves a pending row behind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  summary: R2 credentials missing
                  value:
                    success: false
                    statusCode: 503
                    message: Portfolio media uploads are not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/portfolio-assets/complete:
    post:
      tags:
        - Portfolio Assets
      operationId: completePortfolioAssetUpload
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Complete Portfolio Asset Upload
      description: |
        Verifies an uploaded asset with a server-side HEAD request against R2 (confirming size,
        content type, and optional checksum match what was declared) and marks it `READY` so it can
        be referenced from a portfolio. Session-authenticated only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioAssetCompleteRequest"
      responses:
        "200":
          description: Asset completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAssetCompleteResponse"
        "400":
          description: The uploaded file does not match the declared size, type or checksum, or the body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sizeMismatch:
                  summary: Size differs from the declared size
                  value:
                    success: false
                    statusCode: 400
                    message: Uploaded file size (180000 bytes) does not match expected size (204800 bytes).
                typeMismatch:
                  summary: Type differs from the declared type
                  value:
                    success: false
                    statusCode: 400
                    message: Uploaded file type (image/jpeg) does not match expected type (image/png).
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Portfolio asset not found.
        "409":
          description: Storage has no object for this asset; the browser's upload failed or was aborted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 409
                message: The upload was not received. Upload the image again.
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          description: |
            Media delivery is not configured (public base URL missing), media uploads are not
            configured (R2 credentials missing), the session store cannot be read, or the database
            cannot be reached. Any other storage error answers `500`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                deliveryNotConfigured:
                  summary: Public base URL missing
                  value:
                    success: false
                    statusCode: 503
                    message: Portfolio media delivery is not configured.
                uploadsNotConfigured:
                  summary: R2 credentials missing
                  value:
                    success: false
                    statusCode: 503
                    message: Portfolio media uploads are not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/portfolio-assets/{id}:
    delete:
      tags:
        - Portfolio Assets
      operationId: deletePortfolioAsset
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Delete Portfolio Asset
      description: |
        Deletes the R2 object and its metadata row. An asset created in the last 15 minutes (the
        upload URL's lifetime plus 5 minutes) keeps its row, marked `DELETED`, so a late completion
        cannot revive it. `data` is `null` on success. Session-authenticated only.

        An image the published portfolio still shows cannot be deleted (`409`): publish without it
        first.

        This does not rewrite any portfolio that still references the asset — remove the reference
        and save the draft first, or publishing will fail with `400`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                success: true
                message: Success
                data: null
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: Portfolio asset not found.
        "409":
          description: The published portfolio still shows this image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 409
                message: Your published portfolio still shows this image. Publish without it first.
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          description: |
            Media uploads are not configured (R2 credentials missing), the session store cannot be
            read, or the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  summary: R2 credentials missing
                  value:
                    success: false
                    statusCode: 503
                    message: Portfolio media uploads are not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/billing/me:
    get:
      tags:
        - Billing
      operationId: getBillingSummary
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get Billing Summary
      description: |
        Returns the caller's plan, subscription status, entitlements, AI credit wallet, and public
        catalog in one call. Entitlements (e.g. portfolio publishing) and the AI credit wallet are
        two independent systems — a plan can grant one, both, or neither depending on `productKey`.

        Plans that carry AI credits grant 1,000 credits a month. An annual plan grants them month by
        month, not all at once. Subscription credits expire at the end of their month and never roll
        over; credit packs last 90 days. `graceEndsAt` and `publicationStatus` describe the grace
        period after a failed renewal, and `access` tells a paying customer from a free one.
        Session-authenticated only.
      responses:
        "200":
          description: Billing summary fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummaryResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/billing/history:
    get:
      tags:
        - Billing
      operationId: getBillingHistory
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get Billing History
      description: Lists the caller's processed billing events (most recent 50), each with the product and amount it was for. Session-authenticated only.
      responses:
        "200":
          description: History fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingHistoryResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/billing/credits:
    get:
      tags:
        - Billing
      operationId: getCreditWallet
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get AI Credit Wallet
      description: Returns the caller's current AI credit balance, reserved amount, and next expiring grant. Session-authenticated only.
      responses:
        "200":
          description: Wallet fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditWalletResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/billing/credits/history:
    get:
      tags:
        - Billing
      operationId: getCreditHistory
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Get AI Credit Transaction History
      description: Lists the caller's 50 most recent AI credit ledger entries (grants, debits, refunds, adjustments and expiries), newest first. Session-authenticated only.
      responses:
        "200":
          description: History fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditHistoryResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          $ref: "#/components/responses/SessionServiceUnavailableError"
  /api/v1/billing/checkout:
    post:
      tags:
        - Billing
      operationId: createBillingCheckout
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Create Subscription Checkout Session
      description: |
        Creates a hosted Dodo Payments checkout session for a subscription product. `productKey` and
        `interval` are validated against a fixed whitelist (the product catalog) before being handed
        off to Dodo — arbitrary product/interval combinations are rejected with `400`. A Redis lock
        prevents starting a second checkout while one is already in flight. Session-authenticated
        only; blocked for non-admins in production during the current rollout phase.

        When the caller already has an open session for the same choice, its URL is returned again
        with `reused: true` instead of creating a new one. An error from the billing provider while
        creating the session is not mapped and answers `500`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              productKey: portfolio_pro
              interval: monthly
      responses:
        "200":
          description: Checkout session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: |
            The body fails validation ("Validation failed" with `details`), the product/interval
            combination is not offered, or the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                documented:
                  summary: Invalid product/interval combination
                  value:
                    success: false
                    statusCode: 400
                    message: That billing interval is not available for this product.
                invalidJson:
                  summary: The body is not valid JSON
                  value:
                    success: false
                    statusCode: 400
                    message: Invalid JSON body
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "403":
          description: Payments disabled in production for non-admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
              example:
                success: false
                statusCode: 403
                message: Payments are disabled in production during this phase. Only administrators can perform payments.
                details:
                  code: PAYMENTS_DISABLED
        "404":
          description: The account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 404
                message: User not found
        "409":
          description: |
            The purchase would overlap something the customer already has, or a checkout is already
            open. `details.code` says which:

            - `CHECKOUT_IN_PROGRESS`: a checkout session is open or being created. Finish it, or
              cancel it with `POST /billing/checkout/cancel`.
            - `UPGRADE_AVAILABLE`: the live plan can be upgraded to the bundle in place.
              `details.upgrade` (`{ productKey: "bundle", interval }`) is the body to send to
              `POST /billing/subscription/change-plan`.
            - `ALREADY_SUBSCRIBED`, `ALREADY_INCLUDED`, `SUBSCRIPTION_OVERLAP`: the customer already
              pays for this, or for a plan that includes it. `details.activeProductKey` names the
              live plan and `details.suggestedProductKey` the plan to move to, when there is one.
            - `PAYMENT_OUTSTANDING`, `SUBSCRIPTION_PAUSED`: the live subscription needs attention in
              the billing portal first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
              example:
                success: false
                statusCode: 409
                message: "You already have an active AI Credits subscription. AI Credits and Creator Pro together are the Job Hunter Bundle: upgrade AI Credits to the Job Hunter Bundle instead, and pay only the difference for the rest of this billing period."
                details:
                  code: UPGRADE_AVAILABLE
                  activeProductKey: ai_credits
                  suggestedProductKey: bundle
                  upgrade:
                    productKey: bundle
                    interval: monthly
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "502":
          description: The billing provider did not return a checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                statusCode: 502
                message: Billing provider did not return a checkout URL.
        "503":
          description: Billing, or the selected product, is not configured on the server. Also sent when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                billing:
                  summary: Billing not configured
                  value:
                    success: false
                    statusCode: 503
                    message: Billing is not configured.
                product:
                  summary: Product not configured
                  value:
                    success: false
                    statusCode: 503
                    message: The selected billing product is not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/billing/checkout/cancel:
    post:
      tags:
        - Billing
      operationId: cancelBillingCheckout
      security:
        - LocalSession: []
        - ProdSession: []
      summary: Cancel In-Flight Checkout
      description: |
        Forgets the open checkout sessions created by `POST /billing/checkout` and
        `POST /billing/credits/checkout`, allowing a new checkout to be started (and an account with
        no other open session to be deleted). Each session is checked with the billing provider
        first: one whose payment succeeded or is processing stays until its webhook settles it.
        Session-authenticated only.
      responses:
        "200":
          description: Checkout cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCheckoutResponse"
        "401":
          $ref: "#/components/responses/SessionUnauthorizedError"
        "409":
          description: The subscription or pass session's payment is still processing (`details.code` is `CHECKOUT_STILL_PROCESSING`), or a checkout is still being prepared (no code; try again in a moment). A credit pack still being paid does not cause this; it is reported in `stillProcessing`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/IpRateLimitError"
        "503":
          description: |
            The billing provider could not be asked about a session; nothing was cleared
            (`details.code` `PROVIDER_UNAVAILABLE`). Without a `details.code`: billing is not
            configured on the server, the session store cannot be read, or the database cannot be
            reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                providerUnavailable:
                  summary: Billing provider unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Could not confirm the checkout with the billing provider. Try again in a moment.
                    details:
                      code: PROVIDER_UNAVAILABLE
                notConfigured:
                  summary: Billing not configured
                  value:
                    success: false
                    statusCode: 503
                    message: Billing is not configured.
                authUnavailable:
                  summary: Session store unavailable
                  value:
                    success: false
                    statusCode: 503
                    message: Authentication is temporarily unavailable
                databaseUnavailable:
                  summary: Database unreachable
                  value:
                    success: false
                    statusCode: 503
                    message: Service temporarily unavailable
  /api/v1/billing/portal:
    post:
      tags:
