trackAffiliateClick:
  post:
    tags:
      - Affiliates
    operationId: trackAffiliateClick
    summary: Track Affiliate Click
    description: |
      Public, unauthenticated endpoint. Records a click against an affiliate's referral code.
      Entire affiliate program is gated behind a feature flag (`config.growth.affiliateProgramEnabled`)
      that defaults off in production until explicitly enabled — every route in this group,
      including this one, returns `503` while the flag is off.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AffiliateClickRequest"
          example:
            code: "jane-doe1"
    responses:
      "200":
        description: Click tracked successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AffiliateClickResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "404":
        description: Affiliate link not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "503":
        $ref: "../components/responses.yaml#/FeatureDisabledError"

getAffiliateLeaderboard:
  get:
    tags:
      - Affiliates
    operationId: getAffiliateLeaderboard
    summary: Get Affiliate Leaderboard
    description: Public, unauthenticated endpoint. Top 50 affiliates ranked by commission earnings, for the current calendar month or all-time.
    parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum: [monthly, all_time]
          default: monthly
    responses:
      "200":
        description: Leaderboard fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AffiliateLeaderboardResponse"
      "503":
        $ref: "../components/responses.yaml#/FeatureDisabledError"

getMyAffiliateDashboard:
  get:
    tags:
      - Affiliates
    operationId: getMyAffiliateDashboard
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get My Affiliate Dashboard
    description: Returns the caller's affiliate status, tier, wallet, clicks, referrals, commissions, and withdrawal history. Session-authenticated only.
    responses:
      "200":
        description: Dashboard fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AffiliateDashboardResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "503":
        $ref: "../components/responses.yaml#/FeatureDisabledError"

enrollAsAffiliate:
  post:
    tags:
      - Affiliates
    operationId: enrollAsAffiliate
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Enroll As Affiliate
    description: Enrolls the caller in the affiliate program, generating a unique referral code. Idempotent — calling this again while already enrolled just returns the current dashboard. Session-authenticated only.
    responses:
      "200":
        description: Enrolled successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AffiliateDashboardResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: The caller's affiliate account is suspended.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Affiliate account is suspended"
      "503":
        description: |
          The affiliate program is switched off (see `FeatureDisabledError`), or no unique
          affiliate code could be made ("Could not create a unique affiliate code."). Retry the
          second case.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"

applyAffiliateReferral:
  post:
    tags:
      - Affiliates
    operationId: applyAffiliateReferral
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Apply Affiliate Referral Code
    description: |
      Attaches another affiliate's referral code to the caller's account and answers
      `{ applied: true }`. Self-referrals are rejected, and each account may only apply one
      referral code, ever, within its first days after signing up and before any purchase.
      Session-authenticated only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AffiliateReferralRequest"
    responses:
      "200":
        description: Referral applied successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AffiliateReferralResponse"
      "400":
        description: Validation error, or attempted self-referral
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "Self-referrals are not allowed."
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "404":
        description: Affiliate code not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "409":
        description: |
          This account already has a referral, signed up too long ago ("Referral codes can only be
          applied within N days of signing up."), or has already bought something ("Referral
          codes cannot be applied after a purchase.").
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "503":
        $ref: "../components/responses.yaml#/FeatureDisabledError"

requestAffiliateWithdrawal:
  post:
    tags:
      - Affiliates
    operationId: requestAffiliateWithdrawal
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Request Affiliate Withdrawal
    description: |
      Requests a payout of available affiliate commission balance (minimum $25 / 2,500 cents).
      Money owed back from a reversed commission is netted first, so the most that can be
      requested is `withdrawableCents` on the dashboard.
      Payouts are reviewed and marked paid manually by an admin out-of-band (bank transfer, PayPal,
      etc) — Dodo Payments only exposes a read-only settlements API, not an outbound transfer API,
      so this cannot be automated end-to-end yet. Session-authenticated only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AffiliateWithdrawalRequest"
          example:
            amountCents: 5000
    responses:
      "200":
        description: Withdrawal requested successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AffiliateWithdrawalResponse"
      "400":
        description: The amount is more than `withdrawableCents`, or fails validation.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "Available balance is too low."
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: The affiliate account is not active (`details.code` `AFFILIATE_NOT_ACTIVE`).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "This affiliate account is not active, so its balance cannot be paid out."
              details:
                code: "AFFILIATE_NOT_ACTIVE"
                affiliateStatus: "SUSPENDED"
      "409":
        description: An active withdrawal request already exists
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "503":
        $ref: "../components/responses.yaml#/FeatureDisabledError"
