createShareLink:
  post:
    tags:
      - Shares
    operationId: createShareLink
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Create Share Link
    description: |
      Creates (or replaces, if one already exists for this document) a public share link for a
      document. Optionally password-protected — passwords are scrypt-hashed and never returned in
      any response.

      A link expires 7, 14, 30 or 90 days after it is made, or never. Send `noExpiry: true` for
      never, or an `expiresAt` 7, 14, 30 or 90 days from now (within a day, for clock skew). With
      neither (an `expiresAt` of `null` counts as neither, not as never), a new link lasts **7 days**
      and replacing an existing link keeps its expiry. Any
      other date, or `noExpiry` together with a date, is `400`.

      The caller **must have claimed a username first**, since it forms the public URL
      (`/{username}/{slug}`); without one the request fails with `400`. Requires the
      `resume:write` scope when called with an API key.

      The snapshot may be at most 1 MB once serialized (`413` otherwise). It is not echoed in
      the response, nor in the owner's list of links.

      `allowDownload` (default `true`) says whether the public page shows a Download button.
      Replacing an existing link without it keeps the stored value. It is a display preference,
      not a security control: the studio hides the Download button, and viewers can still save
      the page.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ShareLinkCreateRequest"
          example:
            documentId: "doc_123"
            snapshot: {}
            noExpiry: true
    responses:
      "201":
        description: Share link created successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ShareLinkResponse"
      "400":
        description: Validation error, the caller has not claimed a username yet, or the document is not a résumé or cover letter. A body that is not valid JSON answers "Invalid JSON body".
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              noUsername:
                summary: Username not set
                value:
                  success: false
                  statusCode: 400
                  message: "Username required before sharing"
              notShareable:
                summary: Document type cannot be shared
                value:
                  success: false
                  statusCode: 400
                  message: "Only résumés and cover letters can be shared by link."
              validation:
                summary: Validation error
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "documentId"
                      message: "String must contain at least 1 character(s)"
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: |-
          A moderator made this document private, or made another of the account's résumés or
          cover letters private (a trashed one too, until retention purges it). No link is created
          or refreshed on the account until a moderator lifts it. A portfolio takedown does not
          pause sharing. An API key without the scope this operation needs also gets `403`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: A moderator made this document private, or made another of the account's résumés or cover letters private (a trashed one too, until retention purges it)
                value:
                  success: false
                  statusCode: 403
                  message: "A moderator made one of your résumés or cover letters private, so new share links are paused until a moderator lifts it."
              scope:
                summary: API key missing the required scope
                value:
                  success: false
                  statusCode: 403
                  message: This API key does not have permission for this action.
      "404":
        description: Document not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Document not found"
      "413":
        description: The snapshot is larger than 1 MB. A body over the route's parser limit is refused first, with "Request body too large".
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              bodyTooLarge:
                summary: Body over the route's parser limit
                value:
                  success: false
                  statusCode: 413
                  message: Request body too large
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailableError

listSharedDocumentIds:
  get:
    tags:
      - Shares
    operationId: listSharedDocumentIds
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: List Shared Document IDs
    description: Given a comma-separated list of document IDs, returns which of them currently have an active (non-expired) share link. Useful for badging a document list in the UI.
    parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated document IDs.
    responses:
      "200":
        description: Shared document ids fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/SharedDocumentIdsResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        $ref: ../components/responses.yaml#/InsufficientScopeError
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailableError

listShareLinksForDocument:
  get:
    tags:
      - Shares
    operationId: listShareLinksForDocument
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: List Share Links For Document
    description: Returns the (at most one) share link for a document, offset-paginated for shape consistency with other list endpoints.
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      "200":
        description: Share links fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ShareLinkListResponse"
      "400":
        description: "`offset` (or `page`) reaches past row 1,000,000."
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        $ref: ../components/responses.yaml#/InsufficientScopeError
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailableError

revokeShareLink:
  delete:
    tags:
      - Shares
    operationId: revokeShareLink
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Revoke Share Link
    description: |
      Deletes the share link, immediately breaking its public URL. `data` is `null` on success.
      Requires the `resume:write` scope when called with an API key.
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      - name: shareLinkId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Share link revoked successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/NullDataResponse"
            example:
              success: true
              message: "Share link revoked successfully"
              data: null
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        $ref: ../components/responses.yaml#/InsufficientScopeError
      "404":
        description: Share link not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Share link not found"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailableError

getPublicShareLink:
  get:
    tags:
      - Shares
    operationId: getPublicShareLink
    summary: Get Public Share Link
    description: |
      Returns the shared document's title and snapshot, unless the link is password-protected — in
      which case only `passwordRequired: true` is returned and the caller must call
      `POST /shares/public/{username}/{slug}/verify` with the password.

      `allowDownload` says whether to show a Download button. It is a display preference, not a
      security control: the studio hides the Download button, and viewers can still save the page.

      No user session is required, but the request is still gated: it must carry an API key, or
      originate from a whitelisted first-party origin. A bare request from an unrecognised origin
      is rejected with `401`.
    security:
      - ApiKeyAuth: []
      - {}
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Shared document fetched successfully (or password required)
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PublicShareResponse"
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "404":
        description: Link not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Link not found"
      "410":
        description: Link expired
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 410
              message: "Link expired"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

verifyPublicShareLinkPassword:
  post:
    tags:
      - Shares
    operationId: verifyPublicShareLinkPassword
    summary: Verify Public Share Link Password
    description: |
      Verifies a password-protected share link's password using a timing-safe comparison against
      the stored scrypt hash, and returns the full snapshot on success.

      No user session is required, but the request must carry an API key or originate from a
      whitelisted first-party origin, same as the read endpoint.

      **Rate limited to 5 password attempts per link per 5 minutes per client network**, and to 20
      requests per 5 minutes per IP across all links, to make these links impractical to
      brute-force. A correct password resets the per-link count. A link without a password is
      returned directly.
    security:
      - ApiKeyAuth: []
      - {}
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: slug
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/VerifySharePasswordRequest"
    responses:
      "200":
        description: Shared document unlocked successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PublicShareResponse"
      "400":
        $ref: ../components/responses.yaml#/BodyValidationError
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        description: Wrong password. A `403`, not a `401`, so a signed-in viewer is not treated as signed out.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Invalid password"
      "404":
        description: Link not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Link not found"
      "410":
        description: Link expired
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 410
              message: "Link expired"
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        description: |-
          Too many password attempts for this link (5 per 5 minutes), or too many verify requests
          from this IP (20 per 5 minutes). `Retry-After` says when to try again. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: Too many password attempts for this link (5 per 5 minutes), or too many verify requests from this IP (20 per 5 minutes)
                value:
                  success: false
                  statusCode: 429
                  message: "Too many password attempts. Please try again later."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
              apiKeyLimit:
                summary: Per-key limit
                value:
                  success: false
                  statusCode: 429
                  message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "503":
        description: The server cannot count attempts right now, so it refuses to check the password. `Retry-After` is 30 seconds. Also sent as "Service temporarily unavailable" when the database cannot be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The server cannot count attempts right now, so it refuses to check the password
                value:
                  success: false
                  statusCode: 503
                  message: "Password verification is temporarily unavailable"
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable
