getBillingSummary:
  get:
    tags:
      - Billing
    operationId: getBillingSummary
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get Billing Summary
    description: |
      Returns the caller's plan, subscription status, entitlements, AI credit wallet, and public
      catalog in one call. Entitlements (e.g. portfolio publishing) and the AI credit wallet are
      two independent systems — a plan can grant one, both, or neither depending on `productKey`.

      Plans that carry AI credits grant 1,000 credits a month. An annual plan grants them month by
      month, not all at once. Subscription credits expire at the end of their month and never roll
      over; credit packs last 90 days. `graceEndsAt` and `publicationStatus` describe the grace
      period after a failed renewal, and `access` tells a paying customer from a free one.
      Session-authenticated only.
    responses:
      "200":
        description: Billing summary fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/BillingSummaryResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"

getBillingHistory:
  get:
    tags:
      - Billing
    operationId: getBillingHistory
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get Billing History
    description: Lists the caller's processed billing events (most recent 50), each with the product and amount it was for. Session-authenticated only.
    responses:
      "200":
        description: History fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/BillingHistoryResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"

getCreditWallet:
  get:
    tags:
      - Billing
    operationId: getCreditWallet
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get AI Credit Wallet
    description: Returns the caller's current AI credit balance, reserved amount, and next expiring grant. Session-authenticated only.
    responses:
      "200":
        description: Wallet fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CreditWalletResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"

getCreditHistory:
  get:
    tags:
      - Billing
    operationId: getCreditHistory
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get AI Credit Transaction History
    description: Lists the caller's 50 most recent AI credit ledger entries (grants, debits, refunds, adjustments and expiries), newest first. Session-authenticated only.
    responses:
      "200":
        description: History fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CreditHistoryResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"

createBillingCheckout:
  post:
    tags:
      - Billing
    operationId: createBillingCheckout
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Create Subscription Checkout Session
    description: |
      Creates a hosted Dodo Payments checkout session for a subscription product. `productKey` and
      `interval` are validated against a fixed whitelist (the product catalog) before being handed
      off to Dodo — arbitrary product/interval combinations are rejected with `400`. A Redis lock
      prevents starting a second checkout while one is already in flight. Session-authenticated
      only; blocked for non-admins in production during the current rollout phase.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/CheckoutRequest"
          example:
            productKey: "portfolio_pro"
            interval: "monthly"
    responses:
      "200":
        description: Checkout session created successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CheckoutResponse"
      "400":
        description: Invalid product/interval combination
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "That billing interval is not available for this product."
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: Payments disabled in production for non-admins
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Payments are disabled in production during this phase. Only administrators can perform payments."
              details:
                code: "PAYMENTS_DISABLED"
      "409":
        description: |
          The purchase would overlap something the customer already has, or a checkout is already
          open. `details.code` says which:

          - `CHECKOUT_IN_PROGRESS`: a checkout session is open or being created. Finish it, or
            cancel it with `POST /billing/checkout/cancel`.
          - `UPGRADE_AVAILABLE`: the live plan can be upgraded to the bundle in place.
            `details.upgrade` (`{ productKey: "bundle", interval }`) is the body to send to
            `POST /billing/subscription/change-plan`.
          - `ALREADY_SUBSCRIBED`, `ALREADY_INCLUDED`, `SUBSCRIPTION_OVERLAP`: the customer already
            pays for this, or for a plan that includes it. `details.activeProductKey` names the
            live plan and `details.suggestedProductKey` the plan to move to, when there is one.
          - `PAYMENT_OUTSTANDING`, `SUBSCRIPTION_PAUSED`: the live subscription needs attention in
            the billing portal first.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "You already have an active AI Credits subscription. AI Credits and Creator Pro together are the Job Hunter Bundle: upgrade AI Credits to the Job Hunter Bundle instead, and pay only the difference for the rest of this billing period."
              details:
                code: "UPGRADE_AVAILABLE"
                activeProductKey: "ai_credits"
                suggestedProductKey: "bundle"
                upgrade:
                  productKey: "bundle"
                  interval: "monthly"
      "502":
        description: The billing provider did not return a checkout URL.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 502
              message: "Billing provider did not return a checkout URL."
      "503":
        description: Billing, or the selected product, is not configured on the server.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              billing:
                summary: Billing not configured
                value:
                  success: false
                  statusCode: 503
                  message: "Billing is not configured."
              product:
                summary: Product not configured
                value:
                  success: false
                  statusCode: 503
                  message: "The selected billing product is not configured."

cancelBillingCheckout:
  post:
    tags:
      - Billing
    operationId: cancelBillingCheckout
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Cancel In-Flight Checkout
    description: |
      Forgets the open checkout sessions created by `POST /billing/checkout` and
      `POST /billing/credits/checkout`, allowing a new checkout to be started (and an account with
      no other open session to be deleted). Each session is checked with the billing provider
      first: one whose payment succeeded or is processing stays until its webhook settles it.
      Session-authenticated only.
    responses:
      "200":
        description: Checkout cancelled successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CancelCheckoutResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "409":
        description: The subscription or pass session's payment is still processing, or a checkout is still being prepared. A credit pack still being paid does not cause this; it is reported in `stillProcessing`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "503":
        description: The billing provider could not be asked about a session; nothing was cleared. `details.code` is `PROVIDER_UNAVAILABLE`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"

createBillingPortal:
  post:
    tags:
      - Billing
    operationId: createBillingPortal
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Create Billing Portal Session
    description: |
      Creates a Dodo Payments customer portal URL, where an existing customer cancels, downloads
      receipts and fixes a failed card. It sells nothing new, so it is open in production to every
      customer (not only administrators). Needs a billing account, which the first checkout
      creates. Session-authenticated only.
    responses:
      "200":
        description: Portal session created successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/BillingPortalResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "409":
        description: No billing account exists yet
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "No billing account exists yet."

createCreditPackCheckout:
  post:
    tags:
      - Billing
    operationId: createCreditPackCheckout
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Create Extra Credit Pack Checkout
    description: |
      Creates a one-time Dodo Payments checkout session for an extra AI credit pack, on top of any
      subscription. While the session can still be paid (24 hours, or until its payment lands or
      `POST /billing/checkout/cancel` clears it), the account cannot be deleted.
      Session-authenticated only; blocked for non-admins in production during the current rollout
      phase.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/CreditPackCheckoutRequest"
          example:
            packKey: "credit_pack_250"
    responses:
      "200":
        description: Checkout session created successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CreditPackCheckoutResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: Payments disabled in production for non-admins
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Payments are disabled in production during this phase. Only administrators can perform payments."
              details:
                code: "PAYMENTS_DISABLED"
      "503":
        description: Extra credit checkout is not configured
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"

previewPlanChange:
  post:
    tags:
      - Billing
    operationId: previewPlanChange
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Preview Plan Upgrade
    description: |
      Prices an upgrade of the live subscription without changing anything: what is charged now
      for the rest of the period, and what the new plan renews at. The body accepts any plan and
      any recurring interval, but only an upgrade to the `bundle` in the same billing period is
      carried out (the one `UPGRADE_AVAILABLE` from `POST /billing/checkout` offers). Any other
      change, a downgrade included, is refused with `409` and a `details.code`; to move to a
      smaller plan, cancel in the billing portal and subscribe again when the plan ends. Session-authenticated only; blocked for non-admins in
      production during the current rollout phase.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PlanChangePreviewRequest"
          example:
            productKey: "bundle"
            interval: "monthly"
    responses:
      "200":
        description: The provider's quote for the upgrade.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PlanChangePreviewResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: Payments disabled in production for non-admins
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Payments are disabled in production during this phase. Only administrators can perform payments."
              details:
                code: "PAYMENTS_DISABLED"
      "409":
        description: |
          This plan cannot be changed this way. `details.code` is one of: `NO_SUBSCRIPTION`,
          `PLAN_CHANGE_UNAVAILABLE` (contact support), `PAYMENT_OUTSTANDING`,
          `SUBSCRIPTION_PAUSED`, `ALREADY_SUBSCRIBED`, `PLAN_CHANGE_NOT_UPGRADE` (only an upgrade
          to the bundle), `PLAN_CHANGE_INTERVAL` (the upgrade keeps the current billing period) or
          `SUBSCRIPTION_ENDING` (resume the subscription first).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "Your AI Credits plan is billed monthly. The upgrade keeps that billing period."
              details:
                code: "PLAN_CHANGE_INTERVAL"
      "502":
        description: The billing provider could not price the upgrade; nothing was changed. `details.code` is `PROVIDER_UNAVAILABLE`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
      "503":
        description: The selected billing product is not configured
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"

changePlan:
  post:
    tags:
      - Billing
    operationId: changePlan
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Upgrade Plan
    description: |
      Upgrades the live subscription to the `bundle` in place. As with the preview, the body
      accepts any plan and recurring interval, and any change other than that upgrade is refused
      with `409` and a `details.code`. The provider charges the prorated
      difference, and the plan, its features and its credits move once that payment succeeds and
      its webhook arrives; until then the answer is `status: "pending"`.

      An idempotency key is required, in the `Idempotency-Key` header or as `idempotencyKey` in
      the body (the header wins). Retrying with the same key never asks the provider twice: it
      returns the stored answer with `replayed: true`. Session-authenticated only; blocked for
      non-admins in production during the current rollout phase.
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Up to 128 characters. Required unless `idempotencyKey` is in the body.
        schema:
          type: string
          maxLength: 128
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PlanChangeRequest"
          example:
            productKey: "bundle"
            interval: "monthly"
    responses:
      "200":
        description: "The provider accepted the change (`confirmed: true`)."
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PlanChangeResponse"
            example:
              success: true
              message: "Success"
              data:
                status: "pending"
                productKey: "bundle"
                interval: "monthly"
                paymentId: "pay_123"
                confirmed: true
      "202":
        description: "The provider's answer never arrived (`confirmed: false`). The change may still apply; it is held as pending, and a retry with the same key replays this answer."
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PlanChangeResponse"
      "400":
        description: The body is invalid, or no idempotency key was sent (`details.code` `IDEMPOTENCY_KEY_REQUIRED`).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: Payments disabled in production for non-admins
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Payments are disabled in production during this phase. Only administrators can perform payments."
              details:
                code: "PAYMENTS_DISABLED"
      "409":
        description: |
          The change was refused. `details.code` is one of the preview's codes, or
          `PLAN_CHANGE_PENDING` (a change for this subscription is already waiting for its
          payment) or `IDEMPOTENCY_KEY_REUSED` (this key was used for a different plan change).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "A plan change for this subscription is already in progress. It completes once the payment is confirmed."
              details:
                code: "PLAN_CHANGE_PENDING"
      "502":
        description: The billing provider refused the change; nothing was changed and the same key may try again. `details.code` is `PROVIDER_UNAVAILABLE`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/CodedErrorResponse"
      "503":
        description: The selected billing product is not configured
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
