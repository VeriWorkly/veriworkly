getGitHubStats:
  get:
    tags:
      - GitHub
    operationId: getGitHubStats
    summary: Get GitHub Stats
    security:
      - ApiKeyAuth: []
    description: |
      Fetch aggregated issue and pull-request statistics for the configured repository, as of the
      last sync. Served from the last synced snapshot, not live from GitHub — `syncedAt` tells you
      how fresh it is. Cached for 12 hours.

      This endpoint has no user session of its own: call it with an API key holding the
      `github:read` scope, or from a whitelisted first-party origin. A request with neither is
      rejected with `401`.
    responses:
      "200":
        description: GitHub stats fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/GitHubStatsResponse"
            examples:
              synced:
                summary: Stats available
                value:
                  success: true
                  message: "GitHub stats fetched successfully"
                  data:
                    projectName: "owner/repo"
                    projectUrl: "https://github.com/orgs/owner/projects/1"
                    stats:
                      totalItems: 120
                      total: 120
                      issues: 70
                      pullRequests: 50
                      todo: 40
                      inProgress: 30
                      done: 50
                      completionRate: "41.67"
                    syncedAt: "2026-04-26T10:00:00.000Z"
                    nextSyncAt: "2026-04-26T12:00:00.000Z"
              neverSynced:
                summary: No sync has run yet
                value:
                  success: true
                  message: "GitHub stats fetched successfully"
                  data: null
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

getGitHubIssues:
  get:
    tags:
      - GitHub
    operationId: getGitHubIssues
    summary: Get GitHub Issues
    security:
      - ApiKeyAuth: []
    description: |
      Fetch paginated GitHub issues and pull requests with optional filters, from the last synced
      snapshot rather than live from GitHub. Ordered by most recently updated. Returns an empty
      page when no sync has run yet.

      Requires the `github:read` scope when called with an API key.
    parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [todo, in-progress, done]
        description: |
          Derived at sync time — closed items and items labelled `done` map to `done`; items
          labelled `in-progress`, `in progress`, or `active` map to `in-progress`; everything else
          is `todo`.
      - in: query
        name: kind
        schema:
          type: string
          enum: [issue, pull-request, all]
        description: "`all` is equivalent to omitting the filter."
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Items per page. Values above 50 are rejected with `400`.
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: |
          1-based page index, the first page when left out. An alternative to `offset`: sending both answers `400` "Send either page or offset, not both".
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 50
        description: Alternative spelling of `limit`. Takes precedence over `limit` when both are sent.
      - in: query
        name: createdFrom
        schema:
          type: string
        description: |
          Items created at or after this time. A date (`2026-08-01`) means the start of that UTC
          day; a date-time is used as given.
      - in: query
        name: createdTo
        schema:
          type: string
        description: |
          Items created at or before this time, inclusive. A bare date covers that whole UTC day, so
          `createdTo=2026-08-10` includes everything up to `2026-08-11T00:00:00Z`.
      - in: query
        name: updatedFrom
        schema:
          type: string
        description: Items updated at or after this time. Same date rules as `createdFrom`.
      - in: query
        name: updatedTo
        schema:
          type: string
        description: Items updated at or before this time, inclusive. Same date rules as `createdTo`.
    responses:
      "200":
        description: GitHub issues fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/GitHubIssuesResponse"
            example:
              success: true
              message: "GitHub issues fetched successfully"
              data:
                items:
                  - id: "gh-123456"
                    number: 42
                    title: "Add new feature"
                    status: "in-progress"
                    kind: "issue"
                    url: "https://github.com/owner/repo/issues/42"
                    labels: ["enhancement"]
                    createdAt: "2026-04-20T10:00:00.000Z"
                    updatedAt: "2026-04-25T10:00:00.000Z"
                total: 1
                limit: 20
                offset: 0
                page: 1
                pageSize: 20
                totalPages: 1
                syncedAt: "2026-04-25T12:00:00.000Z"
                hasMore: false
                pagination:
                  mode: "offset"
                  nextOffset: null
                  nextCursor: null
      "400":
        description: |
          Validation error: a parameter is out of range or not a date, `page` and `offset` were
          both sent, or the query has a parameter this endpoint does not know (unknown parameters
          are refused, not ignored).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "Validation failed"
              details:
                - path: "offset"
                  message: "Send either page or offset, not both"
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError
