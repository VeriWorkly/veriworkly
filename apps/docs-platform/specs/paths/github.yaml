getGitHubStats:
  get:
    tags:
      - GitHub
    operationId: getGitHubStats
    summary: Get GitHub Stats
    security:
      - ApiKeyAuth: []
    description: |
      Fetch aggregated issue and pull-request statistics for the configured repository, as of the
      last sync. Served from the last synced snapshot, not live from GitHub — `syncedAt` tells you
      how fresh it is. Cached for 12 hours.

      This endpoint has no user session of its own: call it with an API key holding the
      `github:read` scope, or from a whitelisted first-party origin. A request with neither is
      rejected with `401`.
    responses:
      "200":
        description: GitHub stats fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/GitHubStatsResponse"
            examples:
              synced:
                summary: Stats available
                value:
                  success: true
                  message: "GitHub stats fetched successfully"
                  data:
                    projectName: "owner/repo"
                    stats:
                      total: 120
                      issues: 70
                      pullRequests: 50
                      todo: 40
                      inProgress: 30
                      done: 50
                      completionRate: "41.67"
                    syncedAt: "2026-04-26T10:00:00.000Z"
              neverSynced:
                summary: No sync has run yet
                value:
                  success: true
                  message: "GitHub stats fetched successfully"
                  data: null
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

getGitHubIssues:
  get:
    tags:
      - GitHub
    operationId: getGitHubIssues
    summary: Get GitHub Issues
    security:
      - ApiKeyAuth: []
    description: |
      Fetch paginated GitHub issues and pull requests with optional filters, from the last synced
      snapshot rather than live from GitHub. Ordered by most recently updated. Returns an empty
      page when no sync has run yet.

      Requires the `github:read` scope when called with an API key.
    parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [todo, in-progress, done]
        description: |
          Derived at sync time — closed items and items labelled `done` map to `done`; items
          labelled `in-progress`, `in progress`, or `active` map to `in-progress`; everything else
          is `todo`.
      - in: query
        name: kind
        schema:
          type: string
          enum: [issue, pull-request, all]
        description: "`all` is equivalent to omitting the filter."
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Items per page. Values above 50 are rejected with `400`.
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page index. An alternative to `offset`.
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 50
        description: Alternative spelling of `limit`. Takes precedence over `limit` when both are sent.
    responses:
      "200":
        description: GitHub issues fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/GitHubIssuesResponse"
            example:
              success: true
              message: "GitHub issues fetched successfully"
              data:
                items:
                  - id: "gh-123456"
                    number: 42
                    title: "Add new feature"
                    status: "in-progress"
                    kind: "issue"
                    url: "https://github.com/owner/repo/issues/42"
                    labels: ["enhancement"]
                    createdAt: "2026-04-20T10:00:00.000Z"
                    updatedAt: "2026-04-25T10:00:00.000Z"
                total: 1
                limit: 20
                offset: 0
                page: 1
                pageSize: 20
                totalPages: 1
                hasMore: false
                pagination:
                  mode: "offset"
                  nextOffset: null
                  nextCursor: null
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

syncGitHubStats:
  post:
    tags:
      - GitHub
    operationId: syncGitHubStats
    security:
      - LocalSession: []
      - ProdSession: []
    summary: (Admin) Sync GitHub
    description: |
      Manually triggers a GitHub sync. **Administrators only** — the caller's session email must
      match the configured `ADMIN_EMAIL`; an API key cannot reach this route.

      Incremental by default: only issues updated since the last sync are refetched. The run is
      guarded by a 10-minute Redis lock, so a concurrent attempt fails with `409` rather than
      double-syncing.

      A sync can take minutes, so it runs in the background: the response is `202` as soon as
      the lock is taken. `GET /github/stats` shows the new `syncedAt` once it has finished; a
      failed run leaves the previous data in place.
    responses:
      "202":
        description: The sync started and is running in the background.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/GenericSuccessResponse"
            example:
              success: true
              message: "GitHub sync started"
              data:
                status: "started"
                statusUrl: "/api/v1/admin/system/github"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: The authenticated user is not the configured administrator.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "Forbidden"
      "409":
        description: A sync is already running.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "GitHub sync is already in progress"
      "500":
        description: The server has no `ADMIN_EMAIL` set, so no one can be the administrator.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 500
              message: "ADMIN_EMAIL is not configured"
      "503":
        description: |
          The sync cannot start: Redis, which holds its lock, is unreachable, or
          `GITHUB_OWNER`/`GITHUB_REPO` are not configured.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 503
              message: "Syncing is unavailable right now. Try again shortly."
