getAtsQuota:
  get:
    tags:
      - ATS
    operationId: getAtsQuota
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Get ATS Scan Quota
    description: |
      Returns the caller's current ATS scan quota status. This endpoint works for anonymous
      callers too (quota is keyed by a hashed IP when unauthenticated).

      There is a single shared scan-quota bucket for both the deterministic `/ats/check` scan and
      the AI-powered `/ats/analyze` deep analysis — they are **not** two separate quotas. Limits:

      - Anonymous: 1 scan / 48 hours
      - Free or paused (signed in): 2 scans / 24 hours
      - Subscriber: 300 scans a month. Any account that holds spendable AI credits, whatever their
        source, or holds a paid subscription or pass even with no credits left.

      `canConvertResume` and `canRepair` say whether the caller's credit balance covers those AI
      actions. `pricing` is null when the server could not load its ATS AI settings, and both are
      then false.
    responses:
      "200":
        description: Quota fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsQuotaResponse"
            example:
              success: true
              message: "Success"
              data:
                tier: "free"
                limit: 2
                used: 0
                remaining: 2
                resetsAt: "2026-04-28T00:00:00.000Z"
                canConvertResume: false
                canRepair: false
                pricing:
                  analysisCredits: { min: 1, max: 6 }
                  jobUrlAnalysisCredits: { min: 2, max: 12 }
                  resumeConversionCredits: 2
                  parseRepairCredits: 2
                extract: { limit: 6, used: 0, remaining: 6 }
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailableError

extractAtsResumeText:
  post:
    tags:
      - ATS
    operationId: extractAtsResumeText
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Extract Resume Text
    description: |
      Extracts plain text from an uploaded resume file (PDF, DOCX, HTML, TXT, Markdown, or JSON, max 5MB)
      for use as the `resume` field on `/ats/check` or `/ats/analyze`. Does not consume ATS scan
      quota. Uploads are metered by a separate extract budget instead (`quota.extract`), and a
      request over it is rejected with `429`. The multipart body must carry only the `resume`
      file; any other field is rejected with `400`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [resume]
            properties:
              resume:
                type: string
                format: binary
    responses:
      "200":
        description: Text extracted successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsExtractResponse"
      "400":
        description: |
          Missing file, unsupported or unreadable file, a file with too little text (a scanned PDF
          has its own message), or a multipart field or file other than `resume` (multer's reason
          follows "Upload refused:").
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              unreadable:
                summary: The parser could not read the file
                value:
                  success: false
                  statusCode: 400
                  message: "Resume file could not be read."
              tooLittleText:
                summary: Under 50 characters of text
                value:
                  success: false
                  statusCode: 400
                  message: "Resume file did not contain enough readable text."
              scannedPdf:
                summary: A PDF with no text layer
                value:
                  success: false
                  statusCode: 400
                  message: "This PDF appears to be a scanned image or flattened graphic without an embedded text layer. Real ATS parsers cannot read scanned resumes without OCR. Please export your resume as a text-based PDF or Word document."
              extraField:
                summary: A multipart field other than the file
                value:
                  success: false
                  statusCode: 400
                  message: "Upload refused: Too many fields."
              missingFile:
                summary: No file provided
                value:
                  success: false
                  statusCode: 400
                  message: "Provide a resume file."
              unsupportedType:
                summary: Unsupported file type
                value:
                  success: false
                  statusCode: 400
                  message: "Upload a PDF, DOCX, HTML, TXT, Markdown, or JSON resume."
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "408":
        description: Extraction took too long
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 408
              message: "Resume extraction took too long to process."
      "413":
        description: The file is larger than 5MB
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 413
              message: "The file is larger than the 5 MB upload limit."
      "422":
        description: The parser ran out of memory on this file. Simplify or re-export it.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 422
              message: "This file is too complex to read."
      "429":
        description: ATS upload quota exceeded. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsQuotaErrorResponse"
            examples:
              documented:
                summary: ATS upload quota exceeded
                value:
                  success: false
                  statusCode: 429
                  message: "ATS upload quota exceeded."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
              apiKeyLimit:
                summary: Per-key limit
                value:
                  success: false
                  statusCode: 429
                  message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "503":
        description: |
          Extraction is busy, unavailable, or stopping for a restart; the upload is returned to the
          extract budget. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store
          cannot be read, and as "Service temporarily unavailable" when the database cannot be
          reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: Extraction is busy
                value:
                  success: false
                  statusCode: 503
                  message: "Too many resume extractions in progress. Please retry shortly."
              extractionUnavailable:
                summary: The extraction process failed to start or restart
                value:
                  success: false
                  statusCode: 503
                  message: "Resume extraction is temporarily unavailable."
              shuttingDown:
                summary: The server is shutting down
                value:
                  success: false
                  statusCode: 503
                  message: "Server is shutting down."
              authUnavailableCode:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
                  details:
                    code: AUTH_UNAVAILABLE
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable

checkAtsResume:
  post:
    tags:
      - ATS
    operationId: checkAtsResume
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Run Deterministic ATS Scan
    description: |
      Runs the free, rule-based ATS readiness scan — no AI call is made. Works for anonymous
      callers. Consumes one unit from the shared ATS scan quota (see `GET /ats/quota`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AtsCheckRequest"
          example:
            resume: "Jane Doe\nSoftware Engineer\n..."
            jobDescription: "We are looking for a Software Engineer with React experience..."
    responses:
      "200":
        description: Scan completed successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsCheckResponse"
      "400":
        description: |-
          The body failed validation, or the resume is an `AtsResumeDocument` that is not valid.
          Neither costs a scan. A body that is not valid JSON answers "Invalid JSON body".
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              validation:
                summary: Validation error
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "resume"
                      message: "Required"
              invalidDocument:
                summary: Invalid structured resume
                value:
                  success: false
                  statusCode: 400
                  message: "Invalid resume document at basics.name: Required"
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        description: ATS scan quota exceeded. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsQuotaErrorResponse"
            examples:
              documented:
                summary: ATS scan quota exceeded
                value:
                  success: false
                  statusCode: 429
                  message: "ATS scan quota exceeded."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
              apiKeyLimit:
                summary: Per-key limit
                value:
                  success: false
                  statusCode: 429
                  message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailableError

analyzeAtsResume:
  post:
    tags:
      - ATS
    operationId: analyzeAtsResume
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Run AI-Powered ATS Analysis
    description: |
      Runs the deterministic scan plus an AI deep-analysis pass on top of it (explanation, missing
      evidence, keyword opportunities, prioritized fixes). Requires authentication. Consumes one
      unit from the same shared ATS scan quota as `/ats/check` — this is not a second, separate
      quota. Requires the `ai:write` API key scope when called with an API key.

      Optionally fetches a job description from a URL instead of requiring pasted text
      (`fetchJobUrl: true` + `jobUrl`). The fetch is SSRF-hardened: HTTPS-only on the standard port,
      rejects localhost/private/link-local addresses, resolves DNS once and pins that IP for the
      whole request (including redirects), and caps redirects to 3 and the response size to 2MB.
      The page may go 8 seconds without sending data and must finish within 15 seconds; each DNS
      lookup has its own 5-second limit.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AtsAnalyzeRequest"
          example:
            resume: "Jane Doe\nSoftware Engineer\n..."
            jobDescription: "We are looking for a Software Engineer with React experience..."
            fetchJobUrl: false
            requestId: "ats-analyze-8f3ac1e2b9"
    responses:
      "200":
        description: Analysis completed successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsAnalyzeResponse"
      "400":
        description: |-
          The body failed validation, `fetchJobUrl` was true without a `jobUrl`, the resume
          document is not valid, or the job page could not be fetched or read. A body that is not valid JSON answers "Invalid JSON body".
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              validation:
                summary: Validation error
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "requestId"
                      message: "Required"
              missingJobUrl:
                summary: fetchJobUrl without jobUrl
                value:
                  success: false
                  statusCode: 400
                  message: "Provide a job URL to analyze online."
              blockedUrl:
                summary: Job URL resolves to a blocked network
                value:
                  success: false
                  statusCode: 400
                  message: "Job URL resolves to a blocked network."
              jobPage:
                summary: Job page unusable
                description: |
                  Other job-page messages: "Job URL must use HTTPS on the standard port.", "Job URL
                  host is not allowed.", "Job URL could not be resolved.", "Job URL could not be
                  resolved in time.", "Job page request timed
                  out.", "Job page redirect limit exceeded.", "Job page exceeds the download limit.",
                  "Job page must be HTML or plain text.", "Job page could not be retrieved.".
                value:
                  success: false
                  statusCode: 400
                  message: "Job page did not contain enough readable text."
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "402":
        description: The credit balance cannot cover the cheapest analysis this request could cost (plus repair, when it would run).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 402
              message: "Not enough AI credits. Credits come with a credit pack, a pass, AI Credits or the Job Hunter Bundle."
      "403":
        description: API key is missing the ai:write scope
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "This API key does not have permission for this action."
      "409":
        description: The `requestId` was already used, or is still processing.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              reused:
                summary: Used for another operation
                value:
                  success: false
                  statusCode: 409
                  message: "AI request id was already used for another operation."
              processing:
                summary: Still processing
                value:
                  success: false
                  statusCode: 409
                  message: "This AI request is processing."
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        description: |-
          The ATS scan quota is used up (`details` is the quota), the caller already has two AI
          requests in progress (`Retry-After` says when to try again), or a rate limit was hit: the
          per-IP AI limit (20 requests per minute) or, with an API key, the per-key limit.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              quota:
                summary: Scan quota used up
                value:
                  success: false
                  statusCode: 429
                  message: "ATS scan quota exceeded."
              inFlight:
                summary: Too many AI requests at once
                value:
                  success: false
                  statusCode: 429
                  message: "Too many AI requests in progress. Wait for one to finish and try again."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
              apiKeyLimit:
                summary: Per-key limit
                value:
                  success: false
                  statusCode: 429
                  message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "502":
        description: The AI gateway failed
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 502
              message: "AI ATS analysis could not be completed."
      "503":
        description: |-
          The server's ATS AI settings are invalid or missing, the AI gateway credentials are not
          configured, or the server is restarting (`details.code` `SERVER_RESTARTING`, with
          `Retry-After`). Nothing is charged. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              policy:
                summary: Invalid ATS AI settings
                value:
                  success: false
                  statusCode: 503
                  message: "AI ATS policy is invalid."
              restarting:
                summary: Server restarting
                value:
                  success: false
                  statusCode: 503
                  message: "The server is restarting. Try again in a few seconds."
                  details:
                    code: "SERVER_RESTARTING"
                    retryAfterSeconds: 5
              authUnavailableCode:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
                  details:
                    code: AUTH_UNAVAILABLE
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable
      "504":
        description: The AI request ran past its deadline.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 504
              message: "The AI request timed out before the provider answered."

convertAtsResume:
  post:
    tags:
      - ATS
    operationId: convertAtsResume
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Convert Resume Text To Structured JSON
    description: |
      Uses AI to convert raw resume text into structured JSON Resume-shaped fields. Spends AI
      credits from any source (a plan, a pass or a credit pack), independently of the shared ATS
      scan quota above. The result becomes a resume, so a free account that already keeps one
      resume is refused with `402` before anything is charged. A retry with the same `requestId`
      and text returns the stored result without charging again. Requires the `ai:write` API key
      scope when called with an API key.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AtsConvertResumeRequest"
          example:
            resume: "Jane Doe\nSoftware Engineer\n..."
            requestId: "ats-convert-8f3ac1e2b9"
    responses:
      "200":
        description: Resume converted successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AtsConvertResumeResponse"
      "400":
        $ref: ../components/responses.yaml#/BodyValidationError
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "402":
        description: Not enough AI credits, or a free account already keeps its one resume.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              notEnoughCredits:
                summary: Not enough AI credits
                value:
                  success: false
                  statusCode: 402
                  message: "Not enough AI credits. Credits come with a credit pack, a pass, AI Credits or the Job Hunter Bundle."
              documentLimit:
                summary: Free document limit
                value:
                  success: false
                  statusCode: 402
                  message: "Free accounts can keep 1 active resume at a time. Unlimited documents come with any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass; credit packs add AI credits only."
                  details:
                    code: "DOCUMENT_LIMIT"
                    type: "RESUME"
      "403":
        description: API key is missing the ai:write scope
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "This API key does not have permission for this action."
      "409":
        description: |
          The `requestId` was already used (for another operation or input, or it already
          completed or failed), it is still processing, or the credit balance changed while the
          credits were being held (retry the action).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              noLongerReusable:
                summary: The id cannot be reused
                value:
                  success: false
                  statusCode: 409
                  message: "This AI request id can no longer be reused."
              otherOperation:
                summary: Id used for another operation or input
                value:
                  success: false
                  statusCode: 409
                  message: "AI request id was already used for another operation."
              processing:
                summary: The same request is still running
                value:
                  success: false
                  statusCode: 409
                  message: "This AI request is processing."
              completed:
                summary: The request already completed
                value:
                  success: false
                  statusCode: 409
                  message: "This AI request already completed."
              balanceChanged:
                summary: The balance moved while credits were held
                value:
                  success: false
                  statusCode: 409
                  message: "Credit balance changed. Retry the action."
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        description: |
          The caller already has two AI requests in progress (`Retry-After` says when to try
          again), or a rate limit was hit: the per-IP AI limit (20 requests per minute) or, with an
          API key, the per-key limit.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The caller already has two AI requests in progress
                value:
                  success: false
                  statusCode: 429
                  message: "Too many AI requests in progress. Wait for one to finish and try again."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
              apiKeyLimit:
                summary: Per-key limit
                value:
                  success: false
                  statusCode: 429
                  message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "502":
        description: AI provider error
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 502
              message: "AI resume conversion could not be completed."
      "503":
        description: |-
          The server's ATS AI settings are invalid or missing, the AI gateway credentials are not
          configured, or the server is restarting (`details.code` `SERVER_RESTARTING`, with
          `Retry-After`). Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The server's ATS AI settings are invalid or missing, the AI gateway credentials are not configured, or the server is restarting (`details.code` `SERVER_RESTARTING`, with `Retry-After`)
                value:
                  success: false
                  statusCode: 503
                  message: "AI ATS policy is invalid."
              authUnavailableCode:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
                  details:
                    code: AUTH_UNAVAILABLE
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable
      "504":
        description: The AI request ran past its deadline.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 504
              message: "The AI request timed out before the provider answered."
