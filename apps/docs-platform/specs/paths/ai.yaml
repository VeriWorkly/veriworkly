getAiActions:
  get:
    tags:
      - AI
    operationId: getAiActions
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: List AI Actions
    description: |
      Lists every available AI generation action along with its Standard and Expert mode credit
      costs. Use this to build pricing UI before calling `/ai/generate`.

      Costs only — no user data is returned, and no credits are spent. This endpoint carries no
      scope requirement, but it is not open to the public: the request must carry an API key or
      originate from a whitelisted first-party origin, or it is rejected with `401`.

      The response always contains an entry for all seven action keys. **Treat this endpoint as the
      only source of truth for pricing** — the actual credit values come from server-side
      configuration and can change without a documentation update, so read them at runtime rather
      than hardcoding the illustrative numbers shown here.
    responses:
      "200":
        description: Actions fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AiActionsResponse"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        description: The AI policy is missing or invalid, or AI model routing is not configured on the server. Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The AI policy is missing or invalid, or AI model routing is not configured on the server
                value:
                  success: false
                  statusCode: 503
                  message: "AI generation is unavailable right now. Please try again later."
              authUnavailableCode:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
                  details:
                    code: AUTH_UNAVAILABLE
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable

generateAiContent:
  post:
    tags:
      - AI
    operationId: generateAiContent
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Generate AI Content
    description: |
      Runs an AI generation action (rewriting a section, generating a cover letter, tailoring a
      resume to a job description, etc). Requires the `ai:write` scope when called with an API key.

      Credits are handled with a two-phase reserve → commit/release flow: the cost for the chosen
      action + mode is reserved from the caller's AI credit wallet before the AI provider is called,
      then committed only after a successful response. If the AI call fails or errors out, the
      reservation is released instead of committed — a failed generation never burns credits.

      Expert mode uses a stronger, more expensive model than Standard mode for the same action.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AiGenerateRequest"
          example:
            action: "generate_cover_letter"
            mode: "standard"
            input:
              text: ""
              context: "5 years of experience building React applications."
              jobDescription: "We are looking for a Senior Frontend Engineer..."
              instructions: "Keep it under 300 words."
            requestId: "ai-gen-8f3ac1e2b9"
    responses:
      "200":
        description: Content generated successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AiGenerateResponse"
            example:
              success: true
              message: "Success"
              data:
                content: "Dear Hiring Manager, ..."
                usage:
                  promptTokens: 420
                  completionTokens: 280
                  totalTokens: 700
                credits:
                  spent: 4
                  balance: 46
      "400":
        description: Validation error, or text/context exceeds the action's character limit. A body that is not valid JSON answers "Invalid JSON body".
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: Validation error, or text/context exceeds the action's character limit
                value:
                  success: false
                  statusCode: 400
                  message: "Provide text, context, or a job description for this AI action."
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "402":
        description: Not enough AI credits
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 402
              message: "Not enough AI credits. Credits come with a credit pack, a pass, AI Credits or the Job Hunter Bundle."
      "403":
        description: API key is missing the ai:write scope
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "This API key does not have permission for this action."
      "409":
        description: requestId was already used, or is still processing
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "This AI request id can no longer be reused."
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        description: The caller already has two AI requests in progress. `Retry-After` says when to try again. The per-IP limit also answers `429` ("Too many requests. Please try again later."). With an API key, the per-key limit (20 requests per 15 minutes by default) also answers `429`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The caller already has two AI requests in progress
                value:
                  success: false
                  statusCode: 429
                  message: "Too many AI requests in progress. Wait for one to finish and try again."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
              apiKeyLimit:
                summary: Per-key limit
                value:
                  success: false
                  statusCode: 429
                  message: Rate limit exceeded. You are allowed 20 requests per 15 minutes. Please try again in 840 seconds.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "502":
        description: AI provider error
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 502
              message: "The AI provider could not complete the request."
      "503":
        description: |-
          The server's AI settings are missing or invalid, the AI gateway credentials are not
          configured, or the server is restarting (`details.code` `SERVER_RESTARTING`, with
          `Retry-After`). Also sent, with `details.code` `AUTH_UNAVAILABLE`, when the session store cannot be read. Also sent as "Service temporarily unavailable" when the database cannot be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The server's AI settings are missing or invalid, the AI gateway credentials are not configured, or the server is restarting (`details.code` `SERVER_RESTARTING`, with `Retry-After`)
                value:
                  success: false
                  statusCode: 503
                  message: "AI provider credentials are not configured."
              authUnavailableCode:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
                  details:
                    code: AUTH_UNAVAILABLE
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable
      "504":
        description: The AI request ran past its deadline.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 504
              message: "The AI request timed out before the provider answered."
