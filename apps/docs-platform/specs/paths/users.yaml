getCurrentUser:
  get:
    tags:
      - Users
    operationId: getCurrentUser
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Get Current User
    description: |
      Retrieves account metadata for the currently authenticated user. Requires the `user:read`
      scope when called with an API key.

      This returns identity metadata only — resume, cover letter, and portfolio content is never
      exposed here. Results are cached for 30 minutes and refreshed on write.
    responses:
      "200":
        description: User information fetched successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/UserResponse"
            example:
              success: true
              message: "User information fetched successfully"
              data:
                id: "cmnu7awv4000063lk18zpon2m"
                name: "VeriWorkly User"
                username: "veriworkly-user"
                email: "info@veriworkly.com"
                emailVerified: true
                autoSyncEnabled: false
                createdAt: "2026-04-11T10:37:35.584Z"
                updatedAt: "2026-04-25T19:35:44.409Z"
                _count:
                  apiKeys: 2
                  shareLinks: 4
                  resumes: 4
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "User not found"

  delete:
    tags:
      - Users
    operationId: deleteCurrentUser
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Delete Current User
    description: |
      Permanently deletes the authenticated user's account with its documents, portfolio, share
      links, API keys and profile, then clears the session cookies. This cannot be undone.

      Billing and payout records are kept, unlinked from the deleted account, for as long as the law
      requires: subscriptions, purchases, entitlement grants, the credit wallet and its
      transactions, affiliate commissions and withdrawals.

      Session only: a request authenticated with an API key is rejected with `403`, whatever its
      scopes. The request is refused with `409` while something could still charge the card or
      while the user holds an unpaid affiliate balance:

      - a subscription that is active or past due and not set to cancel: cancel it from Billing
        first;
      - `details.code: "CHECKOUT_IN_PROGRESS"`: a checkout session is open; finish or cancel it
        first;
      - `details.code: "AFFILIATE_BALANCE_FORFEIT"`: deleting forfeits the unpaid commissions in
        `details.amountCents` (`availableCents` plus `pendingCents`, in `currency`). Show the
        amount, then repeat the request with `confirmAffiliateForfeit: true` and
        `confirmedAffiliateForfeitCents` set to the amount shown. If the balance has grown past
        that amount, the request is refused again with the new one.
    parameters:
      - name: confirmAffiliateForfeit
        in: query
        required: false
        description: Same as `confirmAffiliateForfeit` in the body, for clients that cannot send a body with `DELETE`.
        schema:
          type: string
          enum: ["true"]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/DeleteAccountRequest"
          example:
            confirmAffiliateForfeit: true
            confirmedAffiliateForfeitCents: 4000
    responses:
      "200":
        description: Account deleted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/NullDataResponse"
            example:
              success: true
              message: "Your account and all associated documents, portfolios, and data have been permanently deleted."
              data: null
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "403":
        description: The request was authenticated with an API key.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 403
              message: "This action cannot be performed with an API key. Sign in and delete your account from your Studio profile page."
      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "User not found"
      "409":
        description: |
          A live subscription must be cancelled first, a checkout is open
          (`details.code: "CHECKOUT_IN_PROGRESS"`), or deleting would forfeit an unpaid affiliate
          balance that was not confirmed (`details.code: "AFFILIATE_BALANCE_FORFEIT"`, with
          `amountCents`, `currency`, `availableCents` and `pendingCents`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../components/schemas.yaml#/ErrorResponse"
                - $ref: "../components/schemas.yaml#/CodedErrorResponse"
            examples:
              subscription:
                summary: A live subscription
                value:
                  success: false
                  statusCode: 409
                  message: "Cancel your subscription before deleting your account. Open Billing and use Manage Subscription — we cannot cancel it for you, and deleting now would leave you being charged for an account that no longer exists."
              affiliateForfeit:
                summary: An unpaid affiliate balance
                value:
                  success: false
                  statusCode: 409
                  message: "You have 40.00 USD in unpaid affiliate commissions. Deleting your account forfeits it. Confirm to delete anyway."
                  details:
                    code: "AFFILIATE_BALANCE_FORFEIT"
                    amountCents: 4000
                    currency: "USD"
                    availableCents: 2500
                    pendingCents: 1500
      "503":
        description: Account deletion is temporarily unavailable (the checkout state could not be read). Try again shortly.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"

updateUserName:
  put:
    tags:
      - Users
    operationId: updateUserName
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Update User Name
    description: |
      Updates the display name of the authenticated user. Requires the `user:write` scope when
      called with an API key.

      The email address is read-only through this API. Leading and trailing whitespace is trimmed
      before validation.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
                description: Name cannot be null or empty when updating.
          example:
            name: "VeriWorkly"
    responses:
      "200":
        description: User name updated successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/UserResponse"
            example:
              success: true
              message: "User name updated successfully"
              data:
                id: "cmnu7awv4000063lk18zpon2m"
                name: "VeriWorkly User New Name"
                username: "veriworkly-user"
                email: "info@veriworkly.com"
                emailVerified: true
                autoSyncEnabled: false
                createdAt: "2026-04-11T10:37:35.584Z"
                updatedAt: "2026-04-26T02:00:00.000Z"
                _count:
                  apiKeys: 2
                  shareLinks: 4
                  resumes: 4
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              emptyName:
                summary: Name is empty
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "name"
                      message: "Name cannot be empty"

              nameTooLong:
                summary: Name too long
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "name"
                      message: "Name is too long"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"

setUsername:
  put:
    tags:
      - Users
    operationId: setUsername
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Set Username
    description: |
      Claims the authenticated user's username. Requires the `user:write` scope when called with an
      API key.

      The username is the public identifier in share-link URLs (`/share/{username}/{slug}`) and, for
      accounts holding `custom_subdomain`, the published-portfolio subdomain — so a user cannot
      create a share link until one is set.

      **A username can only be set once.** Once the account has one, this endpoint rejects any
      different value with `409 Username is locked and cannot be changed`. Re-sending the value the
      account already holds is a no-op and returns `200`, so the call is safe to retry.

      The submitted value is **normalised before validation**: lowercased, non-`[a-z0-9_-]`
      characters folded to hyphens, leading/trailing hyphens stripped, and truncated to 32
      characters. `Jane.Doe` and `jane-doe` therefore claim the same username. It must survive
      normalisation as 3–32 characters and must not be a reserved word (`admin`, `api`, `app`,
      `docs`, and similar platform-owned names). Check with
      `GET /users/{username}/availability` before committing.

      A successful claim invalidates the caller's cached session so the new username is visible
      immediately rather than at the end of the session-cache TTL.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username]
            properties:
              username:
                type: string
                description: Normalised server-side before the validity check runs.
          example:
            username: "veriworkly-user"
    responses:
      "200":
        description: Username updated successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/UserResponse"
            example:
              success: true
              message: "Username updated successfully"
              data:
                id: "cmnu7awv4000063lk18zpon2m"
                name: "VeriWorkly User"
                username: "veriworkly-user"
                email: "info@veriworkly.com"
                emailVerified: true
                autoSyncEnabled: false
                createdAt: "2026-04-11T10:37:35.584Z"
                updatedAt: "2026-04-26T02:00:00.000Z"
                _count:
                  apiKeys: 2
                  shareLinks: 4
                  resumes: 4
      "400":
        description: The username failed validation after normalisation.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "Validation failed"
              details:
                - path: "username"
                  message: "invalid_username"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
      "409":
        description: The username is taken, or this account already has one.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              taken:
                summary: Claimed by another account
                value:
                  success: false
                  statusCode: 409
                  message: "Username is already taken"
              locked:
                summary: This account already has a username
                value:
                  success: false
                  statusCode: 409
                  message: "Username is locked and cannot be changed"

checkUsernameAvailability:
  get:
    tags:
      - Users
    operationId: checkUsernameAvailability
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Check Username Availability
    description: |
      Reports whether a username can be claimed. Intended to drive live feedback in a username
      picker before `PUT /users/me/username` is called.

      This route carries **no API-key scope gate**, unlike the rest of the Users module — but it is
      still not anonymous, so it needs an API key or a whitelisted first-party origin.

      The path segment is normalised the same way the update endpoint normalises it, and
      `normalizedUsername` echoes back the value that would actually be stored. A `200` with
      `available: false` is the normal negative answer — an unavailable name is not an error.
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: The candidate username. Normalised server-side before the lookup.
    responses:
      "200":
        description: Username availability fetched successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/UsernameAvailabilityResponse"
            examples:
              available:
                summary: Free to claim
                value:
                  success: true
                  message: "Username availability fetched successfully"
                  data:
                    available: true
                    normalizedUsername: "veriworkly-user"
              taken:
                summary: Already claimed
                value:
                  success: true
                  message: "Username availability fetched successfully"
                  data:
                    available: false
                    normalizedUsername: "veriworkly-user"
                    reason: "taken"
              invalid:
                summary: Fails the username rules
                value:
                  success: true
                  message: "Username availability fetched successfully"
                  data:
                    available: false
                    normalizedUsername: "a"
                    reason: "too_short"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"

updateAutoSync:
  put:
    tags:
      - Users
    operationId: updateAutoSync
    security:
      - ApiKeyAuth: []
      - LocalSession: []
      - ProdSession: []
    summary: Update Auto-Sync Preference
    description: |
      Turns the account-level background document sync on or off. Requires the `user:write` scope
      when called with an API key.

      This is the account-wide switch. It does not override a document's own `keepLocalOnly` flag —
      a document opted out individually stays local even with auto-sync on. Turning auto-sync off
      does not delete anything already synced; it only stops new local edits from being pushed.

      Defaults to `true` on a new account. A successful change invalidates the caller's cached
      session.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [enabled]
            properties:
              enabled:
                type: boolean
          example:
            enabled: true
    responses:
      "200":
        description: Auto sync preference updated successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/UserResponse"
            example:
              success: true
              message: "Auto sync preference updated successfully"
              data:
                id: "cmnu7awv4000063lk18zpon2m"
                name: "VeriWorkly User"
                username: "veriworkly-user"
                email: "info@veriworkly.com"
                emailVerified: true
                autoSyncEnabled: true
                createdAt: "2026-04-11T10:37:35.584Z"
                updatedAt: "2026-04-26T02:00:00.000Z"
                _count:
                  apiKeys: 2
                  shareLinks: 4
                  resumes: 4
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "Validation failed"
              details:
                - path: "enabled"
                  message: "Expected boolean, received string"
      "401":
        $ref: "../components/responses.yaml#/UnauthorizedError"
