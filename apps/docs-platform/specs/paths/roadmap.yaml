getRoadmap:
  get:
    tags:
      - Roadmap
    operationId: getRoadmap
    summary: Get Roadmap Features
    security:
      - ApiKeyAuth: []
    description: |
      Fetch roadmap features with optional filtering, sorting, and pagination.

      This endpoint has no user session of its own: call it with an API key holding the
      `roadmap:read` scope, or from a whitelisted first-party origin. A request with neither is
      rejected with `401`.
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [todo, in-progress, done]
        required: false
        description: Filter features by status

      - name: sort
        in: query
        schema:
          type: string
          enum: [newest, oldest, recently-completed]
          default: newest
        required: false
        description: |
          Sort order. `recently-completed` orders by completion date (nulls last), then by last
          update.

      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        required: false
        description: Items per page. Values above 50 are rejected with `400`.

      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Number of items to skip. An alternative to `page`; sending both is rejected with `400`.

      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
        required: false
        description: |
          1-based page index, the first page when left out. An alternative to `offset`: sending both answers `400` "Send either page or offset, not both".

      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
        required: false
        description: Alternative spelling of `limit`. Takes precedence over `limit` when both are sent.

      - name: excludeId
        in: query
        schema:
          type: string
          minLength: 1
        required: false
        description: Omit one feature from the results — useful for "related features" lists.

    responses:
      "200":
        description: Roadmap features fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/RoadmapListResponse"
            example:
              success: true
              message: "Roadmap features fetched successfully"
              data:
                items:
                  - id: "feature_1"
                    title: "AI Resume Builder"
                    description: "Generate resumes using AI"
                    status: "in-progress"
                    eta: "Q3 2026"
                    tags: ["ai", "resume"]
                    createdAt: "2026-04-01T00:00:00.000Z"
                    startedAt: "2026-04-10T00:00:00.000Z"
                    completedAt: null
                    completedQuarter: null
                    updatedAt: "2026-04-20T00:00:00.000Z"
                    timeline: "Started development"
                total: 1
                limit: 20
                offset: 0
                page: 1
                pageSize: 20
                totalPages: 1
                hasMore: false
                pagination:
                  mode: "offset"
                  nextOffset: null
                  nextCursor: null

      "400":
        description: |
          Validation error: a parameter is out of range, `page` and `offset` were both sent, or the
          query has a parameter this endpoint does not know (unknown parameters are refused, not
          ignored).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 400
              message: "Validation failed"
              details:
                - path: "limit"
                  message: "Number must be greater than or equal to 1"

      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

getRoadmapStats:
  get:
    tags:
      - Roadmap
    operationId: getRoadmapStats
    summary: Get Roadmap Stats
    security:
      - ApiKeyAuth: []
    description: Retrieve aggregated roadmap statistics.
    responses:
      "200":
        description: Roadmap stats fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/RoadmapStatsResponse"
            example:
              success: true
              message: "Roadmap stats fetched successfully"
              data:
                totalFeatures: 10
                todo: 3
                inProgress: 4
                done: 3
                completionRate: "30.00"

      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

getRoadmapFeatureById:
  get:
    tags:
      - Roadmap
    operationId: getRoadmapFeatureById
    summary: Get Roadmap Feature by ID
    security:
      - ApiKeyAuth: []
    description: Fetch detailed roadmap feature by ID.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Feature ID

    responses:
      "200":
        description: Feature fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/RoadmapFeatureResponse"
            example:
              success: true
              message: "Feature fetched successfully"
              data:
                id: "feature_1"
                title: "AI Resume Builder"
                description: "Generate resumes using AI"
                status: "in-progress"
                eta: "Q3 2026"
                tags: ["ai"]
                createdAt: "2026-04-01T00:00:00.000Z"
                startedAt: "2026-04-10T00:00:00.000Z"
                completedAt: null
                completedQuarter: null
                updatedAt: "2026-04-20T00:00:00.000Z"
                fullDescription: "Full feature details"
                whyItMatters: "Improves productivity"
                timeline: "In progress"
                details: null

      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "403":
        $ref: "../components/responses.yaml#/InsufficientScopeError"

      "404":
        description: Feature not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Roadmap feature not found"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError
