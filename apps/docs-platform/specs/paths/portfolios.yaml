listPublicPortfolios:
  get:
    tags:
      - Portfolios
    operationId: listPublicPortfolios
    summary: List Public Portfolios
    description: |
      Lists the subdomains of every portfolio the public site serves: `LIVE` ones, and `GRACE`
      ones while their grace period is still running. A portfolio whose document was deleted is
      never listed. Most recently updated first. Returns subdomain and timestamp only, no portfolio content. Without
      `limit` a page holds up to 1,000 portfolios; page through the rest with `offset` (up to
      49,999, the sitemap protocol's 50,000 URLs). The default order, most recently updated first,
      moves whenever a site is republished or its billing changes; to page through every site,
      send `order=stable`, which lists by publication id and never moves.

      No user session is required, but the request must carry an API key or originate from a
      whitelisted first-party origin; otherwise it is rejected with `401`. Cached for 5 minutes.
    security:
      - ApiKeyAuth: []
      - {}
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 49999
      - name: order
        in: query
        required: false
        description: "`recent` (default): most recently updated first. `stable`: by publication id, for paging."
        schema:
          type: string
          enum: [recent, stable]
    responses:
      "200":
        description: Portfolios fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioPublicListResponse"
      "400":
        $ref: "../components/responses.yaml#/ValidationError"
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

getPublicPortfolio:
  get:
    tags:
      - Portfolios
    operationId: getPublicPortfolio
    summary: Get Public Portfolio By Subdomain
    description: |
      Returns the published snapshot for a portfolio subdomain, with two facts for the renderer:
      `isPaid` (the owner's paid portfolio access is in effect) and `isPremiumTemplate`. The
      billing state of the publication is not returned.

      The snapshot holds only what a visitor may see, not the owner's whole draft: hidden sections
      are dropped (on the home page and on every page), `pages` is empty unless `isPaid`, and
      `identity.email` is blank unless a visible Contact section shows it. The stored snapshot is
      not changed.

      Returns `404` for a suspended portfolio, one whose document was deleted, or one whose grace
      period after a lapsed subscription has run out. A lapsed portfolio is not taken down: a
      background job moves a premium template to the closest free one and the site stays online.
      This read never writes. Cached for up to 10 minutes, less while a grace period is running.

      No user session is required, but the request must carry an API key or originate from a
      whitelisted first-party origin; otherwise it is rejected with `401`.
    security:
      - ApiKeyAuth: []
      - {}
    parameters:
      - name: subdomain
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Portfolio fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioPublicResponse"
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "404":
        description: |
          No live portfolio exists at this subdomain. An empty or reserved subdomain is looked up
          like any other and answers this `404` too.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Portfolio not found"
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

recordPortfolioView:
  post:
    tags:
      - Portfolios
    operationId: recordPortfolioView
    summary: Record Portfolio View
    description: |
      Records an analytics view for a published portfolio. Responds `202 Accepted` with
      `data: null` — the count is not persisted synchronously.

      Views are buffered in Redis, deduplicated per viewer IP for 30 minutes, and flushed to
      Postgres by a scheduled job. A repeat view inside that window is accepted and silently
      dropped, so a `202` does not guarantee the count increased.

      No user session is required, but the request must carry an API key or originate from a
      whitelisted first-party origin; otherwise it is rejected with `401`.

      The body may also be sent as `text/plain` holding the same JSON, which is what
      `navigator.sendBeacon(url, JSON.stringify(body))` sends: a CORS-safelisted type, so a
      published portfolio's subdomain can send it without a preflight. A `text/plain` body is
      limited to 5 KB and is read before the credential check, so an oversized one gets `413`
      even without a key; a JSON body falls under the 100 kb default.

      The subdomain lookup is cached for 60 seconds, so for up to a minute after a takedown views
      are still accepted with `202`. A Redis failure while buffering answers `500`.
    security:
      - ApiKeyAuth: []
      - {}
    parameters:
      - name: subdomain
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              referrer:
                type: string
                description: |
                  Full referring URL. One longer than 2048 characters is cut to that length rather
                  than refused, so the view still counts. Only its hostname is stored,
                  lowercased and truncated to 255 characters; an unparseable URL is recorded as an
                  empty host.
        text/plain:
          schema:
            type: string
            maxLength: 5120
            description: The same object as the JSON body, serialized as JSON. A body over 5 KB is refused with `413`.
          example: '{"referrer":"https://news.ycombinator.com/"}'
    responses:
      "202":
        description: View accepted
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/NullDataResponse"
            example:
              success: true
              message: "Success"
              data: null
      "400":
        $ref: ../components/responses.yaml#/BodyValidationError
      "401":
        $ref: ../components/responses.yaml#/PublicUnauthorizedError
      "404":
        description: No live portfolio exists at this subdomain.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Portfolio not found"
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        $ref: ../components/responses.yaml#/RateLimitError
      "503":
        $ref: ../components/responses.yaml#/DatabaseUnavailableError

getMyPortfolio:
  get:
    tags:
      - Portfolios
    operationId: getMyPortfolio
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get My Portfolio
    description: |
      Returns the caller's current portfolio draft document (if any), publication status, and
      billing summary in one call. While the site is offline, `publication.offlineReason` says why:
      a moderator took it down, the owner unpublished it, or billing suspended it. Session-authenticated only — this route does not accept an API
      key.
    responses:
      "200":
        description: Portfolio state fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioMeResponse"
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        $ref: ../components/responses.yaml#/SessionServiceUnavailableError

savePortfolioDraft:
  put:
    tags:
      - Portfolios
    operationId: savePortfolioDraft
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Save Portfolio Draft
    description: |
      Creates or updates the caller's single PORTFOLIO document with a new content snapshot.
      Uses optimistic concurrency via `revision` once a draft already exists. Session-authenticated
      only.

      The response is a trimmed projection of the document, not a full `Document` record.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PortfolioSaveDraftRequest"
    responses:
      "200":
        description: Draft saved successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioDraftResponse"
      "400":
        description: |
          The body fails validation ("Validation failed" with `details`), the subdomain is empty,
          reserved or starts with `xn--` ("Choose a valid portfolio subdomain.", no `details`), or
          the body is not valid JSON.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              validation:
                summary: A field failed validation
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "revision"
                      message: "Expected number, received string"
              invalidSubdomain:
                summary: Empty, reserved or punycode subdomain
                value:
                  success: false
                  statusCode: 400
                  message: "Choose a valid portfolio subdomain."
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: "Invalid JSON body"
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "404":
        description: Portfolio draft not found (when documentId was provided but doesn't belong to the caller)
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "409":
        description: |
          The draft was changed in another session (`details.revision` is the stored revision when
          the check fails up front), or a first save kept colliding on its document slug.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              stale:
                summary: Changed in another session
                value:
                  success: false
                  statusCode: 409
                  message: "Portfolio draft changed in another session."
                  details:
                    revision: 4
              notSaved:
                summary: First save could not get a slug
                value:
                  success: false
                  statusCode: 409
                  message: "The portfolio draft could not be saved. Try again."
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        $ref: ../components/responses.yaml#/SessionServiceUnavailableError

checkPortfolioSubdomainAvailability:
  get:
    tags:
      - Portfolios
    operationId: checkPortfolioSubdomainAvailability
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Check Portfolio Subdomain Availability
    description: |
      Normalises `slug` the way publishing does and says whether it is free. A subdomain the
      caller already publishes under counts as available to them. An empty or reserved name answers
      `400`. Session-authenticated only.
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Availability checked successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioSubdomainAvailabilityResponse"
      "400":
        description: |
          The name is empty, reserved or starts with `xn--` ("Choose a valid portfolio subdomain.",
          no `details`), or longer than 63 characters ("Validation failed" with `details`).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              invalidSubdomain:
                summary: Empty, reserved or punycode name
                value:
                  success: false
                  statusCode: 400
                  message: "Choose a valid portfolio subdomain."
              tooLong:
                summary: Longer than 63 characters
                value:
                  success: false
                  statusCode: 400
                  message: "Validation failed"
                  details:
                    - path: "slug"
                      message: "String must contain at most 63 character(s)"
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        $ref: ../components/responses.yaml#/SessionServiceUnavailableError

previewPortfolio:
  get:
    tags:
      - Portfolios
    operationId: previewPortfolio
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Preview Portfolio Draft
    description: |
      Returns the caller's own portfolio draft for rendering a preview, without publishing it.
      The response is a trimmed projection of the document, not a full `Document` record — it has
      no `slug`. Session-authenticated only.
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Draft fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioPreviewResponse"
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "404":
        description: Portfolio draft not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Portfolio draft not found."
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        $ref: ../components/responses.yaml#/SessionServiceUnavailableError

publishPortfolio:
  post:
    tags:
      - Portfolios
    operationId: publishPortfolio
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Publish Portfolio
    description: |
      Publishes the given draft revision to its chosen subdomain, making it publicly reachable.
      Premium templates (`nimbus`, `cipher`) need Creator Pro, the Job Hunter Bundle or a pass;
      `signal` and `atelier` are free. The stored draft is checked against the stricter publish
      rules (see `PortfolioDraftContent`).

      **Current-state caveat:** in production, publishing is gated behind a hardcoded
      `ADMIN_EMAIL` check independent of plan tier (`isAdminUser`) — regular users can save drafts,
      preview, and manage everything except actually flipping a portfolio live. This is a
      temporary rollout restriction, not a permanent product limitation. Only administrators can
      exercise this endpoint end-to-end in production today; outside production (`NODE_ENV` other
      than `production`) it is unrestricted. The restriction is checked before the body, so in
      production a non-admin gets `403` even for an invalid body.

      Checks run in this order: the premium-template `402`, then the stale-revision `409`, then
      the subdomain.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PortfolioPublishRequest"
    responses:
      "201":
        description: Portfolio published successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioPublishResponse"
      "400":
        description: |
          Validation error, incomplete portfolio content, an unusable image reference, or an empty,
          reserved or punycode subdomain. A body that is not valid JSON answers "Invalid JSON body".
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              invalidSubdomain:
                summary: Empty, reserved or punycode subdomain
                value:
                  success: false
                  statusCode: 400
                  message: "Choose a valid portfolio subdomain."
              incompleteContent:
                summary: Draft does not satisfy the stricter publish schema
                value:
                  success: false
                  statusCode: 400
                  message: "Complete the required portfolio details before publishing."
              badAsset:
                summary: Referenced image is missing, not owned, or not READY
                value:
                  success: false
                  statusCode: 400
                  message: "Portfolio contains an unavailable or invalid image."
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "402":
        description: A premium template (`nimbus`, `cipher`) without Creator Pro, the Job Hunter Bundle or a pass.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 402
              message: 'Publishing the premium template "Nimbus" requires Creator Pro, the Job Hunter Bundle or a pass.'
      "403":
        description: The production publishing restriction, or a portfolio a moderator took down.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              productionGate:
                summary: Non-admin in production
                value:
                  success: false
                  statusCode: 403
                  message: "Publishing is disabled in production during this phase."
              moderated:
                summary: Taken down by a moderator
                value:
                  success: false
                  statusCode: 403
                  message: "This portfolio was taken down by a moderator."
      "404":
        description: Portfolio draft not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
      "409":
        description: Stale revision, or subdomain already in use
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              stale:
                summary: Stale revision
                value:
                  success: false
                  statusCode: 409
                  message: "Save the latest draft before publishing."
              subdomainTaken:
                summary: Subdomain already in use
                value:
                  success: false
                  statusCode: 409
                  message: "That portfolio subdomain is already in use."
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        description: |
          The draft references images but media delivery is not configured on the server
          (`R2_PUBLIC_BASE_URL` unset), the session store cannot be read, or the database cannot
          be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              mediaDelivery:
                summary: Media delivery not configured
                value:
                  success: false
                  statusCode: 503
                  message: "Portfolio media delivery is not configured."
              authUnavailable:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: "Authentication is temporarily unavailable"
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: "Service temporarily unavailable"

unpublishPortfolio:
  post:
    tags:
      - Portfolios
    operationId: unpublishPortfolio
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Unpublish Portfolio
    description: |
      Takes a published portfolio offline — status becomes `SUSPENDED` with reason
      `user_unpublished`, and the underlying document reverts to `PRIVATE` visibility. The document
      itself is not deleted, so the portfolio can be republished later.

      A caller who has never published gets `404`. A portfolio a moderator took down keeps its
      moderation reason; the unpublish is recorded so the site stays offline if the takedown is
      lifted. Session-authenticated only.
    responses:
      "200":
        description: Portfolio unpublished successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioUnpublishResponse"
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "404":
        description: The caller has never published a portfolio.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Portfolio is not published."
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        $ref: ../components/responses.yaml#/SessionServiceUnavailableError

getPortfolioAnalytics:
  get:
    tags:
      - Portfolios
    operationId: getPortfolioAnalytics
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Get Portfolio Analytics
    description: |
      View counts for the caller's published portfolio. `totalViews` is all-time, including views
      still buffered and not yet flushed. `daily` is the 30 most recent days that had any views,
      newest first; days with no views are left out, so it is not a 30-day calendar. `referrers`
      is the all-time top 10 referrer hosts from flushed views only (views still buffered are not
      in it).

      Visitor analytics comes with Creator Pro, the Job Hunter Bundle or a pass. Without it the
      response has `locked: true` and all-zero data, whether or not a portfolio is published. With
      it and no published portfolio, `locked` is false and the data is all zero.
    responses:
      "200":
        description: Analytics fetched successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioAnalyticsResponse"
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        $ref: ../components/responses.yaml#/SessionServiceUnavailableError

createPortfolioAssetUploadUrl:
  post:
    tags:
      - Portfolio Assets
    operationId: createPortfolioAssetUploadUrl
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Create Portfolio Asset Upload URL
    description: |
      Issues a presigned Cloudflare R2 PUT URL (10-minute expiry) for a JPG, PNG, or WebP image up
      to 5MB. Upload the file directly to `uploadUrl` with a matching Content-Type/Content-Length,
      then call `POST /portfolio-assets/complete` to verify and activate it. Session-authenticated
      only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PortfolioAssetUploadRequest"
          example:
            kind: "AVATAR"
            mimeType: "image/png"
            sizeBytes: 204800
    responses:
      "200":
        description: Upload URL created successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioAssetUploadResponse"
      "400":
        description: |
          A `kind` outside the list or a `sizeBytes` that is not a positive integer ("Validation
          failed"), a `mimeType` other than JPEG, PNG or WebP, a size over 5 MB, or a body that is
          not valid JSON.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: Unsupported image type
                value:
                  success: false
                  statusCode: 400
                  message: "Upload a JPG, PNG, or WebP image."
              tooLarge:
                summary: Over 5 MB
                value:
                  success: false
                  statusCode: 400
                  message: "Image must be 5 MB or smaller."
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        description: The caller started 20 uploads in the last hour, finished or not. The per-IP limit also answers `429` ("Too many requests. Please try again later.").
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              documented:
                summary: The caller started 20 uploads in the last hour, finished or not
                value:
                  success: false
                  statusCode: 429
                  message: "Too many image uploads this hour. Try again later."
              ipLimit:
                summary: Per-IP limit
                value:
                  success: false
                  statusCode: 429
                  message: Too many requests. Please try again later.
        headers:
          Retry-After:
            description: Seconds until the limit resets.
            schema:
              type: integer
      "503":
        description: |
          Media uploads are not configured (R2 credentials missing), the session store cannot be
          read, or the database cannot be reached. The asset row is created before the storage
          check, so an upload refused for missing credentials still counts toward the 20 uploads
          an hour and leaves a pending row behind.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              notConfigured:
                summary: R2 credentials missing
                value:
                  success: false
                  statusCode: 503
                  message: "Portfolio media uploads are not configured."
              authUnavailable:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable

completePortfolioAssetUpload:
  post:
    tags:
      - Portfolio Assets
    operationId: completePortfolioAssetUpload
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Complete Portfolio Asset Upload
    description: |
      Verifies an uploaded asset with a server-side HEAD request against R2 (confirming size,
      content type, and optional checksum match what was declared) and marks it `READY` so it can
      be referenced from a portfolio. Session-authenticated only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PortfolioAssetCompleteRequest"
    responses:
      "200":
        description: Asset completed successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PortfolioAssetCompleteResponse"
      "400":
        description: The uploaded file does not match the declared size, type or checksum, or the body is invalid.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              sizeMismatch:
                summary: Size differs from the declared size
                value:
                  success: false
                  statusCode: 400
                  message: "Uploaded file size (180000 bytes) does not match expected size (204800 bytes)."
              typeMismatch:
                summary: Type differs from the declared type
                value:
                  success: false
                  statusCode: 400
                  message: "Uploaded file type (image/jpeg) does not match expected type (image/png)."
              invalidJson:
                summary: The body is not valid JSON
                value:
                  success: false
                  statusCode: 400
                  message: Invalid JSON body
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "404":
        description: Asset not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Portfolio asset not found."
      "409":
        description: Storage has no object for this asset; the browser's upload failed or was aborted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "The upload was not received. Upload the image again."
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLargeError
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        description: |
          Media delivery is not configured (public base URL missing), media uploads are not
          configured (R2 credentials missing), the session store cannot be read, or the database
          cannot be reached. Any other storage error answers `500`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              deliveryNotConfigured:
                summary: Public base URL missing
                value:
                  success: false
                  statusCode: 503
                  message: "Portfolio media delivery is not configured."
              uploadsNotConfigured:
                summary: R2 credentials missing
                value:
                  success: false
                  statusCode: 503
                  message: "Portfolio media uploads are not configured."
              authUnavailable:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: Authentication is temporarily unavailable
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: Service temporarily unavailable

deletePortfolioAsset:
  delete:
    tags:
      - Portfolio Assets
    operationId: deletePortfolioAsset
    security:
      - LocalSession: []
      - ProdSession: []
    summary: Delete Portfolio Asset
    description: |
      Deletes the R2 object and its metadata row. An asset created in the last 15 minutes (the
      upload URL's lifetime plus 5 minutes) keeps its row, marked `DELETED`, so a late completion
      cannot revive it. `data` is `null` on success. Session-authenticated only.

      An image the published portfolio still shows cannot be deleted (`409`): publish without it
      first.

      This does not rewrite any portfolio that still references the asset — remove the reference
      and save the draft first, or publishing will fail with `400`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Asset deleted successfully
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/NullDataResponse"
            example:
              success: true
              message: "Success"
              data: null
      "401":
        $ref: ../components/responses.yaml#/SessionUnauthorizedError
      "404":
        description: Asset not found
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 404
              message: "Portfolio asset not found."
      "409":
        description: The published portfolio still shows this image.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            example:
              success: false
              statusCode: 409
              message: "Your published portfolio still shows this image. Publish without it first."
      "429":
        $ref: ../components/responses.yaml#/IpRateLimitError
      "503":
        description: |
          Media uploads are not configured (R2 credentials missing), the session store cannot be
          read, or the database cannot be reached.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ErrorResponse"
            examples:
              notConfigured:
                summary: R2 credentials missing
                value:
                  success: false
                  statusCode: 503
                  message: "Portfolio media uploads are not configured."
              authUnavailable:
                summary: Session store unavailable
                value:
                  success: false
                  statusCode: 503
                  message: "Authentication is temporarily unavailable"
              databaseUnavailable:
                summary: Database unreachable
                value:
                  success: false
                  statusCode: 503
                  message: "Service temporarily unavailable"
