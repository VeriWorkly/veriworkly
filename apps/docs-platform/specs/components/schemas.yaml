MasterProfileCustomization:
  type: object
  properties:
    accentColor:
      type: string
    textColor:
      type: string
    mutedTextColor:
      type: string
    pageBackgroundColor:
      type: string
    sectionBackgroundColor:
      type: string
    borderColor:
      type: string
    sectionHeadingColor:
      type: string
    fontFamily:
      type: string
    sectionSpacing:
      type: number
    pagePadding:
      type: number
    bodyLineHeight:
      type: number
    headingLineHeight:
      type: number

MasterProfileContent:
  type: object
  description: |
    The resume-shaped JSON stored in `MasterProfile.content`.

    **On `PUT /profiles/master` this object is validated strictly and every property listed below
    is required.** Send an empty array for sections you have no data for — omitting a key fails
    with `400`, and so does sending any key not listed here. Every array item carries a
    client-generated `id`. Field limits (string lengths, 200 items per array, 10-digit phone
    numbers, `YYYY-MM` / `YYYY` date formats) are enforced server-side.
  required:
    - templateId
    - basics
    - links
    - summary
    - experience
    - education
    - projects
    - skills
    - languages
    - interests
    - awards
    - certificates
    - publications
    - volunteer
    - references
    - achievements
    - customSections
    - sections
    - customization
  properties:
    templateId:
      type: string
    basics:
      $ref: "#/MasterProfileBasics"
    links:
      type: object
      properties:
        displayMode:
          type: string
          enum: [icon, url, icon-username]
        items:
          type: array
          items:
            $ref: "#/MasterProfileLink"
    summary:
      type: string
    experience:
      type: array
      items:
        $ref: "#/MasterProfileExperienceItem"
    education:
      type: array
      items:
        $ref: "#/MasterProfileEducationItem"
    projects:
      type: array
      items:
        $ref: "#/MasterProfileProjectItem"
    skills:
      type: array
      items:
        $ref: "#/MasterProfileSkillItem"
    languages:
      type: array
      items:
        $ref: "#/MasterProfileLanguageItem"
    interests:
      type: array
      items:
        $ref: "#/MasterProfileInterestItem"
    awards:
      type: array
      items:
        $ref: "#/MasterProfileAwardItem"
    certificates:
      type: array
      items:
        $ref: "#/MasterProfileCertificateItem"
    publications:
      type: array
      items:
        $ref: "#/MasterProfilePublicationItem"
    volunteer:
      type: array
      items:
        $ref: "#/MasterProfileVolunteerItem"
    references:
      type: array
      items:
        $ref: "#/MasterProfileReferenceItem"
    achievements:
      type: array
      items:
        $ref: "#/MasterProfileAchievementItem"
    customSections:
      type: array
      items:
        $ref: "#/MasterProfileCustomSection"
    sections:
      type: array
      items:
        $ref: "#/MasterProfileSectionItem"
    customization:
      $ref: "#/MasterProfileCustomization"
    updatedAt:
      type: string
      format: date-time
      nullable: true

MasterProfileResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        profile:
          $ref: "#/MasterProfile"
        summary:
          $ref: "#/UserSummary"

MasterProfileUpdateRequest:
  type: object
  required:
    - profile
  properties:
    expectedUpdatedAt:
      type: string
      format: date-time
      nullable: true
      description: Pass the `updatedAt` value from your last read. Omit only when creating the profile for the first time.
    profile:
      $ref: "#/MasterProfileContent"

MasterProfileUpdateResponse:
  type: object
  required: [success, message, data]
  properties:
