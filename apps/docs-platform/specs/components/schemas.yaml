##################################################
# AMBASSADOR SCHEMA
##################################################

AmbassadorApplicationRequest:
  type: object
  required: [collegeName, graduationYear, whyJoin, superpower, funFact]
  properties:
    collegeName:
      type: string
      minLength: 2
      maxLength: 160
    graduationYear:
      type: string
      pattern: "^(19|20)\\d{2}$"
      description: A real 4-digit year, validated both client- and server-side.
    whyJoin:
      type: string
      minLength: 20
      maxLength: 1000
    superpower:
      type: string
      minLength: 2
      maxLength: 300
    funFact:
      type: string
      minLength: 2
      maxLength: 300
    vibeCheck:
      type: string
      maxLength: 80
    socialHandle:
      type: string
      maxLength: 120

AmbassadorApplicationResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        success:
          type: boolean
        ambassadorStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        collegeName:
          type: string
        graduationYear:
          type: string

AmbassadorStatus:
  type: object
  description: |
    Intentionally small today: this surface only covers application intake and status. There is
    no points/rewards/redemption API yet — that system has not been built.
  properties:
    role:
      type: string
      description: The user's account role (e.g. USER, AMBASSADOR).
    ambassadorStatus:
      type: string
      enum: [NONE, PENDING, APPROVED, REJECTED]
    collegeName:
      type: string
      nullable: true
    graduationYear:
      type: string
      nullable: true

AmbassadorStatusResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/AmbassadorStatus"
