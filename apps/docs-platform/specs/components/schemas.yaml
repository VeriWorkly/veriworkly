      type: string
    data:
      $ref: "#/MasterProfile"

##################################################
# PROFILE IMPORT SCHEMA
##################################################

ProfileImportQuota:
  type: object
  properties:
    isPaid:
      type: boolean
    remaining:
      type: integer
    limit:
      type: integer
    resetsInSeconds:
      type: integer
    connectedUsername:
      type: string
      nullable: true
      description: The GitHub login connected via OAuth, when known (GitHub quota only).

ProfileImportQuotaResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        github:
          $ref: "#/ProfileImportQuota"
        linkedin:
          $ref: "#/ProfileImportQuota"

ImportGithubRequest:
  type: object
  required: [usernameOrUrl]
  properties:
    usernameOrUrl:
      type: string
      description: |
        A GitHub username or profile URL. Free users may only import their own OAuth-connected
        account (this value is ignored server-side and the caller's authenticated GitHub login is
        used instead); paid users may import any public username.
    replaceMaster:
      type: boolean
      default: false
      description: When true, also overwrites the user's master profile with the imported content.

ImportLinkedinRequest:
  type: object
  required: [profileText]
  properties:
    profileText:
      type: string
      minLength: 10
      description: Raw copy-pasted text from a LinkedIn profile export or PDF (parsed by AI, not fetched via any LinkedIn API).
    replaceMaster:
      type: boolean
      default: false
      description: When true, also overwrites the user's master profile with the imported content.

ProfileImportResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/Document"
      description: The newly created resume Document seeded from the imported data.

