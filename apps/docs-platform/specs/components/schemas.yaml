ErrorResponse:
  type: object
  required:
    - success
    - message
    - statusCode
  properties:
    success:
      type: boolean
    message:
      type: string
    statusCode:
      type: integer
    details:
      type: array
      nullable: true
      items:
        type: object
        properties:
          path:
            type: string
          message:
            type: string

##################################################
# SHARED PAGINATION
##################################################

OffsetPaginationMeta:
  type: object
  description: |
    Offset-pagination metadata returned alongside `items` by every paginated list endpoint.
    Requests may use either `page`/`pageSize` or `limit`/`offset`; the response always echoes both
    views of the same window.
  required:
    - total
    - limit
    - offset
    - page
    - pageSize
    - totalPages
    - hasMore
    - pagination
  properties:
    total:
      type: integer
      description: Total number of matching records, ignoring the current window.
    limit:
      type: integer
    offset:
      type: integer
    page:
      type: integer
      description: 1-based page index for the current window.
    pageSize:
      type: integer
      description: Always equal to `limit`.
    totalPages:
      type: integer
      description: At least 1, even when `total` is 0.
    hasMore:
      type: boolean
    pagination:
      type: object
      required: [mode, nextOffset, nextCursor]
      properties:
        mode:
          type: string
          const: offset
          enum: [offset]
        nextOffset:
          type: integer
          nullable: true
          description: Null when `hasMore` is false.
        nextCursor:
          type: string
          nullable: true
          description: Always null — these endpoints are offset-paginated, never cursor-paginated.

##################################################
# HEALTH SCHEMA
##################################################

HealthLivenessData:
  type: object
  description: |
    Liveness payload. `GET /api/v1/health` deliberately touches no external dependency, so uptime
    checks do not wake database compute — it reports only that the Node.js process is responding.
  required:
    - status
    - timestamp
  properties:
    status:
      type: string
      const: ok
      example: ok
    timestamp:
      type: string
      format: date-time

HealthLivenessResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/HealthLivenessData"

HealthReadyData:
  type: object
  description: Readiness payload. Only `GET /api/v1/health/ready` verifies PostgreSQL and Redis connectivity.
  required:
    - status
    - database
    - redis
    - timestamp
  properties:
    status:
      type: string
      const: ok
      example: ok
    database:
      type: string
      const: connected
      example: connected
    redis:
      type: string
      const: connected
      example: connected
    timestamp:
      type: string
      format: date-time

HealthReadyResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/HealthReadyData"

##################################################
# USER SCHEMA
##################################################

UserObject:
  type: object
  required:
    - id
    - email
    - emailVerified
    - autoSyncEnabled
    - createdAt
    - updatedAt
    - _count
  properties:
    id:
      type: string
    name:
      type: string
      nullable: true
    username:
      type: string
      nullable: true
      description: |
        Null until the user claims one. Immutable once set, and required before any share link can
        be created.
    email:
      type: string
    emailVerified:
      type: boolean
    autoSyncEnabled:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    _count:
      type: object
      description: Relational counts for the user's own records.
      required:
        - apiKeys
        - shareLinks
        - resumes
      properties:
        apiKeys:
          type: integer
        shareLinks:
          type: integer
        resumes:
          type: integer
          description: |
            Counts every Document the user owns — every `type`, and soft-deleted ones included.
            It is not a count of RESUME-type documents. Use `GET /documents` for an accurate,
            filterable list.

UserResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/UserObject"

UsernameAvailability:
  type: object
  required: [available, normalizedUsername]
  properties:
    available:
      type: boolean
    normalizedUsername:
      type: string
      description: The value that would actually be stored, after server-side normalisation.
    reason:
      type: string
      enum: [too_short, too_long, invalid_characters, reserved, taken]
      description: Present only when `available` is `false`.

UsernameAvailabilityResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/UsernameAvailability"

