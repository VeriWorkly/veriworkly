ErrorResponse:
  type: object
  required:
    - success
    - message
    - statusCode
  properties:
    success:
      type: boolean
    message:
      type: string
    statusCode:
      type: integer
    details:
      description: |
        Left out when there is nothing to add. A validation failure (`400` "Validation failed")
        sends an array of `{ path, message }`, one entry per rejected field. Other errors send an
        object instead, such as `{ code }`, `{ currentUpdatedAt }` or the caller's quota. Each
        operation's error responses say which.
      oneOf:
        - type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
        - type: object
          additionalProperties: true

UnauthorizedResponse:
  type: object
  description: |
    The body of a `401`. Routes that accept an API key or a session answer with `code`; a
    rejection thrown from inside a handler carries `statusCode` instead.
  required:
    - success
    - message
  properties:
    success:
      type: boolean
    message:
      type: string
    statusCode:
      type: integer
    code:
      type: string
      enum: [API_KEY_REQUIRED, AUTH_REQUIRED]

AtsQuotaErrorResponse:
  type: object
  description: The body of a `429` from the ATS quota. `details` is the caller's current quota.
  required:
    - success
    - message
    - statusCode
  properties:
    success:
      type: boolean
    message:
      type: string
    statusCode:
      type: integer
    details:
      $ref: "#/AtsQuotaSummary"

##################################################
# SHARED PAGINATION
##################################################

OffsetPaginationMeta:
  type: object
  description: |
    Offset-pagination metadata returned alongside `items` by every paginated list endpoint.
    Requests may use either `page`/`pageSize` or `limit`/`offset`; the response always echoes both
    views of the same window.
  required:
    - total
    - limit
    - offset
    - page
    - pageSize
    - totalPages
    - hasMore
    - pagination
  properties:
    total:
      type: integer
      description: Total number of matching records, ignoring the current window.
    limit:
      type: integer
    offset:
      type: integer
    page:
      type: integer
      description: 1-based page index for the current window.
    pageSize:
      type: integer
      description: Always equal to `limit`.
    totalPages:
      type: integer
      description: At least 1, even when `total` is 0.
    hasMore:
      type: boolean
    pagination:
      type: object
      required: [mode, nextOffset, nextCursor]
      properties:
        mode:
          type: string
          const: offset
          enum: [offset]
        nextOffset:
          type: [integer, "null"]
          description: Null when `hasMore` is false.
        nextCursor:
          type: [string, "null"]
          description: Always null — these endpoints are offset-paginated, never cursor-paginated.

##################################################
# HEALTH SCHEMA
##################################################

HealthLivenessData:
  type: object
  description: |
    Liveness payload. `GET /api/v1/health` deliberately touches no external dependency, so uptime
    checks do not wake database compute — it reports only that the Node.js process is responding.
  required:
    - status
    - timestamp
  properties:
    status:
      type: string
      const: ok
      example: ok
    timestamp:
      type: string
      format: date-time

HealthLivenessResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/HealthLivenessData"

HealthReadyData:
  type: object
  description: Readiness payload. Only `GET /api/v1/health/ready` verifies PostgreSQL and Redis connectivity.
  required:
    - status
    - database
    - redis
    - timestamp
  properties:
    status:
      type: string
      const: ok
      example: ok
    database:
      type: string
      const: connected
      example: connected
    redis:
      type: string
      const: connected
      example: connected
    timestamp:
      type: string
      format: date-time

HealthReadyResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/HealthReadyData"

##################################################
# USER SCHEMA
##################################################

UserObject:
  type: object
  required:
    - id
    - email
    - emailVerified
    - autoSyncEnabled
    - createdAt
    - updatedAt
    - _count
  properties:
    id:
      type: string
    name:
      type: [string, "null"]
    username:
      type: [string, "null"]
      description: |
        Null until the user claims one. Immutable once set, and required before any share link can
        be created.
    email:
      type: string
    emailVerified:
      type: boolean
    autoSyncEnabled:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    _count:
      type: object
      description: Relational counts for the user's own records.
      required:
        - apiKeys
        - shareLinks
        - resumes
      properties:
        apiKeys:
          type: integer
        shareLinks:
          type: integer
        resumes:
          type: integer
          description: |
            Counts every Document the user owns — every `type`, and soft-deleted ones included.
            It is not a count of RESUME-type documents. Use `GET /documents` for an accurate,
            filterable list.

UserResponse:
  type: object
  required:
    - success
    - message
    - data
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/UserObject"

UsernameAvailability:
  type: object
  required: [available, normalizedUsername]
  properties:
    available:
      type: boolean
    normalizedUsername:
      type: string
      description: The value that would actually be stored, after server-side normalisation.
    reason:
      type: string
      enum: [too_short, too_long, invalid_characters, reserved, taken]
      description: Present only when `available` is `false`.

UsernameAvailabilityResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/UsernameAvailability"

##################################################
# MASTER PROFILE SCHEMA
##################################################

MasterProfile:
  type: object
  required:
    - id
    - userId
    - content
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      description: Empty string when the user has never saved a master profile yet.
    userId:
      type: string
    content:
      $ref: "#/MasterProfileContent"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

UserSummary:
  type: object
  properties:
    id:
      type: string
    name:
      type: [string, "null"]
    email:
      type: string
    createdAt:
      type: string
      format: date-time
    emailVerified:
      type: boolean
    autoSyncEnabled:
      type: boolean
    shareResumeCount:
      type: integer
      description: Number of ShareLink records owned by the user.

MasterProfileItemId:
  type: string
  minLength: 1
  maxLength: 128
  description: Client-generated id, unique within its list. Surrounding spaces are trimmed.

MasterProfileMonthDate:
  type: string
  maxLength: 7
  pattern: "^$|^\\d{4}-(0[1-9]|1[0-2])$"
  description: "`YYYY-MM`, or an empty string when not known."

MasterProfileYearDate:
  type: string
  maxLength: 4
  pattern: "^$|^\\d{4}$"
  description: "`YYYY`, or an empty string when not known."

MasterProfileUrl:
  type: string
  maxLength: 2048
  description: An `http://` or `https://` URL, or an empty string.

MasterProfileEmail:
  type: string
  maxLength: 200
  description: A valid email address, or an empty string when not provided.

MasterProfilePhone:
  type: string
  maxLength: 24
  description: |
    Empty when not provided. Otherwise either a number that starts with `+` and the country code
    and is valid for that country (`"+14155550123"`, `"+1 (415) 555-0123"`), or 7 to 15 digits
    with nothing else (`"9876543210"`, kept for numbers saved before country codes were
    collected). `"(987) 654-3210"` is rejected. The value is stored as sent.

MasterProfileLink:
  type: object
  required: [id, type, label, url]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    type:
      type: string
      enum: [github, linkedin, dribbble, twitter, portfolio, behance, medium, youtube, custom]
    label:
      type: string
      maxLength: 80
    url:
      $ref: "#/MasterProfileUrl"

MasterProfileBasics:
  type: object
  description: All properties are required.
  required:
    - fullName
    - role
    - headline
    - email
    - phone
    - location
    - linkEmail
    - linkPhone
    - linkLocation
  properties:
    fullName:
      type: string
      maxLength: 120
    role:
      type: string
      maxLength: 120
    headline:
      type: string
      maxLength: 250
    email:
      $ref: "#/MasterProfileEmail"
    phone:
      $ref: "#/MasterProfilePhone"
    location:
      type: string
      maxLength: 120
    linkEmail:
      type: boolean
    linkPhone:
      type: boolean
    linkLocation:
      type: boolean

MasterProfileExperienceItem:
  type: object
  required: [id, company, role, location, startDate, endDate, current, summary, highlights]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    company:
      type: string
      maxLength: 160
    role:
      type: string
      maxLength: 160
    location:
      type: string
      maxLength: 120
    startDate:
      $ref: "#/MasterProfileMonthDate"
    endDate:
      $ref: "#/MasterProfileMonthDate"
    current:
      type: boolean
    summary:
      type: string
      maxLength: 5000
    highlights:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 400

MasterProfileEducationItem:
  type: object
  required: [id, school, degree, field, startDate, endDate, current, summary]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    school:
      type: string
      maxLength: 160
    degree:
      type: string
      maxLength: 160
    field:
      type: string
      maxLength: 160
    startDate:
      $ref: "#/MasterProfileYearDate"
    endDate:
      $ref: "#/MasterProfileYearDate"
    current:
      type: boolean
    summary:
      type: string
      maxLength: 5000

MasterProfileProjectItem:
  type: object
  required: [id, name, role, link, summary, highlights]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    name:
      type: string
      maxLength: 160
    role:
      type: string
      maxLength: 160
    link:
      $ref: "#/MasterProfileUrl"
    linkLabel:
      type: string
      maxLength: 80
      default: Link
    showLinkAsText:
      type: boolean
      default: true
    summary:
      type: string
      maxLength: 5000
    highlights:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 400
    skills:
      type: array
      maxItems: 100
      default: []
      items:
        type: string
        maxLength: 80

MasterProfileSkillItem:
  type: object
  required: [id, name, keywords]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    name:
      type: string
      maxLength: 120
    keywords:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 80

MasterProfileLanguageItem:
  type: object
  required: [id, language, fluency]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    language:
      type: string
      maxLength: 80
    fluency:
      type: string
      enum: [elementary, limited, professional, fluent, native]

MasterProfileInterestItem:
  type: object
  required: [id, name, keywords]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    name:
      type: string
      maxLength: 120
    keywords:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 80

MasterProfileAwardItem:
  type: object
  required: [id, title, awarder, date, description, showLink]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    title:
      type: string
      maxLength: 200
    awarder:
      type: string
      maxLength: 200
    date:
      $ref: "#/MasterProfileMonthDate"
    website:
      $ref: "#/MasterProfileUrl"
    description:
      type: string
      maxLength: 5000
    showLink:
      type: boolean

MasterProfileCertificateItem:
  type: object
  required: [id, title, issuer, date, description, showLink]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    title:
      type: string
      maxLength: 200
    issuer:
      type: string
      maxLength: 200
    date:
      $ref: "#/MasterProfileMonthDate"
    website:
      $ref: "#/MasterProfileUrl"
    referenceId:
      type: string
      maxLength: 200
      description: The credential id printed on the certificate.
    description:
      type: string
      maxLength: 5000
    showLink:
      type: boolean

MasterProfilePublicationItem:
  type: object
  required: [id, title, publisher, date, description, showLink]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    title:
      type: string
      maxLength: 200
    publisher:
      type: string
      maxLength: 200
    date:
      $ref: "#/MasterProfileMonthDate"
    website:
      $ref: "#/MasterProfileUrl"
    description:
      type: string
      maxLength: 5000
    showLink:
      type: boolean

MasterProfileVolunteerItem:
  type: object
  required: [id, organization, role, startDate, endDate, current, location, summary]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    organization:
      type: string
      maxLength: 200
    role:
      type: string
      maxLength: 160
    startDate:
      $ref: "#/MasterProfileMonthDate"
    endDate:
      $ref: "#/MasterProfileMonthDate"
    current:
      type: boolean
    location:
      type: string
      maxLength: 120
    summary:
      type: string
      maxLength: 5000

MasterProfileReferenceItem:
  type: object
  required: [id, name, title, organization, relationship]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    name:
      type: string
      maxLength: 160
    title:
      type: string
      maxLength: 160
    organization:
      type: string
      maxLength: 200
    email:
      $ref: "#/MasterProfileEmail"
    phone:
      $ref: "#/MasterProfilePhone"
    relationship:
      type: string
      maxLength: 200

MasterProfileAchievementItem:
  type: object
  required: [id, title, description]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    title:
      type: string
      maxLength: 200
    description:
      type: string
      maxLength: 5000

MasterProfileAdditionalItem:
  type: object
  required: [id, name, issuer, date, link, referenceId, description, details]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    name:
      type: string
      maxLength: 200
    issuer:
      type: string
      maxLength: 200
    date:
      type: string
      maxLength: 40
      description: Free text. Not checked against a date format.
    link:
      type: string
      maxLength: 2048
      description: Free text. Not checked as a URL.
    referenceId:
      type: string
      maxLength: 200
    description:
      type: string
      maxLength: 5000
    details:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 500

MasterProfileCustomSection:
  type: object
  required: [id, kind, title, items]
  properties:
    id:
      $ref: "#/MasterProfileItemId"
    kind:
      type: string
      enum:
        [
          certifications,
          awards,
          publications,
          languages,
          interests,
          volunteer,
          references,
          achievements,
          custom,
        ]
    title:
      type: string
      maxLength: 120
    items:
      type: array
      maxItems: 200
      items:
        $ref: "#/MasterProfileAdditionalItem"
    editableTitle:
      type: boolean

MasterProfileSectionItem:
  type: object
  required: [id, label, visible, order]
  properties:
    id:
      type: string
      enum:
        [
          basics,
          links,
          summary,
          experience,
          education,
          projects,
          skills,
          certifications,
          awards,
          publications,
          languages,
          interests,
          volunteer,
          references,
          achievements,
          custom,
        ]
    label:
      type: string
      maxLength: 80
    visible:
      type: boolean
    order:
      type: integer
      minimum: 0
      maximum: 1000
    customSectionId:
      type: string
      maxLength: 128
      description: The id of the custom section this entry orders and shows or hides. Set only when `id` is `custom`.

MasterProfileCustomization:
  type: object
  description: All twelve properties are required.
  required:
    - accentColor
    - textColor
    - mutedTextColor
    - pageBackgroundColor
    - sectionBackgroundColor
    - borderColor
    - sectionHeadingColor
    - fontFamily
    - sectionSpacing
    - pagePadding
    - bodyLineHeight
    - headingLineHeight
  properties:
    accentColor:
      type: string
      maxLength: 32
    textColor:
      type: string
      maxLength: 32
    mutedTextColor:
      type: string
      maxLength: 32
    pageBackgroundColor:
      type: string
      maxLength: 32
    sectionBackgroundColor:
      type: string
      maxLength: 32
    borderColor:
      type: string
      maxLength: 32
    sectionHeadingColor:
      type: string
      maxLength: 32
    fontFamily:
      type: string
      minLength: 1
      maxLength: 32
    sectionSpacing:
      type: number
      minimum: 0
      maximum: 120
    pagePadding:
      type: number
      minimum: 0
      maximum: 120
    bodyLineHeight:
      type: number
      minimum: 1
      maximum: 3
    headingLineHeight:
      type: number
      minimum: 1
      maximum: 3

MasterProfileContent:
  type: object
  description: |
    The resume-shaped JSON stored in `MasterProfile.content`.

    On `PUT /profiles/master`, `templateId`, `basics`, `links`, `summary` and `customization` are
    required. An omitted array is stored as `[]`, and keys not listed here are dropped rather than
    rejected. Inside an item, every property is required unless its schema marks it optional.
    Every array item carries a client-generated `id`. Each top-level array holds at most 200
    items. A payload larger than 1 MB once serialized is rejected with `413`.
  required:
    - templateId
    - basics
    - links
    - summary
    - customization
  properties:
    schemaVersion:
      type: integer
      minimum: 1
      default: 2
      description: Version of the profile content format. Defaults to the current version when omitted.
    templateId:
      type: string
      minLength: 1
      maxLength: 64
    basics:
      $ref: "#/MasterProfileBasics"
    links:
      type: object
      required: [displayMode, items]
      properties:
        displayMode:
          type: string
          enum: [icon, url, icon-username]
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/MasterProfileLink"
    summary:
      type: string
      maxLength: 8000
    experience:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileExperienceItem"
    education:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileEducationItem"
    projects:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileProjectItem"
    skills:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileSkillItem"
    languages:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileLanguageItem"
    interests:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileInterestItem"
    awards:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileAwardItem"
    certificates:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileCertificateItem"
    publications:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfilePublicationItem"
    volunteer:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileVolunteerItem"
    references:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileReferenceItem"
    achievements:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileAchievementItem"
    customSections:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileCustomSection"
    sections:
      type: array
      maxItems: 200
      default: []
      items:
        $ref: "#/MasterProfileSectionItem"
    customization:
      $ref: "#/MasterProfileCustomization"
    updatedAt:
      type: string
      format: date-time

MasterProfileResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        profile:
          $ref: "#/MasterProfile"
        summary:
          $ref: "#/UserSummary"

MasterProfileUpdateRequest:
  type: object
  required:
    - profile
  properties:
    expectedUpdatedAt:
      type: string
      format: date-time
      description: |
        The `updatedAt` from your last read. Leave it out only when the profile has never been
        saved; a save over an existing profile without it is rejected with `409`. `null` is
        rejected with `400`.
    profile:
      $ref: "#/MasterProfileContent"

MasterProfileUpdateResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/MasterProfile"

##################################################
# PROFILE IMPORT SCHEMA
##################################################

ProfileImportQuota:
  type: object
  required: [isPaid, unlimited, remaining, limit, resetsInSeconds, connectedUsername]
  properties:
    isPaid:
      type: boolean
      description: The caller has any plan (AI Credits, Creator Pro or the Job Hunter Bundle) or a pass. A credit pack does not count.
    unlimited:
      type: boolean
      description: True for a paid caller's LinkedIn quota. `remaining` and `limit` are then null.
    remaining:
      type: [integer, "null"]
    limit:
      type: [integer, "null"]
      description: 1 for a free caller (a day for GitHub, 30 days for LinkedIn), 50 a day for a paid caller's GitHub imports, null when unlimited.
    resetsInSeconds:
      type: integer
    connectedUsername:
      type: [string, "null"]
      description: The GitHub login of the linked account, read from GitHub for a free caller. Null for a paid caller, for LinkedIn, or when GitHub cannot be reached.
    hasGithubAccount:
      type: boolean
      description: GitHub quota only. A GitHub login is linked to the account, whatever GitHub says about its token.

ProfileImportQuotaResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        github:
          $ref: "#/ProfileImportQuota"
        linkedin:
          $ref: "#/ProfileImportQuota"

ImportGithubRequest:
  type: object
  required: [usernameOrUrl]
  properties:
    usernameOrUrl:
      type: string
      description: |
        A GitHub username or profile URL. Free users may only import their own OAuth-connected
        account (this value is ignored server-side and the caller's authenticated GitHub login is
        used instead); paid users may import any public username.
    replaceMaster:
      type: boolean
      default: false
      description: When true, also overwrites the user's master profile with the imported content.

ImportLinkedinRequest:
  type: object
  required: [profileText]
  properties:
    profileText:
      type: string
      minLength: 10
      maxLength: 50000
      description: Raw copy-pasted text from a LinkedIn profile export or PDF (parsed by AI, not fetched via any LinkedIn API).
    replaceMaster:
      type: boolean
      default: false
      description: When true, also overwrites the user's master profile with the imported content.
    requestId:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        The client's id for this import, as on every other AI route. A retry with the same id
        and the same text after a lost response returns the document already created
        (`replayed: true`) without charging again; the same id with different text is `409`.

ProfileImportResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
