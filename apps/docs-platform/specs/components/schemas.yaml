AffiliateReferralRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      minLength: 4
      maxLength: 32
      description: Another affiliate's code. Self-referrals are rejected.

AffiliateReferralResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
