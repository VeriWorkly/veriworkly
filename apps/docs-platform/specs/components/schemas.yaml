      type: string
    data:
      description: Null until the first GitHub sync has run for the configured repository.
      oneOf:
        - $ref: "#/GitHubStatsData"
        - type: "null"

GitHubItem:
  type: object
  properties:
    id:
      type: string
    number:
      type: integer
    title:
      type: string
    status:
      type: string
      enum: [todo, in-progress, done]
    kind:
      type: string
      enum: [issue, pull-request]
    url:
      type: string
    labels:
      type: array
      items:
        type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

GitHubIssuesData:
  allOf:
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/GitHubItem"
    - $ref: "#/OffsetPaginationMeta"

GitHubIssuesResponse:
  type: object
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/GitHubIssuesData"

GenericSuccessResponse:
  type: object
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      additionalProperties: true

NullDataResponse:
  type: object
  description: Success envelope for endpoints that acknowledge an action without returning a body.
  required: [success, message, data]
  properties:
    success:
      type: boolean
      const: true
    message:
      type: string
    data:
      type: "null"

##################################################
# GITHUB SCHEMA
##################################################
##################################################
# API KEY SCHEMA
##################################################

ApiKeyScope:
  type: string
  description: |
    API key scopes are a fixed set — requesting any other value fails with `400`. Each scope maps
    to the `requireApiKeyScopes(...)` gate on the corresponding routes. Scope checks apply only to
    API-key callers; session callers are not scope-gated.
  enum:
    - user:read
    - user:write
    - resume:read
    - resume:write
    - roadmap:read
    - changelog:read
    - github:read
    - ai:write

ApiKeyListItem:
  type: object
  description: |
    The trimmed shape returned by `GET /api-keys`. The secret is **not** included in any form —
    not even masked. Use `keyPrefix` to identify a key in a list.
  required:
    - id
    - name
    - keyPrefix
    - isActive
    - createdAt
  properties:
    id:
      type: string
    name:
      type: string
    keyPrefix:
      type: string
      description: First 8 characters of the key (`vw_` plus 5 hex characters).
      example: "vw_a1b2c"
    isActive:
      type: boolean
    createdAt:
      type: string
      format: date-time
    lastUsed:
      type: string
      format: date-time
      nullable: true
      description: Written at most once every 5 minutes per key, so it lags real usage slightly.

ApiKeySecret:
  type: object
  description: |
    Returned only by `POST /api-keys` and `POST /api-keys/{id}/rotate`. `key` is the full secret
    and is shown exactly once — it is stored only as an HMAC-SHA256 hash and cannot be retrieved
    again.
  required:
    - id
    - key
    - keyPrefix
    - keySuffix
    - name
    - userId
    - isActive
    - rateLimit
    - scopes
    - expiresAt
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    key:
      type: string
      description: The full secret — `vw_` followed by 64 hex characters. Shown once, never again.
      example: "vw_3f2a1c9e8b7d6f5a4c3b2a1908f7e6d5c4b3a29180706f5e4d3c2b1a09f8e7d6"
    keyPrefix:
      type: string
      description: First 8 characters of `key`.
    keySuffix:
      type: string
      description: Last 8 characters of `key`.
    name:
      type: string
    userId:
      type: string
    isActive:
      type: boolean
    rateLimit:
      type: integer
      description: Requests allowed per 15-minute window for this key.
    scopes:
      type: array
      items:
        $ref: "#/ApiKeyScope"
    expiresAt:
      type: string
      format: date-time
      nullable: true
      description: Always set. Defaults to 365 days from creation when not supplied.
    revokedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastUsed:
      type: string
      format: date-time
      nullable: true
    rotatedFromId:
      type: string
      description: Only present on a rotate response — the id of the key this one replaced.

ApiKeyListResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      allOf:
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/ApiKeyListItem"
        - $ref: "#/OffsetPaginationMeta"

ApiKeyCreateResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/ApiKeySecret"

ApiKeyDetail:
  type: object
  description: |
    The full metadata record for a single key, returned by `GET /api-keys/{id}`. Identical to
    `ApiKeySecret` minus `key` — the secret itself is unrecoverable after creation.
  required:
    - id
    - keyPrefix
    - keySuffix
    - name
    - userId
    - isActive
    - rateLimit
    - scopes
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    keyPrefix:
      type: string
      description: First 8 characters of the key.
    keySuffix:
      type: string
      description: Last 8 characters of the key. Not enough to reconstruct the secret.
    name:
      type: string
    userId:
      type: string
    isActive:
      type: boolean
    rateLimit:
      type: integer
      description: Requests allowed per 15-minute window for this key.
    scopes:
      type: array
      items:
        $ref: "#/ApiKeyScope"
    expiresAt:
      type: string
      format: date-time
      nullable: true
    revokedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    lastUsed:
      type: string
      format: date-time
      nullable: true
      description: Written at most once every 5 minutes per key, so it lags real usage slightly.

ApiKeyDetailResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/ApiKeyDetail"

##################################################
# DOCUMENT SCHEMA
##################################################

Document:
  type: object
  required:
    - id
    - userId
    - type
    - title
    - slug
    - tags
    - content
    - templateId
    - schemaVersion
    - revision
    - visibility
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    userId:
      type: string
    type:
      type: string
      enum: [RESUME, COVER_LETTER, PORTFOLIO, LINK_IN_BIO]
    title:
      type: string
    slug:
      type: string
      description: Unique per user. Also used as the portfolio subdomain slug for PORTFOLIO documents.
    tags:
      type: array
      items:
        type: string
    content:
      type: object
      additionalProperties: true
      description: Document-type-specific JSON payload (resume schema, portfolio schema, etc).
    metadata:
      type: object
      nullable: true
      additionalProperties: true
    templateId:
      type: string
      default: modern
    schemaVersion:
      type: integer
    revision:
      type: integer
      description: Incremented on every update. Required (and checked) on PATCH for optimistic concurrency control.
    visibility:
      type: string
      enum: [PRIVATE, UNLISTED, PUBLIC]
    lastSyncedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: Set by soft delete. Documents with a non-null deletedAt are excluded from list/get.

DocumentListResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: array
      items:
        $ref: "#/Document"

DocumentResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/Document"

DocumentCreateRequest:
  type: object
  required: [type]
  properties:
    id:
      type: string
      description: Optional client-generated id. If a document with this id already exists for the caller, it is returned as-is (idempotent create).
    type:
      type: string
      enum: [RESUME, COVER_LETTER, PORTFOLIO, LINK_IN_BIO]
    title:
      type: string
    slug:
      type: string
    tags:
      type: array
      items:
        type: string
    content:
      type: object
      additionalProperties: true
      description: If omitted for RESUME/COVER_LETTER, content is auto-seeded from the user's MasterProfile when one exists.
    metadata:
      type: object
      additionalProperties: true
    templateId:
      type: string
    visibility:
      type: string
      enum: [PRIVATE, UNLISTED, PUBLIC]

DocumentUpdateRequest:
  type: object
  required: [revision]
  properties:
    title:
      type: string
    slug:
      type: string
    updateShareSlug:
      type: boolean
      description: When true and an active share link exists, its slug is updated to track the new document slug.
    tags:
      type: array
      items:
        type: string
    content:
      type: object
      additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
    templateId:
      type: string
    visibility:
      type: string
      enum: [PRIVATE, UNLISTED, PUBLIC]
    revision:
      type: integer
      description: Must match the document's current revision. Mismatch returns 409.

##################################################
# ATS SCHEMA
##################################################

AtsRuleResult:
  type: object
  properties:
    id:
      type: string
    category:
      type: string
      description: "One of: parse, contact, structure, content, format."
    severity:
      type: string
      enum: [info, warning, error]
    passed:
      type: boolean
    evidence:
      type: string
    scoreImpact:
      type: integer
    fix:
      type: string

AtsReport:
  description: |
    Deterministic, rule-based ATS report. Computed entirely server-side without calling any AI
    provider. Shape depends on the caller's auth state: anonymous requests to `/ats/check` get
    `AtsRestrictedReport` (score + verdict only); any authenticated user (free or subscriber)
    gets `AtsFullReport`. `/ats/analyze` requires auth and always returns `AtsFullReport`.
  oneOf:
    - $ref: "#/AtsFullReport"
    - $ref: "#/AtsRestrictedReport"

AtsFullReport:
  type: object
  description: Full deterministic report — every rule's evidence, all matched/missing keywords, all prioritized fixes. Requires an authenticated caller.
  properties:
    version:
      type: string
      enum: [ats-v2]
    restricted:
      type: boolean
      enum: [false]
    verdict:
      type: string
      enum: [strong, needs-work, weak]
    readinessScore:
      type: integer
    jobMatchScore:
      type: integer
      nullable: true
    matchedKeywords:
      type: array
      items:
        type: string
    missingKeywords:
      type: array
      items:
        type: string
    parsingWarnings:
      type: array
      items:
        type: string
    strengths:
      type: array
      items:
        type: string
    failedChecks:
      type: array
      items:
        $ref: "#/AtsRuleResult"
    prioritizedFixes:
      type: array
      items:
        type: string
    rules:
      type: array
      items:
        $ref: "#/AtsRuleResult"
    categories:
      type: array
      items:
        $ref: "#/AtsCategoryScore"
    checksPassed:
      type: integer
      description: Number of deterministic rules the resume passed.
    checksTotal:
      type: integer
      description: Total number of deterministic rules evaluated.
    wordCount:
      type: integer
      description: Words counted in the extracted resume text.
    parsed:
      $ref: "#/AtsParsedResume"

AtsCategoryScore:
  type: object
  description: |
    Per-area rollup of the deterministic rules, saying which part of the resume is losing points
    without revealing which rule fired or what it weighs. Authenticated callers only — the rollup
    carries most of the diagnostic value, so it is not part of the anonymous shape.
  properties:
    category:
      type: string
      description: Rule category key, e.g. `parse`, `contact`, `structure`, `content`, `format`.
    score:
      type: integer
      description: Percentage of this category's own weight the resume kept (0-100).
    passed:
      type: integer
      description: Rules in this category that passed.
    total:
      type: integer
      description: Rules evaluated in this category.
    lost:
      type: integer
      description: Points this category actually cost.
    possible:
      type: integer
      description: Worst-case points this category could have cost.

AtsRestrictedReport:
  type: object
  description: |
    Returned instead of AtsFullReport when /ats/check is called anonymously. A diagnosis without
    the prescription: scores, a verdict, the single most serious problem and the single
    highest-impact fix stated in full, plus honest counts of everything withheld. No per-area
    rollup, no rule evidence, no keyword lists, and no recovered work history — the server never
    sends them, so there is nothing for a client to un-hide.
  properties:
    version:
      type: string
      enum: [ats-v2]
    restricted:
      type: boolean
      enum: [true]
    readinessScore:
      type: integer
    jobMatchScore:
      type: integer
      nullable: true
    verdict:
      type: string
      enum: [strong, needs-work, weak]
    topFix:
      type: string
      nullable: true
      description: The single highest-impact fix, in full. The rest of the list requires auth.
    primaryWarning:
      type: string
      nullable: true
      description: |
        The most serious parsing or formatting failure, phrased as the risk it creates. Structural
        failures outrank heavier content ones here because a candidate cannot self-diagnose them:
        a missing keyword is visible by reading the posting, a column layout that scrambles your
        job titles on extraction is not.
    checksPassed:
      type: integer
    checksTotal:
      type: integer
    matchedKeywordCount:
      type: integer
      description: How many job-description terms the resume covers. The terms themselves require auth.
    missingKeywordCount:
      type: integer
      description: How many job-description terms the resume is missing. The terms themselves require auth.
    parsedRoleCount:
      type: integer
      description: How many work-history rows were recovered. The rows themselves require auth.
    remainingFixCount:
      type: integer
      description: Prioritised fixes beyond the one shown.

AtsAiInsights:
  type: object
  nullable: true
  description: Null when the AI step was skipped (e.g. `/check`, which never calls AI).
  properties:
    explanation:
      type: string
    missingEvidence:
      type: array
      items:
        type: string
    keywordOpportunities:
      type: array
      items:
        type: string
    recommendedImprovements:
      type: array
      items:
        type: string
    priorityOrder:
      type: array
      items:
        type: string

AtsQuotaSummary:
  type: object
  properties:
    tier:
      type: string
      enum: [anonymous, free, subscriber]
    limit:
      type: integer
      description: "1 for anonymous callers per 48h window, 2 for free logged-in users per 24h window, 300 for subscribers per billing period."
    used:
      type: integer
    remaining:
      type: integer
    resetsAt:
      type: string
      format: date-time
    canConvertResume:
      type: boolean
      description: True only for active AI Credits / Bundle subscribers — gates access to /ats/convert-resume.
    pricing:
      type: object
      properties:
        analysisCredits:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        jobUrlAnalysisCredits:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        resumeConversionCredits:
          type: integer
    extract:
      type: object
      description: Separate budget for resume file uploads (POST /ats/extract) — does not share the scan quota above.
      properties:
        limit:
          type: integer
        used:
          type: integer
        remaining:
          type: integer

AtsQuotaResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/AtsQuotaSummary"

AtsParsedResume:
  type: object
  description: |
    The fields an applicant tracking system recovers from the document — the "what the ATS sees"
    view. Produced by the same deterministic pass as the scores, so it never costs a second scan.
    A blank employer or a missing date range is a column a recruiter's filter cannot match on,
    which is why the rows are returned verbatim rather than only summarised.
  properties:
    name: { type: string }
    email: { type: string }
    phone: { type: string }
    links:
      type: array
      items: { type: string }
    roles:
      type: array
      description: One row per job, in the shape an ATS stores it.
      items:
        type: object
        properties:
          title: { type: string }
          employer: { type: string }
          current: { type: boolean }
          start:
            $ref: "#/AtsParsedDate"
          end:
            $ref: "#/AtsParsedDate"
    education:
      type: array
      items:
        type: object
        properties:
          school: { type: string }
          credential: { type: string }
          level:
            type: string
            nullable: true
            enum: [diploma, associate, bachelor, master, doctorate]
          end:
            $ref: "#/AtsParsedDate"
    skills:
      type: array
      items: { type: string }
    monthsOfExperience:
      type: integer
      nullable: true
      description: Calendar months covered by at least one role, so overlapping jobs are counted once.
    highestDegree:
      type: string
      nullable: true
      enum: [diploma, associate, bachelor, master, doctorate]

AtsParsedDate:
  type: object
  nullable: true
  properties:
    year: { type: integer }
    month:
      type: integer
      nullable: true
      description: Null when the resume gave only a year.

AtsLayoutSignals:
  type: object
  required: [columnRatio, tableCount, pageCount]
  description: |
    Page geometry measured while parsing an uploaded document, for the format checks that text
    alone cannot answer. Returned by `POST /ats/extract` and accepted back by `/ats/check` and
    `/ats/analyze`. When it is omitted, the rules that depend on it are left out of the report
    entirely — neither passed nor failed — and out of the score's denominator.
  properties:
    columnRatio:
      type: number
      nullable: true
      minimum: 0
      maximum: 1
      description: Share of content lines split across a horizontal gutter — the signature of a two-column layout, sidebar, or floating text box, all of which extract in a scrambled reading order. Null when the document had too few content lines for the measurement to carry signal.
    tableCount:
      type: integer
      minimum: 0
      description: Number of ruled table grids found by tracing the page's vector drawing operators.
    pageCount:
      type: integer
      minimum: 0

AtsExtractResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        text:
          type: string
          description: Plain text extracted from the uploaded PDF, DOCX, TXT, Markdown, or JSON resume file (max ~50,000 characters).
        layout:
          $ref: "#/AtsLayoutSignals"

AtsCheckRequest:
  type: object
  required: [resume]
  properties:
    resume:
      description: Resume text, or a JSON Resume-shaped object. Either is accepted.
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
    jobDescription:
      type: string
      description: Optional plain-text job description to compute a jobMatchScore against.
    layout:
      $ref: "#/AtsLayoutSignals"

AtsCheckResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        report:
          $ref: "#/AtsReport"
        ai:
          type: "null"
        creditsSpent:
          type: integer
          enum: [0]
        quota:
          $ref: "#/AtsQuotaSummary"

AtsAnalyzeRequest:
  type: object
  required: [resume, requestId]
  properties:
    resume:
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
    jobDescription:
      type: string
    jobUrl:
      type: string
      format: uri
      description: Required when fetchJobUrl is true. Fetched server-side through an SSRF-hardened HTTPS-only fetcher (blocks localhost/private/link-local IPs, pins the resolved IP for the whole request, caps redirects to 3, response size to 2MB, and timeout to 8s).
    fetchJobUrl:
      type: boolean
      default: false
    requestId:
      type: string
      minLength: 8
      description: Client-generated idempotency key for the underlying AI credit reservation.
    layout:
      $ref: "#/AtsLayoutSignals"

AtsAnalyzeResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      description: |
        AI insights are drawn from the same shared ATS scan-quota bucket consumed by `/ats/check` —
        there is only one ATS quota, not separate "scan" and "AI" allowances.
      properties:
        report:
          $ref: "#/AtsReport"
        ai:
          $ref: "#/AtsAiInsights"
        aiStatus:
          type: string
          enum: [ok, unavailable]
          description: |
            `unavailable` means no model could be routed for this request — a server-side
            configuration problem, not a bad request. The deterministic report is still returned,
            `ai` is null, no credits are charged, and the scan quota unit is refunded, so
            `quota` reflects the balance after the refund.
        creditsSpent:
          type: integer
        quota:
          $ref: "#/AtsQuotaSummary"

AtsConvertResumeRequest:
  type: object
  required: [resume, requestId]
  properties:
    resume:
      type: string
      minLength: 1
      description: Raw resume text to convert into structured JSON Resume fields.
    requestId:
      type: string
      minLength: 8

AtsConvertedResume:
  type: object
  description: AI-extracted resume fields. Every field defaults to an empty string/array when not explicitly present in the source text — nothing is invented.
  properties:
    basics:
      type: object
      properties:
        fullName:
          type: string
        role:
          type: string
        headline:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
    links:
      type: array
      items:
        type: object
        properties:
          label:
            type: string
          url:
            type: string
    summary:
      type: string
    experience:
      type: array
      items:
        type: object
        additionalProperties: true
    education:
      type: array
      items:
        type: object
        additionalProperties: true
    projects:
      type: array
      items:
        type: object
        additionalProperties: true
    skills:
      type: array
      items:
        type: object
        additionalProperties: true

AtsConvertResumeResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        resume:
          $ref: "#/AtsConvertedResume"
        creditsSpent:
          type: integer
          description: Requires an active AI Credits or Bundle entitlement — this endpoint spends credits independently of the shared ATS scan quota above.

##################################################
# AI SCHEMA
##################################################

AiActionKey:
  type: string
  enum:
    - rewrite_short_text
    - rewrite_section
    - generate_section
    - generate_portfolio_copy
    - generate_cover_letter
    - tailor_resume_to_job
    - generate_document

AiActionCost:
  type: object
  properties:
    costs:
      type: object
      properties:
        standard:
          type: integer
        expert:
          type: integer

AiActionsResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      description: |
        Map of AI action key to its credit cost per mode, containing an entry for every action in
        `AiActionKey`. The values below are illustrative only — real costs come from server-side
        configuration, so read them from this endpoint rather than hardcoding them.
      additionalProperties:
        $ref: "#/AiActionCost"
      example:
        rewrite_short_text: { costs: { standard: 1, expert: 3 } }
        generate_cover_letter: { costs: { standard: 4, expert: 10 } }

AiGenerateRequest:
  type: object
  required: [action, input, requestId]
  properties:
    action:
      $ref: "#/AiActionKey"
    mode:
      type: string
      enum: [standard, expert]
      default: standard
      description: Expert mode uses a stronger model at a higher credit cost.
    input:
      type: object
      description: |
        Required, though every field inside it is optional and defaults to an empty string. At
        least one of `text`, `context`, or `jobDescription` must be non-empty or the request fails
        with `400`. Per-action character limits apply — see `GET /ai/actions`.
      properties:
        text:
          type: string
          maxLength: 50000
          default: ""
        context:
          type: string
          maxLength: 50000
          default: ""
        jobDescription:
          type: string
          maxLength: 20000
          default: ""
          description: Silently truncated to the action's own job-description limit rather than rejected.
        instructions:
          type: string
          maxLength: 500
          default: ""
    requestId:
      type: string
      minLength: 8
      maxLength: 200
      description: Client-generated idempotency key. Credits are reserved against this id before generation and only committed on success — a failed or errored generation releases the reservation instead of spending credits.
    documentId:
      type: string
      minLength: 1
      maxLength: 200
      description: Optional document to associate the credit transaction with.

AiGenerateResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        content:
          type: string
        usage:
          type: object
          nullable: true
          properties:
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            totalTokens:
              type: integer
        credits:
          type: object
          properties:
            spent:
              type: integer
            balance:
              type: integer
              description: AI credit wallet balance after this generation.

##################################################
# PORTFOLIO SCHEMA
##################################################

PortfolioPublicSummary:
  type: object
  properties:
    subdomain:
      type: string
    updatedAt:
      type: string
      format: date-time

PortfolioPublicListResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: array
      items:
        $ref: "#/PortfolioPublicSummary"

PortfolioPublication:
  type: object
  properties:
    id:
      type: string
    subdomain:
      type: string
    templateId:
      type: string
      enum: [signal, atelier, nimbus, cipher]
    snapshot:
      type: object
      additionalProperties: true
      description: Published portfolio content snapshot (validated against the portfolio content schema at publish time).
    status:
      type: string
      enum: [LIVE, GRACE, SUSPENDED]
    updatedAt:
      type: string
      format: date-time
    isPremium:
      type: boolean
      description: Whether the owner currently has an active portfolio_pro/bundle subscription.

PortfolioPublicResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/PortfolioPublication"

PortfolioPublicationRecord:
  type: object
  description: |
    The stored publication row as the owner sees it. This is a different shape from the public read
    endpoint: it exposes the owner-only bookkeeping columns and has no `isPremium`.
  required:
    - id
    - userId
    - documentId
    - subdomain
    - templateId
    - snapshot
    - status
    - publishedRevision
    - publishedAt
    - updatedAt
  properties:
    id:
      type: string
    userId:
      type: string
    documentId:
      type: string
    subdomain:
      type: string
    templateId:
      type: string
      enum: [signal, atelier, nimbus, cipher]
    snapshot:
      type: object
      additionalProperties: true
    status:
      type: string
      enum: [LIVE, GRACE, SUSPENDED]
    publishedRevision:
      type: integer
      description: The draft `revision` that was published.
    suspensionReason:
      type: string
      nullable: true
      description: One of `grace_expired` or `user_unpublished` when the portfolio is suspended.
    suspendedAt:
      type: string
      format: date-time
      nullable: true
    publishedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

PortfolioPublishResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      allOf:
        - $ref: "#/PortfolioPublicationRecord"
        - type: object
          required: [publicUrl]
          properties:
            publicUrl:
              type: string
              description: |
                `https://{subdomain}.veriworkly.com` in production, or
                `http://{subdomain}.localhost:3004` in development. Added by the publish endpoint
                only — it is not a stored column.
              example: "https://janedoe.veriworkly.com"

PortfolioUnpublishResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      description: |
        The updated publication record with `status: SUSPENDED`, or null when the caller had never
        published a portfolio. No `publicUrl` is included.
      oneOf:
        - $ref: "#/PortfolioPublicationRecord"
        - type: "null"

PortfolioDraft:
  type: object
  description: |
    A trimmed projection of the caller's PORTFOLIO-type Document — not a full `Document`. Only the
    fields below are selected.
  required: [id, slug, templateId, content, revision, updatedAt]
  properties:
    id:
      type: string
    slug:
      type: string
      description: Kept in sync with the portfolio subdomain.
    templateId:
      type: string
      enum: [signal, atelier, nimbus, cipher]
    content:
      type: object
      additionalProperties: true
      description: The saved portfolio content snapshot.
    revision:
      type: integer
      description: Send this back as `revision` when saving or publishing.
    updatedAt:
      type: string
      format: date-time

PortfolioDraftResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/PortfolioDraft"

PortfolioPreview:
  type: object
  description: Same projection as `PortfolioDraft` minus `slug`.
  required: [id, templateId, content, revision, updatedAt]
  properties:
    id:
      type: string
    templateId:
      type: string
      enum: [signal, atelier, nimbus, cipher]
    content:
      type: object
      additionalProperties: true
    revision:
      type: integer
    updatedAt:
      type: string
      format: date-time

PortfolioPreviewResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/PortfolioPreview"

PortfolioMe:
  type: object
  properties:
    draft:
      description: Null when the caller has never saved a portfolio draft.
      oneOf:
        - $ref: "#/PortfolioDraft"
        - type: "null"
    publication:
      type: object
      nullable: true
      properties:
        subdomain:
          type: string
        status:
          type: string
          enum: [LIVE, GRACE, SUSPENDED]
        publishedRevision:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    billing:
      type: object
      additionalProperties: true
      description: Same shape as the Billing "/billing/me" response.

PortfolioMeResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/PortfolioMe"

PortfolioSaveDraftRequest:
  type: object
  required: [subdomain, snapshot]
  properties:
    documentId:
      type: string
      description: Omit to create (or continue) the user's single PORTFOLIO document.
    subdomain:
      type: string
      maxLength: 63
    revision:
      type: integer
      description: Required once a draft already exists, for optimistic concurrency (409 on mismatch).
    snapshot:
      type: object
      additionalProperties: true
      description: Portfolio content. The draft schema is more permissive than the publish schema (empty strings allowed) so incomplete drafts can still be saved.

PortfolioPublishRequest:
  type: object
  required: [documentId, subdomain, revision]
  properties:
    documentId:
      type: string
    subdomain:
      type: string
      maxLength: 63
    revision:
      type: integer
      description: Must match the draft's current revision (save the latest draft first).

PortfolioAnalytics:
  type: object
  properties:
    totalViews:
      type: integer
    daily:
      type: array
      items:
        type: object
        properties:
          date:
            type: string
            format: date-time
          count:
            type: integer
    referrers:
      type: array
      items:
        type: object
        properties:
          host:
            type: string
          count:
            type: integer

PortfolioAnalyticsResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/PortfolioAnalytics"

PortfolioSubdomainAvailabilityResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        subdomain:
          type: string
        available:
          type: boolean

##################################################
# PORTFOLIO ASSET SCHEMA
##################################################

PortfolioAssetUploadRequest:
  type: object
  required: [kind, mimeType, sizeBytes]
  properties:
    kind:
      type: string
      enum: [AVATAR, PROJECT_COVER, SOCIAL_IMAGE]
    mimeType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    sizeBytes:
      type: integer
      maximum: 5242880
      description: Must be greater than 0 and no more than 5 MB.

PortfolioAssetUploadResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        assetId:
          type: string
        uploadUrl:
          type: string
          description: Presigned Cloudflare R2 PUT URL. Upload the file directly to this URL with a matching Content-Type/Content-Length.
        expiresInSeconds:
          type: integer
          enum: [600]

PortfolioAssetCompleteRequest:
  type: object
  required: [assetId]
  properties:
    assetId:
      type: string
    checksum:
      type: string
      description: Optional ETag to verify against the uploaded object.

PortfolioAssetCompleteResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: |
            Public CDN URL. Only returned after a server-side HEAD request against R2 confirms the
            uploaded object's size, content type, and (optionally) checksum match what was declared
            when the upload URL was requested.

##################################################
# BILLING SCHEMA
##################################################

BillingSummary:
  type: object
  properties:
    plan:
      type: string
      enum: [FREE, AI_CREDITS, PORTFOLIO_PRO, BUNDLE]
    productKey:
      type: string
      nullable: true
      enum: [ai_credits, portfolio_pro, bundle, null]
    activeProductKeys:
      type: array
      items:
        type: string
    status:
      type: string
      description: Subscription status (e.g. ACTIVE, TRIALING, INACTIVE).
    interval:
      type: string
      nullable: true
      enum: [one_day, seven_day, monthly, annual, null]
    currentPeriodEnd:
      type: string
      format: date-time
      nullable: true
    cancelAtPeriodEnd:
      type: boolean
    graceEndsAt:
      type: string
      format: date-time
      nullable: true
    canPublish:
      type: boolean
      description: Portfolio-publish entitlement is a separate system from the AI credit wallet below.
    eligibleForTrial:
      type: boolean
    accessEndsAt:
      type: string
      format: date-time
      nullable: true
    publicationStatus:
      type: string
      enum: [LIVE, GRACE, SUSPENDED]
    entitlements:
      type: array
      items:
        type: string
    credits:
      $ref: "#/CreditWallet"
    catalog:
      type: object
      additionalProperties: true
      description: Public product/pricing catalog (prices, intervals, entitlements per plan).
    creditEconomics:
      type: object
      additionalProperties: true
    addOns:
      type: array
      items:
        type: object
        properties:
          key:
            type: string
          name:
            type: string

BillingSummaryResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/BillingSummary"

BillingHistoryEvent:
  type: object
  properties:
    id:
      type: string
    providerEventId:
      type: string
    type:
      type: string
    processedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time

BillingHistoryResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: array
      items:
        $ref: "#/BillingHistoryEvent"

CreditWallet:
  type: object
  properties:
    balance:
      type: integer
    reserved:
      type: integer
      description: Credits currently held by in-flight AI generations that have not yet committed or been released.
    lifetimeCredited:
      type: integer
    lifetimeDebited:
      type: integer
    nextExpiryAt:
      type: string
      format: date-time
      nullable: true
    nextExpiryCredits:
      type: integer
    updatedAt:
      type: string
      format: date-time

CreditWalletResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/CreditWallet"

CreditHistoryEntry:
  type: object
  additionalProperties: true
  properties:
    id:
      type: string
    action:
      type: string
    cost:
      type: integer
    balanceAfter:
      type: integer
    createdAt:
      type: string
      format: date-time

CreditHistoryResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: array
      items:
        $ref: "#/CreditHistoryEntry"

CheckoutRequest:
  type: object
  required: [interval]
  properties:
    productKey:
      type: string
      enum: [ai_credits, portfolio_pro, bundle]
      default: portfolio_pro
      description: Validated against a fixed product/interval whitelist before being handed off to the Dodo Payments checkout API.
    interval:
      type: string
      enum: [one_day, seven_day, monthly, annual]
    redirectUrl:
      type: string
      description: Relative path (must start with a single `/`) to return to after checkout.

CheckoutResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        url:
          type: string
          description: Dodo Payments hosted checkout URL to redirect the user to.

CancelCheckoutResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        success:
          type: boolean

BillingPortalResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        url:
          type: string
          description: Dodo Payments customer portal URL.

CreditPackCheckoutRequest:
  type: object
  required: [packKey]
  properties:
    packKey:
      type: string
      enum: [credit_pack_250, credit_pack_500]
    redirectUrl:
      type: string
      description: Relative path (must start with a single `/`) to return to after checkout.

CreditPackCheckoutResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        url:
          type: string
          description: Dodo Payments hosted checkout URL for the one-time credit pack purchase.

##################################################
# SHARE SCHEMA
##################################################

ShareLink:
  type: object
  properties:
    id:
      type: string
    userId:
      type: string
    documentId:
      type: string
    slug:
      type: string
    token:
      type: string
      description: Same value as `slug` — the public path segment for this link.
    username:
      type: string
    documentSlug:
      type: string
    publicPath:
      type: string
      description: |
        Convenience path built from the owner's username and the link slug. Only returned by
        `POST /shares`, not by the list endpoint.
      example: "/janedoe/my-resume"
    snapshot:
      type: object
      additionalProperties: true
      description: The static content snapshot captured when the link was created.
    hasPassword:
      type: boolean
      description: The scrypt password hash itself is never returned in any API response.
    expiresAt:
      type: string
      format: date-time
      nullable: true
    viewCount:
      type: integer
    lastViewedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ShareLinkCreateRequest:
  type: object
  required: [documentId, snapshot]
  properties:
    documentId:
      type: string
    snapshot:
      type: object
      additionalProperties: true
      description: Static content snapshot captured at share time.
    password:
      type: string
      description: When provided, the link is scrypt-hashed and requires this password to view.
    expiresAt:
      type: string
      format: date-time
      nullable: true
    noExpiry:
      type: boolean
    updateSlug:
      type: boolean
      description: Regenerate the public slug instead of reusing the existing one (if a link already exists for this document).
    removePassword:
      type: boolean

ShareLinkResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/ShareLink"

ShareLinkListResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      allOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/ShareLink"
        - $ref: "#/OffsetPaginationMeta"

SharedDocumentIdsResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string

PublicSharePayload:
  type: object
  properties:
    passwordRequired:
      type: boolean
    resumeTitle:
      type: string
    documentTitle:
      type: string
    expiresAt:
      type: string
      format: date-time
      nullable: true
    snapshot:
      type: object
      additionalProperties: true
      description: Only present once no password is required, or after successful verification.

PublicShareResponse:
  type: object
  required: [success, message, data]
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: "#/PublicSharePayload"

VerifySharePasswordRequest:
  type: object
  required: [password]
  properties:
    password:
      type: string
      minLength: 1

##################################################
# AFFILIATE SCHEMA
##################################################

AffiliateClickRequest:
  type: object
  required: [code]
  properties:
    code:
      type: string
      minLength: 4
      maxLength: 32
    referrerHost:
      type: string

AffiliateClickResponse:
