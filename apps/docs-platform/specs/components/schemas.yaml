    emailVerified:
      type: boolean
    autoSyncEnabled:
      type: boolean
    shareResumeCount:
      type: integer
      description: Number of ShareLink records owned by the user.

MasterProfileLink:
  type: object
  properties:
    id:
      type: string
    type:
      type: string
      enum: [github, linkedin, dribbble, twitter, portfolio, behance, medium, youtube, custom]
    label:
      type: string
    url:
      type: string

MasterProfileBasics:
  type: object
  description: All properties are required when writing — this object is validated strictly.
  required:
    - fullName
    - role
    - headline
    - email
    - phone
    - location
    - linkEmail
    - linkPhone
    - linkLocation
  properties:
    fullName:
      type: string
      maxLength: 120
    role:
      type: string
      maxLength: 120
    headline:
      type: string
      maxLength: 250
    email:
      type: string
      format: email
      description: Must be a valid email address. An empty string is rejected.
    phone:
      type: string
      maxLength: 24
      description: |
        Must contain exactly 10 digits once non-digit characters are ignored, so `"9876543210"` and
        `"(987) 654-3210"` both pass. The value is stored as sent — it is not reformatted — and an
        empty string is rejected.
    location:
      type: string
      maxLength: 120
    linkEmail:
      type: boolean
    linkPhone:
      type: boolean
    linkLocation:
      type: boolean

