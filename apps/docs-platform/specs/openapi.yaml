openapi: 3.1.0
info:
  title: VeriWorkly API
  version: 1.0.0
  description: |
    The official API reference for VeriWorkly.

    ### Authentication Methods

    VeriWorkly supports two authentication methods:

    #### 1. API Key Authentication (recommended for scripts and integrations)
    For programmatic access, send your key either way — both are accepted:

    - `X-API-Key: vw_...`
    - `Authorization: Bearer vw_...`

    A key is **required** for any request that does not originate from a whitelisted VeriWorkly
    origin, including requests made from these documentation pages.

    - **Format**: `vw_` followed by 64 hexadecimal characters.
    - **Rate limit**: 20 requests per 15 minutes per key by default, configurable per key at
      creation. Responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and
      `X-RateLimit-Reset`.
    - **Scopes**: keys are scope-gated. A key missing a route's required scope gets `403`. Session
      callers are never scope-gated.

    #### 2. Session Authentication (dashboard only)
    Used internally by the VeriWorkly dashboard and resume builder, via secure HTTP-only cookies
    issued by Better Auth.

    - **Cookies**:
      - Local: `veriworkly-auth.session_token`
      - Production: `__Secure-veriworkly-auth.session_token`
    - **Note**: sessions are only honoured for whitelisted origins. Send `credentials: 'include'`
      (fetch) or `withCredentials: true` (axios). Requests from these documentation pages **must**
      use an API key.

    #### Endpoints that need neither
    Only `GET /api/v1/health` and `GET /api/v1/health/ready` are fully open. Everything else —
    including the endpoints labelled "public", such as public portfolios and share links — still
    requires an API key or a whitelisted first-party origin, and returns `401` without one.

    ### Response Envelope

    Every endpoint under `/api/v1` except the Better Auth routes at `/api/v1/auth/*` returns
    `{ success, message, data }` on success and `{ success, message, statusCode, details? }` on
    failure. Better Auth endpoints return their own payload shapes.

    ### Not Documented Here

    `/api/v1/contact`, `/api/v1/stats/events` and everything under `/api/v1/admin/*` are internal
    first-party routes. They are left out of this reference on purpose and are not part of the
    supported public API.

servers:
  - url: https://api.veriworkly.com
    description: Production Server
  - url: http://localhost:8080
    description: Local Development

tags:
  - name: Health
    description: Service health and readiness checks.
  - name: Users
    description: Operations related to authenticated users.
  - name: Roadmap
    description: Operations related to roadmap.
  - name: Changelog
    description: Published release notes, filtering, and contributor statistics.
  - name: GitHub
    description: GitHub issues, pull requests, and repository statistics.
  - name: Authentication
    description: Authentication operations using email OTP and sessions.
  - name: API Keys
    description: Operations related to managing personal API keys.
  - name: Profile
    description: The authenticated user's master profile — the single source of truth new documents are seeded from.
  - name: Profile Import
    description: Importing a master profile from GitHub (real OAuth) or LinkedIn (AI-parsed paste).
  - name: Documents
    description: CRUD for resumes, cover letters, portfolios, and link-in-bio documents.
  - name: ATS
    description: Deterministic and AI-assisted ATS resume scanning against a job description.
  - name: AI
    description: AI-powered content generation actions and their credit costs.
  - name: Portfolios
    description: Public portfolio pages, drafts, publishing, and analytics.
  - name: Portfolio Assets
    description: Presigned image uploads for portfolio avatars, project covers, and social images.
  - name: Billing
    description: Subscriptions, AI credit wallet, and Dodo Payments checkout/portal sessions.
  - name: Shares
    description: Public, optionally password-protected share links for documents.
  - name: Affiliates
    description: Affiliate enrollment, referrals, commissions, and withdrawals. Off by default in production behind a feature flag.
  - name: Ambassador
    description: Campus ambassador program application intake. Off by default in production behind a feature flag.
  - name: Stats
    description: Product usage events counted toward VeriWorkly's daily usage metrics.

