<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="currentColor" role="img" aria-label="VeriWorkly">
  <title>VeriWorkly</title>
  <!--
    Single-colour logomark. Inherits `currentColor`, so it takes the surrounding
    text colour - set it explicitly when you need white on a dark ground.
    Use this for one-colour print, embroidery, favicons under 32px, and any
    ground where the faceted mark would lose contrast.
    Same geometry as veriworkly-logo.svg.
  -->
