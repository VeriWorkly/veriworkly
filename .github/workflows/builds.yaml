name: Build Apps

on:
  push:
    branches: [master]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080/api/v1"
  BACKEND_INTERNAL_URL: "http://localhost:8080/api/v1"
  SITE_URL: "http://localhost:3000"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  # The studio's own origin (metadata, sitemap, the Origin header on API calls).
  NEXT_PUBLIC_APP_URL: "http://localhost:3001"
  AUTH_SECRET: "dummy-secret-for-build-purposes-only"
  AUTH_BASE_URL: "http://localhost:8080"
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@veriworkly/site"
          - "@veriworkly/studio"
          - "@veriworkly/portfolio"
          - "@veriworkly/blog-platform"
          - "@veriworkly/docs-platform"
          - "@veriworkly/server"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma Generate
        run: npm exec -w @veriworkly/server -- prisma generate --schema=prisma/schema.prisma

      - name: Mock Portfolio Template Library
        run: node scripts/mock-template-library.mjs

      # The studio and server build it in their own `prebuild`.
      - name: Build Shared Packages
        if: matrix.workspace != '@veriworkly/studio' && matrix.workspace != '@veriworkly/server'
        run: npm run build -w @veriworkly/profile-core --if-present

      # The docs and blog bake SITE_URL into canonicals, sitemaps and social cards, so they build
      # with their production host; the other apps keep the workflow default.
      - name: Build Application
        run: npm run build -w ${{ matrix.workspace }}
        env:
          SITE_URL: ${{ matrix.workspace == '@veriworkly/docs-platform' && 'https://docs.veriworkly.com' || matrix.workspace == '@veriworkly/blog-platform' && 'https://blog.veriworkly.com' || 'http://localhost:3000' }}
