name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080/api/v1"
  BACKEND_INTERNAL_URL: "http://localhost:8080/api/v1"
  AUTH_BASE_URL: "http://localhost:8080"
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

# SITE_URL and AUTH_SECRET are set only on the jobs whose apps read them: the server reads both;
# the blog, docs and portfolio read SITE_URL. The studio, site and UI package read neither.

# @veriworkly/ats-engine is tested in its own repository (VeriWorkly/ats-engine) and installed here
# from npm, already built.
jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    env:
      SITE_URL: "http://localhost:3000"
      AUTH_SECRET: "dummy-secret-for-build-purposes-only"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma Generate
        run: npm exec -w @veriworkly/server -- prisma generate --schema=prisma/schema.prisma

      - name: Build Shared Packages
        run: npm run build -w @veriworkly/profile-core --if-present

      - name: Type-check server tests and scripts
        run: |
          npx tsc --noEmit -p apps/server/tests/tsconfig.json
          npx tsc --noEmit -p apps/server/scripts/tsconfig.json

      - name: Run Backend Tests
        run: npm run test -w @veriworkly/server --if-present

  test-site:
    name: Test Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Site Tests
        run: npm run test:contracts -w @veriworkly/site --if-present

  test-blog:
    name: Test Blog
    runs-on: ubuntu-latest
    env:
      SITE_URL: "http://localhost:3000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Claims, metadata, feed and content tests. The claims tests read prices and limits from
      # apps/server/src as text, so a server change that a post contradicts fails here.
      - name: Run Blog Tests
        run: npm run test -w @veriworkly/blog-platform

  test-ui:
    name: Test UI Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check UI Package
        run: npm run typecheck -w @veriworkly/ui

      - name: Run UI Tests
        run: npm run test -w @veriworkly/ui

  test-docs:
    name: Test Docs
    runs-on: ubuntu-latest
    # The docs read SITE_URL; the API reference step loads the server's config.
    env:
      SITE_URL: "http://localhost:3000"
      AUTH_SECRET: "dummy-secret-for-build-purposes-only"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # The check below compares the pages with the engine the docs install, so it cannot see the
      # server moving to a newer engine. The docs must document the version the server runs.
      - name: Check docs and server use the same ATS Engine
        run: |
          version() { (cd "apps/$1" && node -p 'require("@veriworkly/ats-engine/package.json").version'); }
          docs="$(version docs-platform)"
          server="$(version server)"
          echo "docs $docs, server $server"
          test "$docs" = "$server" || { echo "Bump @veriworkly/ats-engine in apps/docs-platform to $server and run generate:engine."; exit 1; }

      # The ATS Engine reference pages are generated from the installed engine and committed. A
      # bump of @veriworkly/ats-engine without regenerating them fails here.
      - name: Check generated ATS Engine pages are current
        run: |
          npm run generate:engine -w @veriworkly/docs-platform
          changes="$(git status --porcelain -- apps/docs-platform/content/ats-engine)"
          test -z "$changes" || { echo "$changes"; git diff; exit 1; }

      # The server's request validators feed the API reference below (IMPROVEMENTS 14); importing
      # them needs the Prisma enums and the built profile-core schemas.
      - name: Prisma Generate
        run: npm exec -w @veriworkly/server -- prisma generate --schema=prisma/schema.prisma

      - name: Build Shared Packages
        run: npm run build -w @veriworkly/profile-core --if-present

      # The API reference is bundled from apps/docs-platform/specs and committed, together with the
      # served openapi.json and openapi.yaml. Request schemas come from the server's zod validators
      # via specs/generated/requests.json. A spec or validator edit without regenerating fails here.
      # `git status`, not `git diff`, so a page the generator newly creates is caught too. The
      # assignment is on its own line so a failing `git status` stops the step instead of reading
      # as "no changes".
      - name: Check generated API reference is current
        env:
          API_DOCS_STRICT: "1"
        run: |
          npm run generate:openapi -w @veriworkly/server
          npm run generate:api -w @veriworkly/docs-platform
          changes="$(git status --porcelain -- apps/docs-platform/specs/generated apps/docs-platform/openapi.yaml apps/docs-platform/public apps/docs-platform/content/api-reference)"
          test -z "$changes" || { echo "$changes"; git diff; exit 1; }

      - name: Type-check ATS Engine docs samples
        run: npm run check:engine-samples -w @veriworkly/docs-platform

      # Claims, metadata, llms.txt and route tests. The claims tests read prices and limits from
      # apps/server/src as text, so a server change that docs contradict fails here.
      - name: Run Docs Tests
        run: npm run test -w @veriworkly/docs-platform

  test-studio:
    name: Test Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Shared Packages
        run: npm run build -w @veriworkly/profile-core --if-present

      # `next build` type-checks only what the routes import; this also covers tests and configs.
      - name: Type-check Studio
        run: npx tsc --noEmit --incremental false -p apps/studio/tsconfig.json

      - name: Run Studio Tests
        run: npm run test:contracts -w @veriworkly/studio --if-present

  test-portfolio:
    name: Test Portfolio
    runs-on: ubuntu-latest
    env:
      SITE_URL: "http://localhost:3000"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Shared Packages
        run: npm run build -w @veriworkly/profile-core --if-present

      - name: Mock Portfolio Template Library
        run: node scripts/mock-template-library.mjs

      - name: Run Portfolio Tests
        run: npm run test -w @veriworkly/portfolio --if-present

  # Against a real Postgres and Redis: the migration history must rebuild the schema exactly
  # (drift guard), and the integration suite drives `app` with supertest. The unit suite above
  # mocks both stores, which is how a migration that was never written stayed unnoticed.
  integration-server:
    name: Server Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriworkly
          POSTGRES_PASSWORD: veriworkly
          POSTGRES_DB: veriworkly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriworkly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://veriworkly:veriworkly@localhost:5432/veriworkly_test
      SHADOW_DATABASE_URL: postgresql://veriworkly:veriworkly@localhost:5432/veriworkly_shadow
      INTEGRATION_REDIS_URL: redis://localhost:6379/1
      SITE_URL: "http://localhost:3000"
      AUTH_SECRET: "dummy-secret-for-build-purposes-only"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma Generate
        run: npm exec -w @veriworkly/server -- prisma generate --schema=prisma/schema.prisma

      - name: Build Shared Packages
        run: npm run build -w @veriworkly/profile-core --if-present

      - name: Create shadow database
        run: PGPASSWORD=veriworkly psql -h localhost -U veriworkly -d veriworkly_test -c 'CREATE DATABASE veriworkly_shadow'

      - name: Apply migrations
        run: npm run db:migrate:deploy -w @veriworkly/server

      # Exit code 2 means the migrations and schema.prisma disagree: a schema edit shipped without
      # its migration (or one applied with `db push`). Write the migration; never `db push`.
      - name: Migration drift guard
        run: npm run db:drift -w @veriworkly/server

      - name: Run Integration Tests
        run: npm run test:integration -w @veriworkly/server

  # Production runs the compiled server with plain Node under pm2, not the Docker image. Build it,
  # start `node dist/index.js` as production does (NODE_ENV=production, clustered) against a
  # migrated Postgres and a Redis, and require 200 from /api/v1/health and /api/v1/health/ready
  # before stopping it. A boot-time failure (config validation, a module that resolves under tsx
  # but not from dist, a workspace package that was not built) fails here, not on deploy.
  smoke-boot-server:
    name: Server Smoke Boot (Node build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriworkly
          POSTGRES_PASSWORD: veriworkly
          POSTGRES_DB: veriworkly_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriworkly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://veriworkly:veriworkly@localhost:5432/veriworkly_smoke
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply migrations
        run: npm run db:migrate:deploy -w @veriworkly/server

      # `prebuild` builds @veriworkly/profile-core and generates the Prisma client first.
      - name: Build Server
        run: npm run build -w @veriworkly/server

      # Every variable the production config checks require is filled in by the script with a
      # placeholder that reaches no real service; only DATABASE_URL and REDIS_URL come from here.
      - name: Smoke-boot Server
        run: npm run smoke:boot -w @veriworkly/server
