name: Site Lighthouse

# Mobile Lighthouse on the six pages the site audit measures, against a production build
# made with the backend unreachable (the same condition as the Build Apps workflow). The
# numbers go to the job summary on every run and to one sticky comment on a pull request.

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/ui/**"
      - ".github/workflows/site-lighthouse.yaml"
  # Two pull requests can each pass their JS budgets and go over once both are merged.
  push:
    branches: [master]
    paths:
      - "apps/site/**"
      - "packages/ui/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:1/api/v1"
  BACKEND_INTERNAL_URL: "http://127.0.0.1:1/api/v1"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3100"
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Site
        run: npm run build -w @veriworkly/site

      - name: Start Site
        working-directory: apps/site
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/ > /dev/null && exit 0
            sleep 2
          done
          echo "next start did not come up" && exit 1

      # The script already retries a page once; a trace lost twice in a row (NO_NAVSTART) gets one more full run.
      - name: Run Lighthouse
        run: |
          set -o pipefail
          npm run lighthouse:mobile -w @veriworkly/site -- http://localhost:3100 2>&1 | tee lighthouse.log && exit 0
          grep -q "NO_NAVSTART" lighthouse.log || exit 1
          echo "::warning::Lighthouse lost a page trace (NO_NAVSTART); running it once more."
          npm run lighthouse:mobile -w @veriworkly/site -- http://localhost:3100

      - name: Initial JS per Route
        if: always()
        working-directory: apps/site
        run: |
          mkdir -p .lighthouse
          {
            echo ""
            echo "Initial JS per route (module scripts, gzip -9). The job fails when a route is over its budget or is not prerendered."
            echo ""
            npx tsx scripts/measure-js.mts --check
          } >> .lighthouse/summary.md

      - name: Print Summary
        if: always()
        working-directory: apps/site
        run: |
          [ -f .lighthouse/summary.md ] || exit 0
          cat .lighthouse/summary.md
          cat .lighthouse/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-mobile
          path: apps/site/.lighthouse
          include-hidden-files: true

  # Only this job can write to the pull request; it runs no repository code.
  comment:
    name: Comment on Pull Request
    needs: lighthouse
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download Reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lighthouse-mobile
          path: lighthouse

      - name: Comment
        if: steps.download.outcome == 'success' && hashFiles('lighthouse/summary.md') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- site-lighthouse -->";
            const body = `${marker}\n### Site Lighthouse (mobile)\n\n${fs.readFileSync("lighthouse/summary.md", "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
